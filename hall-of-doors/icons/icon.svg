<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%"><stop offset="0" stop-color="#3a1f52"/><stop offset=".55" stop-color="#1a0f2a"/><stop offset="1" stop-color="#0a0612"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="45%"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".75"/><stop offset=".5" stop-color="#ff9a3a" stop-opacity=".25"/><stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7a6a"/><stop offset="1" stop-color="#4a3e36"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a2e14"/><stop offset=".5" stop-color="#8a4a22"/><stop offset="1" stop-color="#5a2e14"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#e0a83a"/><stop offset="1" stop-color="#9a6a18"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6d0"/><stop offset="1" stop-color="#ffb84a"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></linearGradient>
    <clipPath id="arch"><path d="M176 430 V230 a80 80 0 0 1 160 0 V430 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="230" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#ffe9b0"><circle cx="96" cy="104" r="4"/><circle cx="420" cy="88" r="3"/><circle cx="440" cy="190" r="2.5"/><circle cx="70" cy="220" r="2.5"/><path d="M392 140 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" opacity=".9"/><path d="M120 150 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" opacity=".8"/></g>
  <!-- light on floor -->
  <path d="M190 430 L322 430 L420 500 L92 500 Z" fill="url(#floor)"/>
  <!-- stone arch frame -->
  <path d="M146 440 V228 a110 110 0 0 1 220 0 V440 Z" fill="url(#stone)" stroke="#2a201a" stroke-width="6"/>
  <g stroke="#3a2e26" stroke-width="4" fill="none" opacity=".8">
    <path d="M146 300 h30 M336 300 h30 M146 370 h30 M336 370 h30"/>
    <path d="M168 160 l22 22 M344 160 l-22 22 M256 118 v30 M206 128 l10 28 M306 128 l-10 28"/>
  </g>
  <!-- light behind the open door -->
  <path d="M176 430 V230 a80 80 0 0 1 160 0 V430 Z" fill="url(#light)"/>
  <!-- door leaf (slightly open, hinge left) -->
  <g clip-path="url(#arch)">
    <path d="M176 140 L300 150 L300 440 L176 440 Z" fill="url(#wood)"/>
    <g stroke="#3a1a0a" stroke-width="5" opacity=".75"><path d="M207 145 V440 M238 147 V440 M269 149 V440"/></g>
    <rect x="176" y="250" width="124" height="16" fill="#2a1a10"/><rect x="176" y="360" width="124" height="16" fill="#2a1a10"/>
    <g fill="#c99a4a"><circle cx="190" cy="258" r="4"/><circle cx="286" cy="258" r="4"/><circle cx="190" cy="368" r="4"/><circle cx="286" cy="368" r="4"/></g>
    <path d="M300 150 L300 440" stroke="#2a1408" stroke-width="8"/>
  </g>
  <!-- handle -->
  <circle cx="282" cy="318" r="11" fill="url(#gold)" stroke="#6a4a10" stroke-width="3"/>
  <!-- keystone + gold rim -->
  <path d="M146 440 V228 a110 110 0 0 1 220 0 V440" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <path d="M236 108 h40 l-6 34 h-28 z" fill="url(#gold)" stroke="#6a4a10" stroke-width="3"/>
  <!-- step -->
  <rect x="130" y="436" width="252" height="22" rx="6" fill="#3a2e26" stroke="#1a1410" stroke-width="4"/>
</svg>
