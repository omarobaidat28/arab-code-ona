      <div id="xfer"></div>
      <div class="set-row"><label>🔄 ${tx('الإصدار', 'Version')} <span class="muted" dir="ltr">${esc(window.APP_VERSION || '')}</span></label><button class="btn ghost small" id="s-up">${tx('تحقق من التحديثات', 'Check for updates')}</button></div>
      <div class="sheet-actions"><button class="btn" id="s-ok">${tx('تم ✔', 'Done ✔')}</button></div></section>`, 'menu');
    const bindSeg = (id, fn) => $('#' + id).querySelectorAll('button').forEach(b => b.onclick = () => { $('#' + id).querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(b.dataset.v); persist(); });
    bindSeg('s-q', v => { s.q = v; applyQuality(); }); bindSeg('s-lang', v => { if (v !== LANG) { setLang(v); persist(); location.reload(); } }); bindSeg('s-inv', v => s.invert = v === '1');
    bindSeg('s-snd', v => { save.sound = v === '1'; applyVolumes(); }); bindSeg('s-mus', v => { save.music = v === '1'; applyVolumes(); }); bindSeg('s-fps', v => { s.fps = v === '1'; $('#fps').hidden = !s.fps; });
    $('#s-sens').oninput = e => { s.sens = +e.target.value; $('#sv1').textContent = s.sens.toFixed(1); persist(); };
    $('#s-fov').oninput = e => { s.fov = +e.target.value; $('#sv2').textContent = s.fov + '°'; resize(); persist(); };
    $('#s-ok').onclick = () => { if (G.mode === 'title') renderTitle(); else closeModal(); };
    $('#s-up').onclick = () => window.CLOUD && window.CLOUD.checkUpdate(true);
    $('#s-exp').onclick = () => { const code = exportCode(); $('#xfer').innerHTML = `<div class="xfer"><p class="hint">${tx('احتفظ بهذا الرمز (أرسله لنفسك على واتساب مثلاً)، ثم الصقه على الجهاز الجديد من «📥 أدخل رمز تقدّم».', 'Keep this code (e.g. send it to yourself on WhatsApp), then paste it on the new device via “📥 Enter a progress code”.')}</p><textarea id="xcode" readonly dir="ltr">${code}</textarea><button class="btn small" id="xcopy">${tx('📋 نسخ', '📋 Copy')}</button></div>`; const ta = $('#xcode'); ta.select(); $('#xcopy').onclick = () => { ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => qToast(tx('✅ تم نسخ الرمز', '✅ Code copied'), 'good', 2000)).catch(() => { try { document.execCommand('copy'); qToast(tx('✅ تم نسخ الرمز', '✅ Code copied'), 'good', 2000); } catch (e) { qToast(tx('حدّد الرمز وانسخه يدوياً', 'Select the code and copy it manually'), 'bad', 2500); } }); }; };
    $('#s-imp').onclick = () => { $('#xfer').innerHTML = `<div class="xfer"><p class="hint">${tx('الصق رمز التقدّم هنا (يبدأ بـ HOD1-):', 'Paste your progress code here (starts with HOD1-):')}</p><textarea id="xin" dir="ltr" placeholder="HOD1-..."></textarea><button class="btn small" id="xgo">${tx('✔ استرجع تقدّمي', '✔ Restore my progress')}</button><p id="xmsg" class="hint"></p></div>`; $('#xgo').onclick = () => { const r = importCode($('#xin').value); $('#xmsg').textContent = r; }; };
  }
  function exportCode() { const s = Object.assign({}, save); delete s.set; const j = JSON.stringify(s); return 'HOD1-' + btoa(unescape(encodeURIComponent(j))); }
  function importCode(txt) {
    try { const t = String(txt || '').trim().replace(/\s+/g, ''); if (!t.startsWith('HOD1-')) return tx('⚠️ الرمز غير صحيح (يجب أن يبدأ بـ HOD1-)', '⚠️ Invalid code (it must start with HOD1-)');
      const s = JSON.parse(decodeURIComponent(escape(atob(t.slice(5))))); if (typeof s.unlocked !== 'number') return tx('⚠️ الرمز غير صالح', '⚠️ Invalid code');
      const set = save.set; save = Object.assign(blank(), s); save.set = set; persist(); if (!run && !exam) { refreshHub(); renderHUD(); }
      sfx.win(); qToast(`${tx('✅ تم استرجاع تقدّمك:', '✅ Progress restored:')} Lv ${lvlOf(save.xp)} · 🏆 ${Object.keys(save.stars).length}/8`, 'good', 3500); return tx('✅ تم! رجع تقدّمك.', '✅ Done! Your progress is back.');
    } catch (e) { return tx('⚠️ الرمز ناقص أو تالف — تأكد أنك نسخته كاملاً', '⚠️ The code is incomplete or damaged — make sure you copied all of it'); }
  }
  function acctRow() {
    const CL = window.CLOUD; if (!CL || !CL.enabled) return '';
    if (CL.user) return `<div class="acct-row">👤 <b>${esc(CL.displayName())}</b> <span class="muted">· ${tx('☁️ تقدّمك محفوظ في حسابك', '☁️ Your progress is saved to your account')}</span> <button class="btn ghost small" id="t-lb">${tx('🏆 المتصدّرون', '🏆 Leaderboard')}</button> <button class="btn ghost small" id="t-out">${tx('خروج', 'Sign out')}</button></div>`;
    return `<div class="acct-row">👤 ${CL.isGuest() ? tx('تلعب كضيف (الحفظ على هذا الجهاز فقط)', 'Playing as guest (saved on this device only)') : tx('غير مسجّل', 'Not signed in')} <button class="btn small arcane" id="t-in">${tx('🔐 تسجيل الدخول / حساب جديد', '🔐 Sign in / create account')}</button> <button class="btn ghost small" id="t-lb">${tx('🏆 المتصدّرون', '🏆 Leaderboard')}</button></div>`;
  }
  function bindAcct() {
    const CL = window.CLOUD; if (!CL) return;
    const i = $('#t-in'); if (i) i.onclick = () => CL.openLogin(() => renderTitle(), false);
    const o = $('#t-out'); if (o) o.onclick = async () => { await CL.signOut(); renderTitle(); };
    const l = $('#t-lb'); if (l) l.onclick = () => CL.openLeaderboard();
  }
  function renderCodex(li) {
    const tabs = LECTURES.map((L, k) => `<button class="btn ${k === li ? '' : 'ghost'} small" data-li="${k}" ${k > save.unlocked ? 'disabled' : ''}>${k > save.unlocked ? '🔒 ' : ''}${esc(L.ar)}</button>`).join('');
    const L = LECTURES[li]; let n = 0; const scrolls = L.steps.filter(s => s.t === 'room').map(s => scrollHTML(s, ++n)).join('');
    openModal(`<div class="row" style="justify-content:space-between"><h2 style="font-family:var(--f-scroll);color:var(--torch-hi);font-size:28px">${tx('📖 كتاب المعرفة', '📖 Book of Knowledge')}</h2><button class="btn ghost small" id="cb">✕</button></div><div class="row">${tabs}</div><p class="en latin muted mt">${esc(L.code)} · ${esc(L.en)}</p>${scrolls}<div class="sheet-actions"><button class="btn" id="cb2">${tx('إغلاق', 'Close')}</button></div>`, 'menu');
    ui.sheet.querySelectorAll('[data-li]').forEach(b => b.onclick = () => renderCodex(+b.dataset.li));
    $('#cb').onclick = $('#cb2').onclick = () => { if (G.mode === 'title') renderTitle(); else closeModal(); };
  }
  function renderTitle() {
    if (run || exam) { run = null; exam = null; buildHub(); }
    setDock(''); setQCard(''); ui.boss.hidden = true;
    G.mode = 'title'; renderHUD(); ui.prompt.hidden = true; ui.cross.hidden = true; ui.eye.hidden = true; ui.sub.hidden = true;
    const started = save.started, lv = lvlOf(save.xp);
    openModal(`<section class="title-card"><h1>${tx('قاعة الأبواب', 'Hall of Doors')}</h1><p class="latin en muted" style="margin-top:-4px">${tx('THE HALL OF DOORS · ', '')}LIFE SKILLS & ENTREPRENEURSHIP</p>
      <p class="tsub">${tx('ثمانية أبواب، لكل محاضرة باب. خلف كل باب ممر من الغرف المرقّمة: اقرأ المخطوطة، اختر الباب الصحيح قبل أن يخرج <b>الظل</b>، حلّ ألغاز المراجعة على السبّورات… واهزم الزعيم لتفتح الباب التالي. بجانب كل محاضرة <b>باب كويز</b> 📝 من تمارينها، وفي نهاية القاعة <b>🎓 الامتحان النصفي</b>.', 'Eight doors, one for each lecture. Behind each door is a corridor of numbered rooms: read the scroll, choose the right door before <b>the Shadow</b> comes out, solve the review puzzles on the boards… and defeat the boss to open the next door. Beside every lecture is a <b>quiz door</b> 📝 from its exercises, and at the end of the hall waits <b>🎓 the MID exam</b>.')}</p>
      ${started ? `<p><span class="chip">Lv ${lv} · ${esc(titleOf(lv))}</span> <span class="chip">🏆 ${Object.keys(save.stars).length}/8</span> <span class="chip">📝 ${LECTURES.filter(L => quizPassed(L.id)).length}/8</span> <span class="chip">🏅 ${calcPoints()} ${tx('نقطة', 'points')}</span></p>` : ''}
      ${acctRow()}
      <div class="row center"><button class="btn" id="t-start">${started ? tx('▶ تابع', '▶ Continue') : tx('▶ ابدأ اللعب', '▶ Start playing')}</button><button class="btn ghost" id="t-set">${tx('⚙️ الإعدادات', '⚙️ Settings')}</button><button class="btn ghost" id="t-codex">${tx('📖 كتاب المعرفة', '📖 Book of Knowledge')}</button>${started ? `<button class="btn ghost" id="t-reset">${tx('🧹 لعبة جديدة', '🧹 New game')}</button>` : ''}</div>
      <p class="controls">${TOUCH ? tx('العصا للحركة · اسحب يميناً للنظر · ✋ تفاعل', 'Stick to move · drag right side to look · ✋ interact') : tx('<kbd>WASD</kbd> · الماوس · <kbd>E</kbd> تفاعل · <kbd>Shift</kbd> ركض · <kbd>F</kbd> الفانوس', '<kbd>WASD</kbd> · mouse · <kbd>E</kbd> interact · <kbd>Shift</kbd> run · <kbd>F</kbd> lantern')}</p><div id="t-confirm"></div></section>`, 'menu title', true);
    $('#t-start').onclick = () => { ac(); const CL = window.CLOUD; if (CL && CL.enabled && !CL.user && !CL.isGuest()) CL.openLogin(() => fadeTo(startPlay)); else fadeTo(startPlay); };
    bindAcct(); $('#t-set').onclick = openSettings; $('#t-codex').onclick = () => renderCodex(Math.min(save.unlocked, 7));
    const rs = $('#t-reset'); if (rs) rs.onclick = () => { const c = $('#t-confirm'); c.innerHTML = `<div class="panel bad mt"><b>${tx('متأكد؟', 'Are you sure?')}</b> ${tx('سيُمسح كل التقدم.', 'All progress will be erased.')} <button class="btn small" id="y">${tx('نعم', 'Yes')}</button> <button class="btn ghost small" id="n">${tx('لا', 'No')}</button></div>`; $('#y').onclick = () => { const set = save.set; save = blank(); save.set = set; persist(); location.reload(); }; $('#n').onclick = () => c.innerHTML = ''; };
  }
  function startPlay() {
    G.mode = 'play'; closeModal(); ui.cross.hidden = false; setAmbience('house'); if (window.CLOUD) window.CLOUD.landscape();
    const P = G.P; P.pos.set(G.spawn.x, 0, G.spawn.z); P.yaw = G.spawn.yaw; P.pitch = 0;
    const first = !save.started; save.started = true; persist(); renderHUD();
    if (first) say(tx('صوت غامض', 'Mysterious voice'), tx('أهلاً بك في <b>قاعة الأبواب</b> 🕯️ كل باب محاضرة. ابدأ بالباب ذي <b>الضوء الذهبي</b>… والأبواب الحمراء مقفلة حتى تهزم الزعيم الذي قبلها.', 'Welcome to the <b>Hall of Doors</b> 🕯️ Every door is a lecture. Start with the door with the <b>golden light</b>… red doors stay locked until you defeat the boss before them.'), '🕯️', 8000);
    if (!TOUCH) setTimeout(() => { if (G.mode === 'play' && !document.pointerLockElement) say(tx('تلميح', 'Tip'), tx('🖱️ انقر على الشاشة لتتحكم بالنظر بالماوس · <b>Esc</b> للقائمة', '🖱️ Click the screen to look around with the mouse · <b>Esc</b> for the menu'), '💡', 4000); }, first ? 9000 : 1500);
  }
  let fpsAcc = 0, fpsN = 0;
  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, G.clock.getDelta()); G.t += dt; G.uTime.value = G.t;
    if (G.mode === 'play') { updatePlayer(dt); updateInteract(); }
    updateDungeon(dt); updateLights(dt); updateFX(dt); ambienceTick(dt); updateCamera(dt);
    G.r.render(G.scene, G.cam);
    fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { const f = $('#fps'); if (f && !f.hidden) f.textContent = Math.round(fpsN / fpsAcc) + ' FPS'; fpsAcc = 0; fpsN = 0; }
  }
  function showLangPicker(done) {
    const o = document.createElement('div'); o.className = 'langpick';
    o.innerHTML = `<div class="lp-in"><div class="lp-door">🚪</div><h1>قاعة الأبواب</h1><p class="latin">HALL OF DOORS</p><p>اختر اللغة · Choose your language</p><div class="lp-btns"><button class="btn" data-l="ar">العربية</button><button class="btn" data-l="en">English</button></div><p class="muted" style="font-size:12px">يمكنك تغييرها لاحقاً من الإعدادات · You can change it later in Settings</p></div>`;
    document.body.appendChild(o);
    o.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { setLang(b.dataset.l); o.remove(); done(); });
  }
  function boot(data) {
    if (!LANG) return showLangPicker(() => boot(data));
    applyDir(); load(); if (data && data.save) save = Object.assign(blank(), data.save);
    const bar = $('#loadbar i'), msg = $('#loadmsg'), step = (p, t) => { if (bar) bar.style.width = Math.round(p * 100) + '%'; if (msg && t) msg.textContent = t; };
    if (!initGL()) { const ld = $('#loading'); if (ld) ld.innerHTML = tx('⚠️ جهازك أو متصفحك لا يدعم WebGL المطلوب للعبة.', '⚠️ Your device or browser does not support the WebGL this game needs.'); return; }
    G.zone = 'dungeon'; G.scene.fog.near = 8; G.scene.fog.far = 48; G.hemi.intensity = 0.32; G.amb.intensity = 0.14;
    applyLectureLang(); applyBossNames(); step(0.05, tx('تحميل الموديلات…', 'Loading models…'));
    loadModels(p => step(0.05 + p * 0.7, tx('تحميل الموديلات… ', 'Loading models… ') + Math.round(p * 100) + '%')).then(() => {
      step(0.8, tx('بناء قاعة الأبواب…', 'Building the Hall of Doors…'));
      setTimeout(() => {
        try { mats(); buildHub(); initPlayer(); initLantern(); bindInput(); }
        catch (e) { console.error(e); const ld = $('#loading'); if (ld) ld.textContent = tx('⚠️ خطأ: ', '⚠️ Error: ') + e.message; return; }
        step(1); const ld = $('#loading'); if (ld) ld.remove(); $('#fps').hidden = !save.set.fps;
        renderTitle(); requestAnimationFrame(loop);
      }, 30);
    });
  }
  window.__game = { startQuiz, startMid, leaveExam, get exam() { return exam; },  get run() { return run; }, G, get save() { return save; }, enterDungeon: i => enterDungeon(i),
    adoptSave: s => { const set = save.set; save = Object.assign(blank(), s); save.set = Object.assign(blank().set, s.set || set || {}); try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { } if (G.mode === 'title') renderTitle(); else if (!run && !exam) { refreshHub(); renderHUD(); } } };
  if (window.CLOUD) window.CLOUD.on(() => { if (G.mode === 'title' && G.r) renderTitle(); });
  try { window.claude?.hot?.snapshot?.(() => ({ save })); } catch (e) { }
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
