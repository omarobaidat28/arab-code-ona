ard skills"],"a":0},{"q":"“Developing life skills contributes to mental well-being and enhances confidence, enabling individuals to face challenges with a positive and adaptive mindset.” This statement reflects the importance of soft skills in ________________________.","o":["Professional Growth","Social and Relationship Benefits","Financial and Practical Applications","Personal Development"],"a":3},{"q":"“Life skills like communication, teamwork, adaptability, and leadership are highly valued by employers; they enable employees to collaborate effectively, manage conflicts, and respond to changing work environments.” This statement reflects the importance of soft skills in ________________________.","o":["Professional Growth","Social and Relationship Benefits","Financial and Practical Applications","Personal Development"],"a":0},{"q":"“Life skills help individuals build meaningful connections, navigate social situations, and maintain healthy family and community relationships.” This statement reflects the importance of soft skills in ________________________.","o":["Professional Growth","Social and Relationship Benefits","Financial and Practical Applications","Personal Development"],"a":1},{"q":"“Skills such as budgeting, goal-setting, and informed decision-making help individuals manage personal finances and plan for the future.” This statement reflects the importance of soft skills in ________________________.","o":["Professional Growth","Social and Relationship Benefits","Financial and Practical Applications","Personal Development"],"a":2},{"q":"Life-skilled people are equipped with abilities that allow them to _______________.","o":["handle challenges","make informed decisions","interact effectively with others","All of the above"],"a":3,"f":1},{"q":"Life-skilled people are often characterized by their _____________.","o":["resilience","self-awareness","emotional intelligence","strong communication skills","All of the above"],"a":4,"f":1},{"q":"Life-skilled people are able to _______________.","o":["manage their emotions","misunderstand the feelings of others","communicate ineffectively","All of the above"],"a":0,"f":1},{"q":"Life-skilled individuals are adept at ________________.","o":["problem-making","budgeting","ineffective communication","All of the above"],"a":1,"f":1},{"q":"___________ means understanding and sharing others' feelings, which fosters strong relationships.","o":["Resilience","Integrity","Empathy","Decisiveness","Self-awareness","Effective communication"],"a":2},{"q":"_____________ is the ability to express thoughts and feelings clearly and listen actively.","o":["Resilience","Integrity","Empathy","Decisiveness","Self-awareness","Effective communication"],"a":1},{"q":"____________ is the ability to bounce back from setbacks and keep going when things get tough.","o":["Resilience","Integrity","Empathy","Decisiveness","Self-awareness","Effective communication"],"a":0},{"q":"___________ means understanding one's emotions, strengths, and weaknesses.","o":["Resilience","Integrity","Empathy","Decisiveness","Self-awareness","Effective communication"],"a":4},{"q":"_______________ means doing the right thing even when nobody's watching, which builds trust with others.","o":["Resilience","Integrity","Empathy","Decisiveness","Self-awareness","Effective communication"],"a":1},{"q":"___________ means making clear, confident decisions without wavering.","o":["Resilience","Integrity","Empathy","Decisiveness","Self-awareness","Effective communication"],"a":3},{"q":"___________ is the capacity to adjust to new situations and changes.","o":["Adaptability","Problem-solving skills","Teamwork","Self-discipline"],"a":0},{"q":"_______________ is the ability to stay focused and manage impulses.","o":["Adaptability","Problem-solving skills","Teamwork","Self-discipline"],"a":3},{"q":"____________ is the ability to work well with others to achieve common goals.","o":["Adaptability","Problem-solving skills","Teamwork","Self-discipline"],"a":2},{"q":"_______________ is the ability to identify issues and develop effective solutions.","o":["Adaptability","Problem-solving skills","Teamwork","Self-discipline"],"a":1},{"q":"Time management is the ability to manage tasks and responsibilities efficiently.","o":["True","False"],"a":0},{"q":"Self-esteem is the ability to build a negative view of oneself.","o":["True","False"],"a":1},{"q":"Life skills make people unable to live independently, handle daily responsibilities, and adapt to new environments or challenges.","o":["True","False"],"a":1},{"q":"Competencies in the field of life skills are key for strengthening employability and entrepreneurial capabilities.","o":["True","False"],"a":0},{"q":"Life skills are limited to academic knowledge; they do not encompass emotional, cognitive, and social competencies that shape how individuals interact with the world.","o":["True","False"],"a":1},{"q":"By cultivating life skills, people can enhance their personal well-being, professional success, and societal contributions, ultimately leading to a more balanced, productive, and fulfilling life.","o":["True","False"],"a":0},{"q":"A skill is the learned (through practice, training, and experience) or innate ability to perform a specific task or activity well.","o":["True","False"],"a":0},{"q":"Life skills are psychosocial competencies and interpersonal skills that help people make informed decisions, solve problems, think critically and creatively, communicate effectively, build healthy relationships, empathize with others, and cope with managing their lives in a healthy and productive manner.","o":["True","False"],"a":0},{"q":"Life skills are essential abilities that enable individuals to navigate challenges, make informed decisions, and thrive personally, socially, and professionally.","o":["True","False"],"a":0},{"q":"Whether you are a student or a professional, it is not essential that you have to communicate or interact in public at some point or the other.","o":["True","False"],"a":1},{"q":"In times of employability crises, the more superb soft skills you have the better your chance in getting a job is.","o":["True","False"],"a":0}],"c1l2":[{"q":"“Entrepreneurship is the process of identifying, creating, and exploiting opportunities to build new ventures, commercialize innovations, or generate value, all while navigating financial risk and market uncertainty.” This definition of entrepreneurship _______________.","o":["is a broad definition","emphasizes the aspect of innovation and change","highlights the force of \"creative destruction\"","underlines the agile, trial-and-error approach"],"a":0},{"q":"“Entrepreneurship is viewed as disrupting established ways of doing things by introducing new products, technologies, or combinations of resources.” This definition emphasizes ____________.","o":["the aspect of innovation and change","the force of \"creative destruction\"","the aspect of risk and uncertainty","All of the above","Only a & b"],"a":4,"f":1},{"q":"Opportunity recognition is illustrated as a three step-cycle ordered as _______________.","o":["exploitation, discovery, and evaluation","evaluation, discovery, and exploitation","discovery, evaluation, and exploitation","discovery, exploitation, and evaluation"],"a":2},{"q":"“Entrepreneurship in an environment where future outcomes cannot be accurately predicted.” The emphasized aspect of entrepreneurship in this statement is ________________.","o":["innovation and change","opportunity recognition","risk and uncertainty","process and organization"],"a":2},{"q":"“Entrepreneurship is defined as the process of initiating a business venture, organizing the necessary social and economic resources, and assuming the associated risks and rewards.” The emphasized aspect of entrepreneurship in this statement is ________________.","o":["innovation and change","opportunity recognition","risk and uncertainty","process and organization"],"a":3},{"q":"One of the following is not of the various aspects of entrepreneurship.","o":["Innovation and change","Opportunity recognition","Preconception and prejudice","Risk and uncertainty","Process and organization"],"a":2},{"q":"According to the U.S. Small Business Administration (SBA), “Entrepreneurship is the process of creating and managing a business to achieve desired objectives.” This straightforward definition brings attention to the practical aspects of entrepreneurship, where _________________ are central to achieving business goals.","o":["the societal impact and responsibility","planning and management","aspiration and money","challenge and resistance"],"a":1},{"q":"“Entrepreneurship is a series of experiments aimed at achieving a sustainable business model.” This definition underlines the ____________________ approach.","o":["agile, trial-and-error approach","process-oriented","customer-oriented","theoretical assumption"],"a":0},{"q":"“Entrepreneurship is the search for a repeatable and scalable business model.” This definition underlines the ____________________ approach.","o":["agile, trial-and-error","customer-oriented","process-oriented","theoretical assumption"],"a":2},{"q":"“Entrepreneurship is about taking an idea and bringing it to life in a way that changes people’s lives for the better.” This definition highlights the ________________ that entrepreneurs have in contributing positively to the world.","o":["societal impact and responsibility","adaptability and aspiration","groundbreaking ideas","status quo"],"a":0},{"q":"Small and medium-sized enterprises (SMEs) are significant contributors to job creation in __________.","o":["developed economies","developing economies","both developed and developing economies","Non of the above"],"a":2,"f":1},{"q":"Many technological breakthroughs, such as smartphones and e-commerce, originated from _______.","o":["entrepreneurial ventures","back engineering","reverse engineering","decompilation"],"a":0},{"q":"Entrepreneurship encourages ________________ by fostering businesses in various industries, including emerging sectors like renewable energy, biotechnology, and digital technologies.","o":["restriction","limitation","diversification","single industries"],"a":2},{"q":"in resource-dependent countries, encouraging entrepreneurship in non-resource sectors helps _________ vulnerability to fluctuations in global commodity prices.","o":["increase","improve","enhance","reduce"],"a":3},{"q":"Entrepreneurship empowers individuals, particularly ____________ groups, by providing opportunities to take control of their economic futures. Women-led businesses, for instance, are transforming communities by creating jobs and addressing gender inequalities. Additionally,","o":["dominant","marginalized","majority","overrepresented"],"a":1},{"q":"Social entrepreneurs tackle pressing societal issues like ______________, driving positive change through sustainable and innovative solutions.","o":["poverty","education","climate change","All of the above"],"a":3,"f":1},{"q":"Entrepreneurship is a ________ for economic prosperity, innovation, and societal transformation. By fostering creativity, empowering individuals, and addressing pressing global challenges, entrepreneurship builds a more sustainable and equitable future.","o":["catalyst","hindrance","deterrent","All of the above"],"a":0,"f":1},{"q":"Entrepreneurs play a key role in increasing the standard of living in a community. They do this not just by creating jobs, but also by ______________ innovations that lead to improvements in the quality of life of their employees, customers, and other stakeholders in the community.","o":["encouraging and refusing","developing and adopting","processing and ignoring","accepting and rejecting"],"a":1},{"q":"Which of the following is not a benefit of entrepreneurship?","o":["Economic growth and job creation","Innovation and technological advancement","Improved standard of living","Economic concentration and vulnerability","Empowerment and social change."],"a":3},{"q":"Some entrepreneurs earn far more through their companies than working for someone else, but other entrepreneurs’ businesses barely earn enough to provide them with an adequate income. This sentence shows ______________ as a drawback of entrepreneurship.","o":["uncertainty of income","risk of losing your entire investment","long hours and hard work","high levels of stress"],"a":0},{"q":"What is the worst that could happen if I open my business and it fails? What drawback of entrepreneurship does this question reflect?","o":["Uncertainty of Income","Risk of Losing Your Entire Investment","Long Hours and Hard Work","High Levels of Stress"],"a":1},{"q":"“In many start-ups, six- or seven-day work weeks with no paid vacations are the norm .” This sentence represents _______________ as a disadvantage of entrepreneurship.","o":["uncertainty of income","risk of losing your entire investment","long hours and hard work","high levels of stress"],"a":2},{"q":"Sometimes entrepreneurs unnecessarily bear the burden of managing alone because they cannot bring themselves to delegate authority and responsibility to others in the company, even though their employees are capable. This sentence shows ______________ as a drawback of entrepreneurship.","o":["uncertainty of income","risk of losing your entire investment","long hours and hard work","high levels of stress"],"a":3},{"q":"Along the way to building a successful business, entrepreneurs will run headlong into many different obstacles, some of which appear to be insurmountable. In the face of such difficulties, ___________ and disillusionment are common emotions.","o":["discouragement","encouragement","reinforcement","All of the above"],"a":0,"f":1},{"q":"Of the drawbacks of entrepreneurship is that many entrepreneurs find that they must make decisions on issues about which they are not really knowledgeable. The drawback reflected here is ____________.","o":["risk of losing your entire investment","long hours and hard work","complete responsibility","discouragement"],"a":2},{"q":"One of the following is not a drawback of entrepreneurship.","o":["Risk of Losing Your Entire Investment","Long Hours and Hard Work","Complete Responsibility","Discouragement","High Levels of Stress","Higher Quality of Life Until the Business Gets Established"],"a":1},{"q":"____________ is the ability to focus intently on achieving a singular, long-term goal.","o":["Grit","Termination","Determination","All of the above","Only a & c"],"a":4,"f":1},{"q":"Building a company “from scratch” is much like piecing together a giant jigsaw puzzle. Entrepreneurs know how to put the right people together to accomplish a task. What is the entrepreneurial characteristic that this sentence embodies?","o":["Preference for moderate risk","Skill at organizing","Value of achievement over money","Tolerance for ambiguity"],"a":1},{"q":"Entrepreneurs must fill multiple roles to make their companies successful, especially in the early days of a start-up. Because their resources usually are limited, they end up performing many jobs themselves, even those they know little about. This refers to ____________ as a characteristic of entrepreneurs.","o":["desire for immediate feedback","preference for moderate risk","self-reliance","future orientation"],"a":2},{"q":"One of the following is not a characteristic of entrepreneurs.","o":["Desire for irresponsibility","Confidence in their ability to succeed","Desire for responsibility","High level of energy"],"a":0},{"q":"Which of the following is a characteristic of entrepreneurs?","o":["High degree of commitment","Intolerance and ambiguity","Conventionality","Indifference"],"a":0},{"q":"One hallmark of true entrepreneurs is their ability to adapt to the changing needs and preferences of their customers and the changing demands of the business environment. This sentence represents which characteristic of entrepreneurs?","o":["Self-reliance","Creativity","Flexibility","Tenacity"],"a":2},{"q":"The majority of _______________ are leapfroggers, people who start a company, manage its growth until they get bored, and then sell it to start another.","o":["opportunity entrepreneurs","necessity entrepreneurs","serial entrepreneurs"],"a":2},{"q":"________________, which entrepreneurs are skilled at, is a strategy that involves conserving money and cutting costs during start-up so that entrepreneurs can pour every available dollar into their businesses.","o":["Venture backing","Bootstrapping","Dependent financing","Outside funding"],"a":1},{"q":"Entrepreneurs are not of one mold; no one set of characteristics can predict who will become entrepreneurs; anyone, regardless of age, race, gender, color, national origin, or any other characteristic, can become an entrepreneur (although not everyone should). What this statement emphasizes about entrepreneurs is ____________________.","o":["cultural diversity","cultural uniformity","cultural homogeneity","ethnic multiplicity"],"a":0},{"q":"Peter Drucker (1985) described entrepreneurship as the act of systematically searching for change, responding to it, and exploiting it as an opportunity. He famously stated that innovation is the specific tool of the entrepreneur.","o":["True","False"],"a":0},{"q":"The ambitious nature of overcoming resource constraints is highlighted in framing entrepreneurship as \"the pursuit of opportunity through the resources you currently control”.","o":["True","False"],"a":1},{"q":"Entrepreneurship is simply viewed by one of the scholars as taking on the risk of buying at certain prices and selling at uncertain prices.","o":["True","False"],"a":0},{"q":"An entrepreneur is defined as a person who moves resources from low productivity to high productivity to create more value. This Definition highlights the entrepreneur as an organizer and a planner and that smart management is not as important as physical labor.","o":["True","False"],"a":1},{"q":"According to Investopedia, “Entrepreneurship is the process of setting up a business or businesses, taking on financial risks in the hope of profit.”","o":["True","False"],"a":0},{"q":"Startups often create jobs directly within their operations and indirectly by fostering demand for suppliers, service providers, and other industries.","o":["True","False"],"a":0},{"q":"Entrepreneurs often introduce groundbreaking ideas, products, and services that improve lives and solve societal problems. By challenging traditional methods, they encourage innovation and technological progress.","o":["True","False"],"a":0},{"q":"As businesses grow and incomes rise, employees and communities don’t benefit from better infrastructure, education, and healthcare.","o":["True","False"],"a":1},{"q":"By making products more accessible, affordable, or efficient, entrepreneurs enhance the standard of living. For instance, affordable transportation services like Uber or low-cost consumer goods offered by startups improve daily life for millions.","o":["True","False"],"a":0},{"q":"A diversified economy is more reliant on a single industry that makes it more resilient to economic shocks.","o":["True","False"],"a":1},{"q":"Initiatives like microfinance have empowered few individuals to start businesses and improve their lives.","o":["True","False"],"a":1},{"q":"Governments and institutions must encourage and support entrepreneurial endeavours to unlock their full potential.","o":["True","False"],"a":0},{"q":"A society becomes greater if the employment base is large and diversified. It brings about changes in society and promotes facilities like higher expenditure on education, better sanitation, fewer slums, and a higher level of homeownership.","o":["True","False"],"a":0},{"q":"Entrepreneurs identify challenges in the lives of customers and provide unapplicable business solutions.","o":["True","False"],"a":1},{"q":"Individuals who prefer the security of a steady paycheck, a comprehensive benefits package, a two- week paid vacation, and the support of a corporate staff probably should go into business for themselves.","o":["True","False"],"a":1},{"q":"All entrepreneurs find that they must work 60 to 80 hours a week as they build their businesses and must push their personal lives aside until their companies are established.","o":["True","False"],"a":1},{"q":"Marriages, families, and friendships are too often casualties of small business ownership. This reflects the good quality of the entrepreneur’s life until the business gets established","o":["True","False"],"a":1},{"q":"An entrepreneur is one who creates a new business in the face of risk and uncertainty for the purpose of achieving profit and growth by identifying significant opportunities and assembling the necessary resources to capitalize on them.","o":["True","False"],"a":0},{"q":"Entrepreneurs excel at getting the most out of the resources that are available, however limited they may be.","o":["True","False"],"a":0},{"q":"Entrepreneurship is a genetic trait; it is a skill that most people can’t learn. It has become a very unusual vocation.","o":["True","False"],"a":1},{"q":"“Entrepreneurship is more mundane than it’s sometimes portrayed. You don’t need to be a person of mythical proportions to be very, very successful in building a company.”","o":["True","False"],"a":0}],"c1l3":[{"q":"Building an entrepreneurial mindset _________ critical everyday life skills—such as adaptability, problem-solving, and financial literacy.","o":["excludes","cultivates","eliminates","displaces"],"a":1},{"q":"Learning to pivot in the face of market changes trains individuals to bounce back from personal failures and deal with unexpected life transitions. This statement shows ______________ as an example of boosting life skills.","o":["financial literacy","opportunity recognition","psychological intelligence","adaptability and resilience"],"a":3},{"q":"“Shifting perspective to view everyday problems as challenges to be solved rather than roadblocks to fear.” This statement shows ___________ as an example of how entrepreneurial skills boost life skills.","o":["opportunity recognition","emotional intelligence","financial literacy","time management"],"a":0},{"q":"“Balancing books and managing capital in business translates directly to managing household budgets and building long-term personal wealth.” This statement shows ___________ as an example of how entrepreneurial skills boost life skills.","o":["opportunity recognition","emotional intelligence","financial literacy","time management"],"a":2},{"q":"“Empathy and social awareness are crucial for managing teams, negotiating with stakeholders, and understanding customer behavior.” This statement shows ___________ as an example of how life skills boost entrepreneurial skills.","o":["emotional intelligence","communication and negotiation","time management and organization","critical thinking"],"a":0},{"q":"“The ability to pitch an idea, persuade an audience, and clearly convey your vision is vital in both daily personal interactions and boardroom pitches.” This sentence shows __________ as an example of how life skills boost entrepreneurial skills.","o":["emotional intelligence","communication and negotiation","time management and organization","critical thinking"],"a":1},{"q":"“Prioritizing tasks, setting boundaries, and maintaining a healthy work-life balance are necessary to prevent burnout.” This sentence shows __________ as an example of how life skills boost entrepreneurial skills.","o":["emotional intelligence","communication and negotiation","time management and organization","critical thinking"],"a":2},{"q":"Entrepreneurship is basically about solving problems with limited resources while optimizing productivity and ____________.","o":["profitability","vulnerability","adaptability","predictability"],"a":0},{"q":"“Everyone is trying to get the most out of their life, or improve the condition of their life, while dealing with all manner of challenges in that process.” This reflects that Life in reality is an entrepreneurial pursuit and reinforces the idea that entrepreneurship is a ________________.","o":["professional skill","life skill","hard skill","All of the above"],"a":1,"f":1},{"q":"When running their business, entrepreneurs need life skills like _____________.","o":["resilience, adaptability, self-awareness, and time management","communication, emotional intelligence, negotiation, and active listening","problem-solving, financial literacy, and decision-making"],"a":2},{"q":"Entrepreneurs need life skills like _________________ when they work with people.","o":["resilience, adaptability, self-awareness, and time management","communication, emotional intelligence, negotiation, and active listening","problem-solving, financial literacy, and decision-making"],"a":1},{"q":"When considering the life skills needed by entrepreneurs, perfection is not required because _______________.","o":["Skills develop over time through practice","experts who possess the strengths entrepreneurs lack can be hired","Mistakes and failures serve as the primary teachers in an entrepreneurial journey","All of the above"],"a":3,"f":1},{"q":"_______________, the founder of WhatsApp, moved to the US from Ukraine, lived on food stamps, and taught himself computer networking. He channeled his practical survival mindset into building a simple, robust messaging tool later acquired for billions.","o":["Jan Koum","Sophia Amoruso","Sara Blakely","Oprah Winfrey"],"a":0},{"q":"_____________ is the ability to find quick, clever, and independent ways to overcome difficult situations or solve problems using whatever tools or options are available. It is the quality of making decisions and acting on your own when faced with challenges","o":["Open-mindedness","Resourcefulness","Decisiveness","Dependence"],"a":1},{"q":"Entrepreneurship and life skills share a deeply intertwined relationship, acting as a two-way street.","o":["True","False"],"a":0},{"q":"Personal life skills like emotional intelligence, resilience, and effective communication weaken the foundation required to navigate the challenges of business and career growth.","o":["True","False"],"a":1},{"q":"Entrepreneurship extends far beyond launching a venture; it is fundamentally about managing ambiguity and taking proactive control of one's destiny.","o":["True","False"],"a":0},{"q":"Running a successful business or navigating a professional career relies heavily on foundational human and interpersonal skills.","o":["True","False"],"a":0},{"q":"Educational institutions and professional environments unfortunately ignore project-based learning and experiential training to develop life and entrepreneurial skills.","o":["True","False"],"a":1},{"q":"Many young people are being pulled into the ideology that they have to start a company, raise money, and someday become the next big thing in order to be fulfilled. This may be a trap of having ideas of overnight success. Success does not come so easily.","o":["True","False"],"a":0},{"q":"It is worth separating the idea of 'being an entrepreneur', in the sense of starting a company, raising capital etc. from that of having an 'entrepreneurial mindset', being able to think like an entrepreneur and apply that way of thinking in any given context.","o":["True","False"],"a":0},{"q":"Entrepreneurs need to be fully polished or naturally gifted life-skilled people from birth.","o":["True","False"],"a":1},{"q":"Entrepreneurship itself acts as a theoretical school where essential life and business skills—such as resilience, problem-solving, and financial management—are rarely built, tested, and refined through real- world experience.","o":["True","False"],"a":1},{"q":"Entrepreneurs need core life skills like resilience, adaptability, clear communication, and financial literacy to handle stress, change plans, talk to clients, and manage cash flow.","o":["True","False"],"a":0}],"c2l1":[{"q":"Which of the following is not a standard of critical thinking?","o":["Accuracy","Relativistic thinking","Consistency","Logical Correctness"],"a":1},{"q":"Critical thinking is the general term given to a wide range of cognitive skills and intellectual dispositions needed to _____.","o":["effectively identify, analyze, and evaluate arguments and truth claims","to discover and overcome personal preconceptions and biases","to formulate and present convincing reasons in support of conclusions","to make reasonable, intelligent decisions about what to believe and what to do","All of the above."],"a":4,"f":1},{"q":"What exactly is the problem we’re facing? What exactly are the alternatives? What exactly are the advantages and disadvantages of each alternative? Such questions in critical thinking reflect _______.","o":["relevance","consistency","precision","fairness"],"a":2},{"q":"No matter how brilliant you may be, you’re almost guaranteed to make bad decisions if your decisions are based on false information. As a critical thinker, this means that you should be __________.","o":["accurate","relevant","consistent","fair"],"a":0},{"q":"If a tricky debater raises an irrelevant issue, he is then trying to _______________.","o":["distract the audience’s attention","attract the audience’s attention","be as logical as possible","provide realistic examples"],"a":0},{"q":"_____________ involves saying or believing inconsistent things (i.e., things that cannot both or all be true) about a particular matter.","o":["Logical consistency","Practical consistency","Logical inconsistency","Practical inconsistency"],"a":2},{"q":"Thinking is better when it is _____ rather than ________.","o":["deep/ shallow","shallow/ deep","superficial/ thorough","superficial/ shallow"],"a":0},{"q":"If you are disposed to prejudge issues, then you are _________.","o":["fair","unfair","impartial","openminded"],"a":1},{"q":"Before we can effectively evaluate a person’s argument or claim, we don’t need to understand clearly what he or she is saying.","o":["True","False"],"a":1},{"q":"Critical thinkers not only strive for clarity of language but also seek maximum clarity of thought.","o":["True","False"],"a":0},{"q":"Critical thinkers understand that to cut through the confusions and uncertainties that surround many everyday problems and issues, it is often necessary to insist on precise answers to precise questions.","o":["True","False"],"a":0},{"q":"Critical thinkers rarely value the truth; they don’t have a passion for accurate, timely information.","o":["True","False"],"a":1},{"q":"Practical consistency involves saying one thing and doing another","o":["True","False"],"a":1},{"q":"To think logically is to reason correctly—that is, to draw well-founded conclusions from the beliefs we hold. We need to be able to reason from those beliefs to conclusions that logically follow from them.","o":["True","False"],"a":0},{"q":"Critical thinking demands that we be openminded, impartial, and free of distorting biases and preconceptions.","o":["True","False"],"a":0},{"q":"Basic fair-mindedness is an inessential attribute of a critical thinker.","o":["True","False"],"a":1},{"q":"Critical thinkers prize truth and so are constantly on the lookout for inconsistencies, both in their own thinking and in the arguments and assertions of others.","o":["True","False"],"a":0},{"q":"It is easy to see why consistency is essential to critical thinking. Logic tells us that if a person holds inconsistent beliefs, at least one of those beliefs must be true.","o":["True","False"],"a":1},{"q":"Critical thinking is reasonable, reflective thinking that is focused on deciding what to believe or do.","o":["True","False"],"a":0},{"q":"Lack of clarity occurs sometimes due to _____________.","o":["awareness","carefulness","a lack of skill.","All of the above"],"a":2,"f":1},{"q":"To achieve our personal goals in life we need _______________.","o":["an unclear conception of our goals and priorities","an imaginary grasp of our abilities","a clear understanding of the problems and opportunities we face.","All of the above"],"a":2,"f":1},{"q":"People are often strongly disposed _______ unfamiliar ideas, to prejudge issues, to stereotype outsiders, and to identify truth with their own self-interest or the interests of their nation or group.","o":["to accept","to agree with","to resist","to maximize"],"a":2},{"q":"Poor reading skills, prejudice and superstition are all reasons of _____________.","o":["logical thinking","fairness","critical thinking","uncritical thinking"],"a":3},{"q":"Which of the following is not an impediment that plays a powerful role in hindering critical thinking?","o":["Egocentrism","Sociocentrism","Unwarranted assumptions","Objective thinking"],"a":3},{"q":"____________ are selfish, self-absorbed people who view their interests, ideas, and values as superior to everyone else’s.","o":["Sociocentrics","Egocentrics","Wishful thinkers","Relativistic thinkers"],"a":1},{"q":"____________ is the tendency to overrate oneself—to see oneself as better in some respect than one actually is.","o":["Self-serving bias","Self-interested thinking","Socio-interested thinking","All of the above"],"a":0,"f":1},{"q":"Sociocentrism can distort critical thinking in many ways. Of the most important of these ways are ______________.","o":["group bias","Self-bias","conformism","All of the above","a & c"],"a":4,"f":1},{"q":"An unwarranted assumption is something taken for granted __________.","o":["with proof and conclusive evidence.","without good reason","because it is clearly reasonable","with proved logic"],"a":1},{"q":"Subjectivism is the view that truth is a matter of __________ opinion.","o":["individual","cultural","social","All of the above"],"a":0,"f":1},{"q":"_____________ is believing something not because you had good evidence for it but simply because you wished it were true.","o":["Relativistic thinking","Wishful thinking","Objective thinking","Reasonable thinking"],"a":1},{"q":"One of the following is not a characteristic of critical thinkers.","o":["Are skilled at understanding, analyzing, and evaluating arguments and viewpoints.","Reason logically and draw appropriate conclusions from evidence and data.","Are aware of the biases and preconceptions that shape the way they perceive the world.","Are close-minded and resist criticisms of beliefs and assumptions."],"a":3},{"q":"Which of the following is a characteristic of critical thinkers?","o":["Pretend they know more than they do and ignore their limitations.","Pursue truth and are curious about a wide range of issues.","Often base beliefs on mere personal preference or self-interest.","Lack awareness of their own biases and preconceptions."],"a":1},{"q":"Which of the following is a characteristic of uncritical thinkers?","o":["Think independently and are not afraid to disagree with group opinion.","Are able to get to the heart of an issue or a problem, without being distracted by details.","Often think in ways that are unclear, imprecise, and inaccurate.","Have the intellectual courage to face and assess fairly ideas that challenge even their most basic beliefs."],"a":2},{"q":"Self-interested thinking is the tendency to accept and defend beliefs that harmonize with one’s self-interest.","o":["True","False"],"a":0},{"q":"Critical thinking demands that we weigh evidence and arguments subjectively. It doesn’t demand that we revere truth – even if it hurts.","o":["True","False"],"a":1},{"q":"Sociocentrism can hinder rational thinking by focusing excessively on the self.","o":["True","False"],"a":1},{"q":"Most people absorb group bias consciously, usually from early childhood. It is common, for example, for people to grow up learning that their society’s beliefs, institutions, and values are better than those of other societies.","o":["True","False"],"a":1},{"q":"The desire to belong, to be part of the in-group, can be among the most powerful of human motivations; this desire to conform can seriously cripple our powers of critical reasoning and decision making.","o":["True","False"],"a":0},{"q":"Cultural relativism is the view that truth is a matter of social or cultural opinion. In other words, it is the view that what is true for person A is what person A’s culture or society believes is true.","o":["True","False"],"a":0},{"q":"A gap in your critical thinking can result from a lack of relevant background information about the matter in argument.","o":["True","False"],"a":0},{"q":"Good reading skills serve as the most significant barrier to critical thinking. In order to gain proper knowledge about many of the things, we have to go through a lot of information and data, but good reading skills do not assist us in understanding the matter easily.","o":["True","False"],"a":1},{"q":"Fear may prevent you from pursuing a line of questioning or from confronting evidence and facts that may force you to reevaluate your position.","o":["True","False"],"a":0},{"q":"Egocentrism is the tendency to see reality as centered on oneself; all of us are affected to some degree by egocentric biases.","o":["True","False"],"a":0},{"q":"From a psychological standpoint, it is likely that self-interest plays at least some role in shaping the respective attitudes and beliefs.","o":["True","False"],"a":0},{"q":"Which of the following is a barrier of critical thinking?","o":["Knowledge of relevant background information","good reading skills","fear of change","open-mindedness"],"a":2},{"q":"Two common manifestations of egocentrism are _________________.","o":["self-interested thinking and self-serving bias","group-centered bias and group centered thinking","egocentric biases and sociocentric biases","conformism and immunity to self-interest"],"a":0},{"q":"“Most doctors support legislation making it more difficult for them to be sued for malpractice.” This statement indicates that ____________.","o":["we are almost all immune to self-interested thinking","almost no one is immune to self-interested thinking","self-interested thinking is supported by doctors and legislations","only doctors support self-interested thinking"],"a":1},{"q":"Everyone finds it tempting at times to reason that “this benefits me, therefore it must be good”; from a critical thinking standpoint, such “reasoning” is __________.","o":["acceptable","a sham","very logical","very honest"],"a":1},{"q":"We all like to feel good about ourselves. Nobody likes to think of himself or herself as being “__________” in some important respect.","o":["average","below average","above average","All of the above"],"a":1,"f":1},{"q":"It is important to be able to look honestly at our personal strengths and weaknesses. We want to set high personal goals, but not goals that are wildly __________.","o":["realistic","reasonable","unrealistic","logical"],"a":2},{"q":"__________ grounded in genuine accomplishment is an important element of success. __________ is an obstacle to genuine personal and intellectual growth.","o":["Self-confidence/ Overconfidence","Overconfidence/ Self-confidence","Hyper-confidence/ Pro-confidence","Underconfidence/ hypo-confidence"],"a":0},{"q":"One of the following is not a characteristic of uncritical thinkers.","o":["Fear and resist ideas that challenge their basic beliefs.","Are often relatively indifferent to truth and lack curiosity","Base their beliefs on facts and evidence rather than on personal preference or self-interest.","Are easily distracted and lack the ability to zero in on the essence of an issue or a problem.","Tend to engage in “groupthink,” uncritically following the beliefs and values of the crowd."],"a":2},{"q":"Our attraction for someone might cause us to assume that he or she feels the same way and thus to interpret that person’s actions incorrectly. This example is a realization of ____________.","o":["relativism","unwarranted assumption","conformism","subjectivism"],"a":1},{"q":"Critical thinkers are ____________ to ways in which critical thinking can be skewed by egocentrism, sociocentrism, wishful thinking, and other impediments.","o":["sensitive","insensitive","irresponsive","passionate"],"a":0}],"c2l2":[{"q":"Problem statements about the problem frame are _________.","o":["long and detailed","with solutions","concise and clear","with secondary symptoms"],"a":2},{"q":"Your problem statement should begin with one or two sentences describing _______.","o":["a vision of what is possible if the problem is solved","what the specific issues are","the primary symptoms of and evidence for the problem","None of the above"],"a":0,"f":1},{"q":"Writing your problem statement multiple times is expected __________.","o":["to start providing direct solutions","to capture changes in your understanding of the problem","to include generalized similar findings about the problem","to decide how to state your decisions"],"a":1},{"q":"Before you start solving anything, you need to be sure that you are working on the right problem. This means you are certain that you have _____ the problem correctly.","o":["diagnosed","solved","framed","excluded","All of the above","a & c"],"a":1,"f":1},{"q":"A problem is defined as: “a situation in which we are _____ to find ourselves and perceive it as harmful, in need of resolution or overcoming”.","o":["willing","unwilling","pleased"],"a":1},{"q":"Solving most problems requires some sort of_______. This means a method of proceeding from the beginning which may be systematic or may involve trial and error.","o":["goal","obstacle","frame","strategy"],"a":3},{"q":"Learning problem-solving techniques is _____ for working professionals in any field.","o":["a must","not a must","not necessary","probably important"],"a":0},{"q":"Which of the following is not of the core skills that the best problem solvers generally possess?","o":["Creativity","Teamwork","Low emotional intelligence","Logical thinking skills"],"a":2},{"q":"Problem-solving and decision-making are terms that are often used interchangeably. You cannot solve a problem without making a decision. The main difference is that the first is _____ and the second is ______.","o":["a process/ an action","an action/ a process"],"a":0},{"q":"__________is the process of choosing a solution based on your judgment, situation, facts, knowledge or a combination of available data.","o":["Decision-making","Problem-solving"],"a":0},{"q":"It is believed that how one diagnoses and frames a problem can determine how they then address it.","o":["True","False"],"a":0},{"q":"Framing a problem involves defining the problem and bounding it, then deciding what to include and exclude and how to proceed.","o":["True","False"],"a":0},{"q":"While problem framing is typically treated as something that happens at the beginning of a design project, it is important to remember that it is a process that continues until the design is finalized.","o":["True","False"],"a":0},{"q":"If we had not encountered obstacles on the way to achieving the given goal, there would be a problem that needs to be solved.","o":["True","False"],"a":1},{"q":"Problem solving ability is the ability of a person to participate in intellectual processing in order to understand and solve problems in which a solution process is not immediately apparent.","o":["True","False"],"a":0},{"q":"Problem-solving is the process of finding solutions by using simple applications of previously learned procedures.","o":["True","False"],"a":1},{"q":"Problem-solving skills help you determine the source of a problem and find an effective solution.","o":["True","False"],"a":0},{"q":"Addressing a group problem or systemic social problem requires you to work individually without other team members.","o":["True","False"],"a":1},{"q":"Both problem-solving and decision-making are applicable to all careers and industries.","o":["True","False"],"a":0},{"q":"One of the following is not of the different models dealing with how to solve a problem.","o":["The Creative Problem-Solving Model – Mindtools","Analytical Problem-Solving Approach","The Fred Nickols’ Four-Step Model","The Six-Step Model","The Ten-Step Model"],"a":4},{"q":"The first step of the Six-Step Model is _______________.","o":["Problem Analysis","Problem Definition","Establishing Goals","Generating Possible Solutions","Implementation"],"a":1},{"q":"In defining a problem, define or state your issue in as specific terms as possible so it's easy to understand. To determine the needs of the issue, you might ask yourself the following except:","o":["What factors are contributing to this issue?","Who is the person involved in solving the issue?","When is this issue occurring?","Where is this issue taking place?"],"a":1},{"q":"There are different ways to define a problem through __________.","o":["interviewing","brainstorming","conducting questionnaires","All of the above","a & b"],"a":3,"f":1},{"q":"One of the following questions can be useful to help you analyze the problem:","o":["Who is solving this problem?","How is this problem benefiting other people?","Who else is developing this problem?","How do other people deal with this problem?"],"a":3},{"q":"Within the stage of generating possible solutions, it can be very helpful to _________.","o":["ask what was done in the past when faced with similar problems","know how other people have dealt with similar situations","approach friends, family, teachers, books, or the internet, etc. to obtain ideas for solutions","write down all the possibilities so that you approach this task systematically","All of the above","b & c"],"a":4,"f":1},{"q":"While analyzing a solution, some considerations to keep in mind include:","o":["Is it irrelevant to the studied situation?","Is it realistic?","Is it manageable?","What are the good consequences away from the bad ones?","All of the above","b & c"],"a":1,"f":1},{"q":"Of the advantages of the Six-Step Model is that it __________________.","o":["ensures consistency, as everyone understands the approach to be used","boosts bias and preconceptions, leading to greater subjectivity","supports divisions and discourages collaborative working","provides unjustifiable solutions"],"a":0},{"q":"One of the following is not a tip for improving your problem-solving approach:","o":["Clearly define the problem","Agree on a process","Acquire more technical knowledge in your field","Don’t use active listening"],"a":3},{"q":"One of the following is a tip for improving your problem-solving approach:","o":["Avoid opportunities to solve the problem in order not to be distracted","Do practices on problem-solving","Observe how others cause problems","Don’t focus on the solutions"],"a":1},{"q":"Once the problem is defined, you need to think about it from one perspective to insure and understand that you are working on one dimension of the problem.","o":["True","False"],"a":1},{"q":"Within the stage of analyzing your solutions, you need to examine each alternative and write down both the advantages and disadvantages to each.","o":["True","False"],"a":0},{"q":"Implementing a chosen solution involves on-going monitoring of the effectiveness of the solution to make sure that it actually solved the problem.","o":["True","False"],"a":0},{"q":"In the Six-Step Model, all six steps are not followed in order – as a flexible cycle, beginning with identifying the Problem. Each step may be completed after or before moving on to the next step.","o":["True","False"],"a":1},{"q":"An advantage of the Six-Step Model is that it eliminates the confusion caused when people use different problem-solving techniques on the same issue.","o":["True","False"],"a":0},{"q":"If you find yourself getting overwhelmed and distracted during the problem-solving process, go back to step one and make sure you are approaching a singular problem.","o":["True","False"],"a":0},{"q":"Problem-solving requires you to take in a variety of inputs and opinions and carefully analyze them.","o":["True","False"],"a":0},{"q":"You may have colleagues who are skilled problem solvers. Observing how those colleagues solve problems may leave you distracted and confused.","o":["True","False"],"a":1},{"q":"If you don’t have strong working technical knowledge in your industry, you can achieve more through additional coursework, training or practice.","o":["True","False"],"a":0},{"q":"If you are solving a problem as part of a team, it’s very important that each one chooses different rules and procedures before you start the problem-solving process.","o":["True","False"],"a":1}],"c2l3":[{"q":"The knowledge of EI is ________ because technical skills alone cannot provide professional and personal success.","o":["essential","unnecessary","possibly not preferred","a little bit important"],"a":0},{"q":"High Emotional Intelligence is a great predictor of ___________ performance.","o":["low","high","average","little"],"a":1},{"q":"____________ indicates being driven to achieve, for the sake of achievement.","o":["Empathy","Self-Regulation","Personal Motivation","Self-Awareness"],"a":2},{"q":"__________ refers to being sensitive to others’ feelings while making decisions.","o":["Empathy","Self-Regulation","Personal Motivation","Self-Awareness"],"a":0},{"q":"Managing relationships to influence people in the desired direction refers to _______.","o":["empathy","self-Regulation","personal Motivation","social Skills"],"a":3},{"q":"Honestly recognizing feelings within is_________. It is recognizing one's emotions and values as well as one's strengths and challenges.","o":["self-Regulation","personal Motivation","self-Awareness","empathy"],"a":2},{"q":"Taking control of your emotions and thoughts is called____________.","o":["empathy","self-Regulation","personal Motivation","self-Awareness"],"a":1},{"q":"Self-awareness is concerned with knowing about your own state of mind and ___________.","o":["capabilities","preferences","resources","perceptions","All of the above"],"a":4,"f":1},{"q":"People with a heightened self-awareness are ______________.","o":["neither pessimistic nor overtly optimistic","either pessimistic or overtly optimistic","not pessimistic but overtly optimistic","pessimistic but not overtly optimistic"],"a":0,"f":1},{"q":"Self-awareness is _________ related to self-confidence.","o":["directly","indirectly","both indirectly and directly","not at all"],"a":0,"f":1},{"q":"___________ is ________ associated with higher job and relationship satisfaction, personal and social control, and happiness.","o":["Internal self-awareness/ positively","Internal self-awareness/ negatively","External self-awareness/ positively","External self-awareness/ negatively"],"a":0},{"q":"__________ is ____________ related to anxiety, stress, and depression.","o":["Internal self-awareness/ positively","Internal self-awareness/ negatively","External self-awareness/ positively","External self-awareness/ negatively"],"a":1},{"q":"The decisions of self-aware people ______________ their values; consequently, they often find work to be energizing.","o":["mesh with","go against","don’t correspond with","All of the above"],"a":0,"f":1},{"q":"People with strong self-Awareness ______________.","o":["are unable to conduct direct, authentic and accurate self-appraisals","are self-confident as they voice their opinions even if unpopular and welcome feedback","perceive situations inaccurately and ignore changes in their environment.","are unwilling to take risks for what they believe to be right"],"a":1},{"q":"We can develop our Self-Awareness through ______________.","o":["creating a timeline of our life history","identifying our role models","describing our strengths and weaknesses","All of the above"],"a":3,"f":1},{"q":"Emotional Intelligence (EI) is a type of economical intelligence and the ability of individuals to control their own money and use this to recognize and guide others’ businesses.","o":["True","False"],"a":1},{"q":"Emotional Intelligence is a collection of emotions, skills and characteristics that drive performance and success. It simply means using emotions intelligently according to your advantage.","o":["True","False"],"a":0},{"q":"Self-awareness means having a deep understanding of one’s emotions, strengths, weaknesses, needs, and drives.","o":["True","False"],"a":0},{"q":"Self-awareness is the second component of emotional intelligence. It is the inability to be honest with oneself and identify, understand and evaluate personal feelings.","o":["True","False"],"a":1},{"q":"Responsible Decision-Making refers to making ethical, constructive choices about personal and social behavior.","o":["True","False"],"a":0},{"q":"Relationship Skills refer to forming negative relationships, working individually, dealing aggressively with conflicts.","o":["True","False"],"a":1},{"q":"The more self-aware you become, the worse you are able to be in touch with your own feelings.","o":["True","False"],"a":1},{"q":"People with a heightened self-awareness are vague with themselves and with others, at work and at home.","o":["True","False"],"a":1},{"q":"Internal self-awareness refers to how clearly we see our own values, passions, aspirations, fit with our environment, and reactions (including thoughts, feelings, behaviors, strengths, and weaknesses).","o":["True","False"],"a":0},{"q":"People who know how others see them are not skilled at showing empathy and taking others’ perspectives.","o":["True","False"],"a":1},{"q":"External self-awareness refers to understanding how other people view us.","o":["True","False"],"a":0},{"q":"People who have self-awareness are apt to make decisions that bring on inner turmoil.","o":["True","False"],"a":1},{"q":"Self-Awareness can make us more proactive, boost our acceptance, and encourage positive self-development.","o":["True","False"],"a":0},{"q":"Self-awareness allows us to see things from the perspective of others, practice self-control, work creatively and productively, and experience pride in ourselves and our work as well as general self-esteem.","o":["True","False"],"a":0},{"q":"Self-awareness can make us inactive at our jobs, passive communicators in the workplace, and lower our self-confidence and job-related wellbeing.","o":["True","False"],"a":1},{"q":"A SWOT analysis on oneself _________________.","o":["is an objective and a sharp look inwards","stands for Soundness, Weaknesses, Options, and Teamwork","is a subjective and a strong look outwards","can make obstacles in one’s life"],"a":0},{"q":"Once you honestly prepare a list of your strengths and weaknesses and identify potential opportunities and obstacles in your life, you can make ______ decisions.","o":["unacceptable","informed","weak","unreasonable"],"a":1},{"q":"Which of the following is a way to do a personal SWOT?","o":["Take a strategic and proactive approach to your accomplishments.","Identify your inaccurate state of mind.","What are the core competencies and characteristics that you want people to associate with themselves?","What part of your personality would you like to hide and what part would you like to keep unshown?"],"a":0},{"q":"Which of the following is not a way to do a personal SWOT?","o":["Assess your current image, social-economic background and immediate environment.","View the environment around you from a micro and macro perspective. In other words, things which immediately affect you and things which can have an effect – both positive or negative in a few years.","How equipped are you to handle those potential situations: economically, financially, education-wise and exposure-wise? How do others currently perceive you?","Do you care about your perceptions of others?"],"a":3,"f":1},{"q":"_____________ is an example on weaknesses (SWOT analysis).","o":["Work experience","Education","Technical expertise","Lack of job knowledge"],"a":3},{"q":"________________ represent an example on strengths (SWOT analysis).","o":["Weak interpersonal skills","Negative personal characteristics","Personal characteristics","Bad networking contacts"],"a":2},{"q":"______________ represent an example on threats (SWOT analysis).","o":["Training and Education Obstacles","Unlimited Abilities to Develop","Unlimited Positions in Your Area","Positive trends in your field"],"a":0},{"q":"______________ is an example on opportunities (SWOT analysis).","o":["Limited personal development","A field that doesn’t need your skills","Enhancing education","Competition in your field"],"a":2},{"q":"Better self-evaluation naturally leads to improving the _____________ between our actions and our standards, resulting in better performance.","o":["alignment","inconsistency","disagreement","disharmony"],"a":0},{"q":"Good managers and leaders need __________ to perform well in their roles.","o":["only internal self-awareness","only external self-awareness","both types of self-awareness internal and external","neither internal nor external self-awareness"],"a":2,"f":1},{"q":"Experience can be _________ in terms of learning and improving the self.","o":["positive","negative","positive or negative","neutral"],"a":2},{"q":"Asking “_____” may lead to better introspection.","o":["what","who","when","where"],"a":0},{"q":"Decisions based on SWOT analysis help in making the worst impression and creation of your Personal Brand.","o":["True","False"],"a":1},{"q":"a way to do a personal SWOT is to conduct a cost-benefit analysis for your self-image change. For example, if you had to change yourself from being a very casual and free-spirited person to a very conservative and traditional person, is it worth it? Is the time, money and effort justified?","o":["True","False"],"a":0},{"q":"Self-awareness develops all at once. The process begins in childhood, as kids start being able to recognize and name their emotions, strengths and challenges, and likes and dislikes. And it stops over time.","o":["True","False"],"a":1},{"q":"Self-awareness spoils our communication, confidence, and thus our job performance.","o":["True","False"],"a":1},{"q":"Even positive experiences can lead one to attribute success to oneself when it may have had more to do with the circumstances, leading to false confidence.","o":["True","False"],"a":0},{"q":"Introspection is recommended to improve self-awareness, but with a focus on asking oneself the right questions. It has been noted that asking “why” might not always be effective, as many of our internal processes remain shrouded in our subconscious or unconscious minds.","o":["True","False"],"a":0},{"q":"To improve your self-awareness, asking “Why do I fail at this task so often?” can be better than asking “What are the circumstances in which I fail at this task, and what can I do to change them?”","o":["True","False"],"a":1},{"q":"Increased self-awareness leads to less self-care in medical students and an unreal understanding of one’s strengths and capabilities along with a boost to emotional intelligence in law students.","o":["True","False"],"a":1}],"c2l4":[{"q":"Communication is an ___________ life requirement; it is like breathing.","o":["inescapable","indispensable","essential","integral","all of the above"],"a":4,"f":1},{"q":"According to what you have studied, people generally spend up to ____ per cent of their waking day communicating with others.","o":["90","30","25","10","5"],"a":0},{"q":"Talking to a friend, listening to your teachers, shopping, talking to a partner at work, and meeting for dinner with a partner or talking to your mother are all cases of ________communication.","o":["interpersonal","impersonal","intrapersonal","non-personal"],"a":0},{"q":"Effective communication depends on the _______ of the communicated ideas.","o":["rarity","unclarity","richness","rigidity"],"a":2},{"q":"Communication involves the ________ of the information as much as the _________ of that information.","o":["deception/ misinterpretation","perception/ delivery","organization/ concealing","deploying / displacement"],"a":1},{"q":"Communication skills have been rated as ______ element used in choosing management staffs.","o":["a minor","an unimportant","a secondary","the major"],"a":3},{"q":"If you communicate well, you can _______ your message to others effectively and they then have clear instructions to enable them to complete their assigned tasks.","o":["deliver","convey","tell","encode","All of the above"],"a":4,"f":1},{"q":"Communication breakdowns result in ________ your ability to develop both professionally and personally.","o":["chances supporting","obstacles against","accesses allowing","mechanisms boosting"],"a":1},{"q":"Those who ___________ struggle to convey their thoughts and ideas in an accurate manner.","o":["lack communication skills","have good communication skills","try to teach communication skills","All of the above"],"a":0,"f":1},{"q":"Communication skills ________________.","o":["can be only inherited","can be mastered effortlessly","can be practiced and learned","should not be learnt before the age of 20"],"a":2},{"q":"Learning communication skills needs learning __________________.","o":["about how communication operates","how to communicate exactly ‘what it is’ we want to say","the factors that influence our ability to send and receive messages with awareness","All of the above"],"a":3,"f":1},{"q":"Communication serves as a valuable mechanism in ________ connections and engagement between people.","o":["avoiding","preventing","disallowing","building"],"a":3},{"q":"Getting your message across in a clear, concise way can be sometimes difficult with words alone. _________communication highly enhances written communication.","o":["Verbal","Non-verbal","Visual","All of the above"],"a":2,"f":1},{"q":"Sorts of __________ communication include animated GIFs, screenshots, videos, pie charts, etc.","o":["written","verbal","non-verbal","visual"],"a":3},{"q":"Body language, gestures, eye-contacts, appearance, and tone of one’s voice are used in ________ communication.","o":["written","verbal","non-verbal","visual"],"a":2},{"q":"_________ communication means sending wordless messages.","o":["Written","Verbal","Non-verbal","Visual"],"a":2},{"q":"In __________ communication, the ability to listen and think carefully before speaking is critical.","o":["written","verbal","non-verbal","visual"],"a":1},{"q":"___________ communication is known to be spontaneous.","o":["Written","Verbal","Non-verbal","Visual"],"a":1},{"q":"___________ communication is the most common type of conversation.","o":["Written","Verbal","Non-verbal","Visual"],"a":1},{"q":"________ communication involves the exchange of messages or information by using words through face to face or telephone conversations.","o":["Written","Verbal","Non-verbal","Visual"],"a":1},{"q":"____________ communication is used to provide well-thought and well-planned details.","o":["Written","Verbal","Non-verbal","Visual"],"a":0},{"q":"______________ communication can easily be reviewed","o":["Written","Verbal","Non-verbal","Visual"],"a":0},{"q":"You seek to ___________ your interactions with people with whom you wish to develop relationships.","o":["decrease","reduce","increase","reconsider"],"a":2},{"q":"Interpersonal communication is also used to ___________relationships that you have decided are no longer practical or need to be changed.","o":["end or reconsider","initiate or develop","maintain and improve","sustain or keep"],"a":0},{"q":"E-mail, texts, and other sorts of fast messages appear to be ‘essentially’ used to __________ relationships.","o":["end existing","stop","maintain existing","make new"],"a":2},{"q":"If you learn the principles and skills of interpersonal communication, you __________ more options for replying when family communication challenges come out.","o":["can develop","must have","will lose","may forget"],"a":0},{"q":"The abilities to listen to others, manage conflict, and develop quality interpersonal relationships with others are usually at the best skills list ______ ask for in today’s job seekers.","o":["employers","employees","employed people","All of the above"],"a":0,"f":1},{"q":"Developing friendships is considered one of the top-rated sources of _______ in life.","o":["depression and anxiety","satisfaction and happiness","paranoia","neurosis"],"a":1},{"q":"Losing a relationship is among life’s most ______events.","o":["stressful","relaxing","pleasing","satisfying"],"a":0},{"q":"The __________ of a message is the creator of the ideas and feelings expressed.","o":["source","message","channel","receiver","noise","feedback","context"],"a":0},{"q":"The source puts a message into a code, a process called ________. The opposite of which is the process of _________, which occurs when the receiver explains the source’s words or nonverbal cues.","o":["encoding/ decoding","decoding/ encoding","recoding/ coding","coding/ recoding"],"a":0},{"q":"____________ are the written, spoken, and unspoken elements of communication to which people assign meaning.","o":["Sources","Messages","Channels","Receivers","Noises","Feedbacks","Contexts"],"a":1},{"q":"The ________ is the means by which the message is expressed to the receiver.","o":["source","channel","noise","feedback","context"],"a":1},{"q":"The ____________ of the message is the person (or persons) who interprets the message and ultimately determines whether it was understood and appropriate.","o":["source","channel","receiver","noise","feedback","context"],"a":2},{"q":"__________ is anything that interferes with the message being interpreted.","o":["Source","Channel","Receiver","Noise","Feedback","Context"],"a":3},{"q":"“Beeps coming from a smartphone that signal incoming e-mail or text messages” are examples on ______________ noise. (Components of the Communication Process)","o":["external","physiological","internal","psychological"],"a":0},{"q":"“Hunger pains” are examples on ______________ noise. (Components of the Communication Process)","o":["external","physiological","internal","psychological"],"a":1},{"q":"“Thoughts, ["True","False"],"a":1},{"q":"Communication skills are vital to success in the workplace.","o":["True","False"],"a":0},{"q":"Lack of communication skills can be a block to the progress of lots of people.","o":["True","False"],"a":0},{"q":"There are different methods we communicate with others. No matter what form of communication we choose, it is important to have the true intention to connect with the other person.","o":["True","False"],"a":0},{"q":"Written communication involves any type of interaction that makes use of the spoken words.","o":["True","False"],"a":1},{"q":"A person must be careful of the words or expressions to be said. Any word that has been spoken cannot be taken back, so it is important to formulate expressions or sentences carefully.","o":["True","False"],"a":0},{"q":"Visual communication is the use of verbal elements to communicate information or ideas.","o":["True","False"],"a":1},{"q":"People initiate and form relationships by communicating with others.","o":["True","False"],"a":0},{"q":"If you learn the principles and skills of interpersonal communication, you won’t be able to develop creative, constructive solutions to family conflicts.","o":["True","False"],"a":1},{"q":"You may use social media to connect with friends and manage your relationships.","o":["True","False"],"a":0},{"q":"Research has revealed that instant messages (including text messages) can have a negative impact on your relationships, although not always.","o":["True","False"],"a":1},{"q":"More research has revealed that people initially recognize online messages as lower quality than face-to-face communication, but over time rate them just as positively.","o":["True","False"],"a":0},{"q":"Research has found that after someone passes away, friends or family members close his or her Facebook account to stop any messages in memory of that person.","o":["True","False"],"a":1},{"q":"Whether it happens on- or offline, interpersonal communication never helps you control your relationships.","o":["True","False"],"a":1},{"q":"It is stated that you will escape all family conflicts and your family relationships will always be peaceful if you learn the principles and skills of interpersonal communication.","o":["True","False"],"a":1},{"q":"A lot of surveys record the importance of quality interpersonal relationships in contributing to success at work.","o":["True","False"],"a":0},{"q":"One’s success or failure in a job often depends on how well one gets along with one’s supervisors and peers.","o":["True","False"],"a":0},{"q":"Studying interpersonal communication can offer awareness into our partners’ and friends’ behaviors.","o":["True","False"],"a":0},{"q":"Negative interpersonal relationships with others have direct benefits for your general health and happiness.","o":["True","False"],"a":1},{"q":"You can send a message unintentionally (talking to a professor before class) or intentionally (falling asleep during class); nonverbally (“Hi. How are you?”), verbally (a smile and a handshake), or in written form (this book).","o":["True","False"],"a":1},{"q":"You probably receive messages through a variety of channels, including mediated channels, such as text messaging, e-mail, phone, video conference, or Facebook.","o":["True","False"],"a":0},{"q":"Effective communicators are other-oriented; they understand that the receiver ultimately makes sense of the message they express.","o":["True","False"],"a":0},{"q":"For every action, there is a reaction. Without ‘feedback’, communication is rarely effective.","o":["True","False"],"a":0},{"q":"All communication takes place in some context. Context encompasses not only the physical environment, but also the people present and their relationships with the communicators, the communication goal, and the culture of which the communicators are a part.","o":["True","False"],"a":0},{"q":"We may understand what people mean and feel connected to them, but we may still disagree with them.","o":["True","False"]," ","Feelings of helplessness","Economical fatigue"],"a":3},{"q":"Which of the following is a symptom of chronic stress?","o":["Fast and heavy breathing","Emotional ups and downs","Emotional fatigue","Oversleeping"],"a":2},{"q":"If you perceive something as a challenge instead of a threat, the fear you would normally experience may turn into _____________.","o":["strong reactions","unhealthy behaviors","excitement and anticipation, or at least resolve","wear and tear on the body"],"a":2},{"q":"All forms of bad stress can become good stress through changing your perception of some of the stressors in your life.","o":["True","False"],"a":1},{"q":"As you practice looking at threats as challenges more often, it becomes more automatic, and you experience more good stress and less bad stress.","o":["True","False"],"a":0},{"q":"You can avoid stress by practicing some daily strategies like doing exercise, managing time effectively, considering talking to a therapist, etc.","o":["True","False"],"a":1},{"q":"Pupil dilation is a symptom of acute stress. As part of the fight-or-flight reaction, our pupils dilate to allow more light to enter the eyes and enable us to see our surroundings more clearly.","o":["True","False"],"a":0},{"q":"Stress is measurable. Healthcare providers can exactly determine the type of stress you are suffering from according to the symptoms you have.","o":["True","False"],"a":1}]};

  function lanternModel() { const g = new T.Group(); const m = std(0x3a3028, { metal: .7, rough: .35 }); g.add(at(cyl(0.06, 0.07, 0.02, m, 14), 0, 0, 0)); g.add(at(cyl(0.05, 0.05, 0.13, new T.MeshStandardMaterial({ color: 0xffe0a0, emissive: 0xffb040, emissiveIntensity: 1.6, transparent: true, opacity: .85 }), 14), 0, 0.08, 0)); [0, 1, 2, 3].forEach(i => { const a = i / 4 * 6.283; g.add(at(cyl(0.006, 0.006, 0.14, m, 6), Math.cos(a) * 0.055, 0.08, Math.sin(a) * 0.055)); }); g.add(at(cone(0.075, 0.06, m, 14), 0, 0.175, 0)); const r = new T.Mesh(new T.TorusGeometry(0.03, 0.006, 6, 12), m); r.position.y = 0.22; g.add(r); const gl = glowSprite(0xffb050, 0.35, .9); gl.position.y = 0.08; g.add(gl); return g; }

  /* =========================================================
     EXAMS — a quiz door beside every lecture + the MID exam boss
     Questions come from the course exercise PDFs (QBANK).
     Every attempt draws questions not seen in previous attempts
     (until the bank is used up) and shuffles questions + options.
     ========================================================= */
  let exam = null;
  const QUIZ_N = 10, QUIZ_PASS = 6, MID_N = 30, MID_PASS = 18, MID_LIVES = MID_N - MID_PASS;
  const lecById = id => LECTURES.find(L => L.id === id);
  const quizOf = id => (save.quiz || {})[id] || null;
  const quizPassed = id => { const q = quizOf(id); return !!(q && q.stars); };
  const allLecturesDone = () => LECTURES.every(L => save.stars[L.id]);
  const allQuizzesDone = () => LECTURES.every(L => quizPassed(L.id));
  const midUnlocked = () => allLecturesDone() && allQuizzesDone();
  const midDone = () => !!(save.mid && save.mid.stars);

  function buildExamQ(src, id, k) {
    const fixed = src.f || (src.o.length === 2 && /^true$/i.test(src.o[0]));
    let idx = src.o.map((t, j) => j); if (!fixed) idx = shuffle(idx);
    return { q: src.q, opts: idx.map(j => ({ t: src.o[j], ok: j === src.a })), ans: src.o[src.a], lec: id, k };
  }
  // draw n questions of a lecture that this player has not seen in this cycle
  function drawFresh(id, n, slot) {
    const bank = QBANK[id] || []; save.qseen = save.qseen || {};
    const seen = new Set(save.qseen[slot] || []), all = bank.map((q, k) => k);
    let fresh = shuffle(all.filter(k => !seen.has(k))), pick;
    if (fresh.length >= n) { pick = fresh.slice(0, n); save.qseen[slot] = [...seen, ...pick]; }
    else { pick = fresh.concat(shuffle(all.filter(k => seen.has(k)))).slice(0, n); save.qseen[slot] = pick.slice(); }
    return pick.map(k => buildExamQ(bank[k], id, k));
  }
  function midQuestions() {
    const ids = LECTURES.map(L => L.id), per = {}; ids.forEach(id => per[id] = Math.floor(MID_N / ids.length));
    let extra = MID_N - ids.length * per[ids[0]]; shuffle(ids.slice()).forEach(id => { if (extra > 0) { per[id]++; extra--; } });
    return shuffle(ids.flatMap(id => drawFresh(id, per[id], 'm:' + id)));
  }

  /* ---------- the two rooms ---------- */

      lines.forEach(([t, size, font, y, rtl]) => { x.direction = rtl && LANG !== 'en' ? 'rtl' : 'ltr'; x.font = `700 ${size}px ${font || "'IBM Plex Sans Arabic', Arial"}`; x.fillText(t, w / 2, y); });
      x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 3; x.beginPath(); x.moveTo(200, 300); x.lineTo(824, 300); x.stroke();
    });
  }
  function exitDoor(D, x, z) {

  }

    const ce = new T.Mesh(new T.PlaneGeometry(W, DP), new T.MeshStandardMaterial({ map: repTex(G.tex.ceiling, 5, 6) })); ce.rotation.x = Math.PI / 2; ce.position.set(0, H, -DP / 2); G.build.add(ce);
    wallBox(D, -W / 2 - 0.2, -DP / 2, 0.4, DP, H, wt); wallBox(D, W / 2 + 0.2, -DP / 2, 0.4, DP, H, wt); wallBox(D, 0, -DP - 0.2, W + 0.8, 0.4, H, wt);
    wallBox(D, -4.4, 0.2, W / 2 - 0.8 + 0.4, 0.4, H, wt); wallBox(D, 4.4, 0.2, W / 2 - 0.8 + 0.4, 0.4, H, wt); wallBox(D, 0, 0.2, 1.6, 0.4, H - 2.7, wt, 2.7, false);

  /* ---------- start / leave ---------- */
  function startQuiz(li) {

    fadeTo(() => {
      run = null; buildQuizRoom(L);

  function leaveExam() {

  /* ---------- question panel ---------- */
  function nextExamQ() {
    if (!exam) return; exam.i++; exam.answered = null;
    if (exam.kind === 'quiz' && exam.i >= exam.qs.length) return finishQuiz();
    renderExamPanel(); updateObjective();
  }
  function renderMidBar() {

    ui.boss.hidden = false; ui.boss.innerHTML = `<b>🎓 ${esc(BOSS_DEF.mid.name)}</b><div class="bar boss"><i style="width:${exam.bossHp}%"></i></div>`;
  }
  function renderExamPanel(fb = '') {
    const e = exam; if (!e) return; const q = e.qs[e.i]; if (!q) return; ui.sub.hidden = true;
    const L = lecById(q.lec);
    const opts = q.opts.map((o, k) => { let cls = ''; if (e.answered !== null) { if (o.ok) cls = 'ok'; else if (k === e.answered) cls = 'no'; } return `<button class="opt ${cls}" data-k="${k}" ${e.answered !== null ? 'disabled' : ''}><span class="k">${OPTK[k]}</span><span>${esc(o.t)}</span></button>`; }).join('');
    const head = e.kind === 'quiz'

    if (e.answered === null) ui.dock.querySelectorAll('.opt').forEach(o => o.onclick = () => examAnswer(+o.dataset.k));
    else { const bn = $('#bn'); if (bn) bn.onclick = examNext; }
  }
  function examAnswer(k) {
    const e = exam; if (!e || e.answered !== null) return; const q = e.qs[e.i]; if (!q || !q.opts[k]) return;
    e.answered = k; const ok = q.opts[k].ok;
    if (ok) e.right++; else { e.wrong++; e.missed.push(q); }
    const last = e.kind === 'quiz' ? e.i >= e.qs.length - 1 : (e.right >= MID_PASS || e.wrong > MID_LIVES);
    const btn = e.kind === 'mid' && e.right >= MID_PASS ? tx('الضربة القاضية 🗡️', 'Final blow 🗡️') : e.kind === 'mid' && e.wrong > MID_LIVES ? '💀' : last ? tx('النتيجة 🏁', 'Results 🏁') : tx('التالي ▸', 'Next ▸');
    const fb = `<div class="bfb ${ok ? 'good' : 'bad'}">${ok ? (e.kind === 'mid' ? tx('⚔️ إصابة! إجابة صحيحة', '⚔️ Hit! Correct answer') : tx('✅ إجابة صحيحة!', '✅ Correct!')) : `❌ ${tx('الصحيح:', 'Correct:')} <b class="en">${esc(q.ans)}</b>`}<button class="btn small" id="bn">${btn}</button></div>`;

    } else {
      e.hp = Math.max(0, Math.round(100 * (1 - e.wrong / (MID_LIVES + 1)))); if (B) B.act('attack'); sfx.roar();
      setTimeout(() => projectile(bp, G.cam.position.clone().add(new V3(0, -0.3, 0)), 0xff4a1a, () => { flashRed(); sfx.bad(); shake(.5); floatScreen('-❤️', '#ff7b70'); renderHUD(); }), 350);
    }
  }

  function reviewHTML(list) {

  }

  /* ---------- results ---------- */
  function finishQuiz() {
    const e = exam, L = e.L, n = e.qs.length, r = e.right;
    const stars = r >= n ? 3 : r >= n - 2 ? 2 : r >= QUIZ_PASS ? 1 : 0;
    save.quiz = save.quiz || {}; const old = save.quiz[L.id] || { best: 0, stars: 0, tries: 0 };
    const firstPass = stars && !old.stars;
    save.quiz[L.id] = { best: Math.max(old.best, r), stars: Math.max(old.stars, stars), tries: old.tries + 1 };
    gainXP(r * 6 + (firstPass ? 60 : 0)); persist(); setDock(''); updateObjective();
    if (stars) { sfx.win(); for (let i = 0; i < 4; i++) setTimeout(() => burst(new V3((Math.random() - .5) * 5, 2.5, -14), [0xffd27a, 0x7fd8ff, 0x8ff0a6][i % 3], 40, 5, 1.2, .5, 2), i * 250); } else sfx.bad();
