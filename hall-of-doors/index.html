aknesses, opportunities and obstacles, you make informed decisions that help build your <b><em>Personal Brand</em></b>.</p> <p>Ways to do it: a strategic, proactive approach to your achievements · define your ideal state of mind · which competencies do you want people to associate with you? · assess your image, background and environment · look at the environment from a <b>micro and macro</b> perspective · are you equipped? · a <b><em>cost-benefit analysis</em></b> of changing your image · do you care how others see you? · can you change, and are the benefits worth the costs?</p> <div class=\"swot\"><div><b>S</b> work experience, education, technical expertise, personal traits, good contacts, professional associations</div><div><b>W</b> lack of experience, limited education / wrong major, limited technical knowledge, weak people skills, negative traits</div><div><b>O</b> positive trends in your field, further education, fields that need your skills, ability to relocate</div><div><b>T</b> negative trends, competition, training obstacles, limited advancement, few jobs in your area</div></div>","c2l3.steps.7.tip":"S and W are internal 🧍 | O and T are external 🌍","c2l3.steps.7.qs.1.e":"A negative external factor = Threats.","c2l3.steps.7.qs.3.e":"An internal Weakness.","c2l3.steps.8.title":"Puzzle of the Four Squares","c2l3.steps.8.intro":"Place each item in the correct SWOT square.","c2l3.steps.9.title":"Self-Awareness at Work and in Leadership","c2l3.steps.9.body":"<p>Self-awareness improves communication and confidence and therefore performance (<em>Sutton et al., 2015</em>), because better self-evaluation improves <b>the alignment between our actions and our standards</b>. Good leaders need <b>both types</b> (internal and external).</p> <p>⚠️ Experience and power <b>don’t necessarily mean</b> more self-awareness; even positive experiences can make someone credit themselves for success that came from circumstances → <b>false confidence</b>.</p> <p>📊 In <b><em>Eurich (2018)</em></b>’s study, only <b>10–15%</b> showed self-awareness, even though most of us think we are self-aware!</p> <p>Eurich recommends <b><em>introspection</em></b> (examining your thoughts and feelings) while asking the right questions: asking <b>“why”</b> isn’t always effective because many of our processes are unconscious; it is better to ask <b>“what”</b>.</p> <p>Example: instead of “Why do I fail at this task so often?” ask: <b>“In what conditions do I fail, and what can I change?”</b></p>","c2l3.steps.9.tip":"Ask “What”, not “Why” ❓ | only 10–15% are truly self-aware","c2l3.steps.9.qs.3.e":"False confidence from crediting yourself with success.","c2l3.steps.10.title":"Students and Radhika’s Story","c2l3.steps.10.body":"<p>Self-awareness also benefits students and children: better communication with teachers and classmates, more confidence, satisfaction with performance. It begins <b>in childhood</b> and keeps developing. It leads to <b>greater self-care among medical students</b> (<em>Saunders et al., 2007</em>) and <b>better understanding of abilities and stronger EI among law students</b> (<em>James, 2011</em>).</p> <p>📖 <b><em>Case in Point: Radhika</em></b>: the daughter of a wealthy businessman who pushed her to study <b>commerce</b> to become a <b>CA</b> (<em>Chartered Accountant</em>: a specialist in auditing, tax and accounting) and secured her a job at one of the <b>Big Four</b> (the four largest accounting firms). On a break she did deep <em>soul searching</em> and realised accounting wasn’t her passion — she loved <b>art</b>. Despite her parents’ anger she <b>stood by her conviction</b>, studied art and design, and today she is <b>the leading art historian in her field</b>.</p>","c2l3.steps.10.tip":"Radhika: accounting ❌ → art ✅ = a decision aligned with her values","c2l3.steps.10.qs.0.e":"Soul searching → art.","c2l4.ar":"Communication Skills","c2l4.realm":"Tower of Messages","c2l4.boss.name":"King of Noise","c2l4.boss.lore":"A king who lives on interference and cuts off every message before it arrives. You’ll only defeat him if you understand the elements of the communication process, its methods and its five principles.","c2l4.steps.0.title":"Introduction: What Is Communication?","c2l4.steps.0.body":"<p>There is a basic, universal need to interact with others. Communication is <b>an inescapable requirement, like breathing</b>. People spend up to <b>90%</b> of their waking hours communicating with others (talking to a friend, listening to a teacher, shopping…). Through it we develop, maintain and sometimes end our relationships.</p> <p><b>Definition of communication</b>: <em>“the <b>art and process of creating and sharing ideas</b>.”</em></p> <p>Effective communication depends on the <b><em>richness of those ideas</em></b>, and it involves <b><em>perception as much as delivery</em></b>.</p>","c2l4.steps.0.tip":"Communication = an art + a process of creating and sharing ideas 🎨⚙️","c2l4.steps.1.title":"Why Communication Matters","c2l4.steps.1.body":"<p>In a survey by the <b><em>Katz Business School — University of Pittsburgh</em></b>, organisations rated <b>communication skills as the most important factor in choosing managers</b>. The study showed that <b>oral and written</b> communication skills are important predictors of career success.</p> <p>Communicate well → others get clear instructions. Communicate poorly → messages get <em>“lost in translation”</em>, and <b><em>communication breakdowns</em></b> become barriers to your professional and personal growth.</p> <p>Many people struggle to convey their ideas accurately, which makes it hard to advance and lead. The good news: <b>communication skills can be practised and learned</b>.</p>","c2l4.steps.1.tip":"Katz – Pittsburgh: communication is #1 for choosing managers 🏆","c2l4.steps.2.title":"The Four Methods of Communication","c2l4.steps.2.body":"<ol><li><b><em>Written</em></b>: any interaction using written words. Used for <b>well-thought-out, planned</b> details, and it can be <b>easily reviewed</b>.</li> <li><b><em>Verbal (spoken)</em></b>: face to face or by phone. <b>The most common</b> because it allows <b>immediate feedback</b>, and it is <em>spontaneous</em>. Careful: <b>spoken words can’t be taken back</b>, so think before you speak.</li> <li><b><em>Non-Verbal</em></b>: messages without words: <b>body language, gestures, eye contact, appearance, tone of voice</b>.</li> <li><b><em>Visual Communication</em></b>: <em>GIFs</em>, screenshots, video, <em>pie charts</em>. It <b>greatly enhances written communication</b>.</li></ol> <p>Whatever the method, what matters is <b>the genuine intention to connect</b> with the other person.</p>","c2l4.steps.2.tip":"Tone of voice = Non-verbal (not verbal!) 🎵","c2l4.steps.2.qs.0.e":"Verbal: the most common.","c2l4.steps.3.title":"Puzzle of the Four Channels","c2l4.steps.3.intro":"Place each example under the correct method of communication.","c2l4.steps.4.title":"Communication Manages Relationships","c2l4.steps.4.body":"<p>We start and maintain relationships <b>through communication</b>, and we also use it to <b>end</b> or reconsider them.</p> <p>📱 Instant messaging has a positive effect on relationships (though not always). Email and messages are used mainly <b>to maintain existing relationships</b>. At first people see electronic messages as <b>lower quality</b> than face-to-face communication, <b>but over time they rate them just as positively</b>. Even after someone dies, loved ones may keep their Facebook account to post messages in their memory.</p> <ul><li><b>Improved Relationships with Family</b>: disagreements won’t disappear, but you’ll have <b>more ways to respond</b> and creative, constructive solutions.</li> <li><b>with Colleagues</b>: listening, managing conflict and building relationships are among <b>the skills employers want most</b>.</li> <li><b>with Friends</b>: friendship is one of the greatest sources of happiness, and <b>losing a relationship is one of life’s most stressful events</b>.</li> <li><b>Improved Physical and Emotional Health</b>: positive relationships directly benefit your health and happiness.</li></ul>","c2l4.steps.4.tip":"Electronic messages: lower quality at first… then just as positive ⏳","c2l4.steps.4.qs.2.e":"It doesn’t mean disagreements disappear.","c2l4.steps.5.title":"The Seven Elements of the Communication Process","c2l4.steps.5.body":"<ol><li><b><em>Source</em></b>: the creator of ideas and feelings. Putting the message into a code = <b><em>encoding</em></b>. Its reverse is <b><em>decoding</em></b>: when the receiver interprets the words and signals.</li> <li><b><em>Message</em></b>: the written, spoken and unspoken elements we give meaning to. It may be <b>intentional</b> (talking to your professor) or <b>unintentional</b> (sleeping in the lecture!), verbal, non-verbal or written.</li> <li><b><em>Channel</em></b>: the means by which the message is expressed: texts, email, phone, video, Facebook, Twitter.</li> <li><b><em>Receiver</em></b>: interprets the message and <b>ultimately</b> decides whether it was understood and appropriate. An effective communicator is <b><em>other-oriented</em></b>.</li> <li><b><em>Noise</em></b>: anything that interferes with interpreting the message as intended, and it is <b>always present</b>: <b>external</b> (phone notification sounds), <b>physiological</b> (hunger pangs), <b>internal/psychological</b> (thoughts and worries).</li> <li><b><em>Feedback</em></b>: the response to the message. <em>“For every action, there is a reaction.”</em> Without it, communication is rarely effective.</li> <li><b><em>Context</em></b>: the <b>physical and psychological environment</b> of communication, including who is present, their relationships, the purpose and the culture.</li></ol>","c2l4.steps.5.tip":"Source → message → channel → receiver, with noise, feedback and context 📡","c2l4.steps.6.title":"Puzzle of the Seventh Tower","c2l4.steps.6.intro":"Match each element of communication with its definition.","c2l4.steps.7.title":"Puzzle of the Noisy Voices","c2l4.steps.7.intro":"What type of noise is it?","c2l4.steps.8.title":"The Five Principles of Communication + Social Media","c2l4.steps.8.body":"<ol><li><b>It <em>connects us to others</em></b>: we may understand them and feel connected, but we may also disagree.</li> <li><b>It is <em>irreversible</em></b>: you can’t press “delete”; communication creates meaning in others.</li> <li><b>It is <em>complicated</em></b> (many components): untangling its problems takes time, skill and patience.</li> <li><b>It is <em>governed by rules</em></b>: rules that develop <b>jointly</b> between the people in a relationship.</li> <li><b>It has <em>content and relationship dimensions</em></b>.</li></ol> <p>🌐 <b>Communication and social media</b>: we can communicate without meeting face to face to start and maintain relationships. Also called <b><em>Electronically Mediated Communication (EMC)</em></b>: email, messages and any electronic means, whether the person is miles away or in the next room.</p>","c2l4.steps.9.title":"Puzzle of the Five Principles","c2l4.steps.9.intro":"Match each principle with its explanation.","c2l5.ar":"Stress Management","c2l5.realm":"Storm Summit","c2l5.boss.name":"Giant of the Chronic Storm","c2l5.boss.lore":"The final boss! A giant made of anxiety and piled-up pressure. It knows the types, causes and symptoms of stress… and can only be beaten by someone who knows how to turn a threat into a challenge.","c2l5.steps.0.body":"<ul><li><b>betterup.com</b>: <em>Stress is our <b>psychological and physiological reaction</b> to an event or condition that is considered a <b>threat or challenge</b>.</em></li> <li><b>Cleveland Clinic</b>: <em>Stress is a <b>normal reaction</b> the body has when <b>changes</b> occur, resulting in physical, emotional and intellectual responses.</em></li> <li><b>verywellmind.com</b>: <em>any type of <b>change</b> that causes physical, emotional, or psychological <b>strain</b>. Your body’s response to anything that requires attention or action.</em></li></ul> <p>🔑 From the definitions: stress is the <b><em>responses</em></b> to causes called <b><em>stressors</em></b>.</p>","c2l5.steps.0.tip":"Stressor = the cause ⚡ | Stress = the response 😣","c2l5.steps.1.title":"The Four Types of Stress","c2l5.steps.1.body":"<p>Not all stress is harmful or negative!</p> <ol><li><b><em>Acute stress</em></b>: <b>very short-term</b>, may be positive or distressing, and <b>the most common</b> in daily life. Emotions and body return to normal quickly.</li> <li><b><em>Episodic acute stress</em></b>: when acute stress happens <b>frequently</b>, such as repeated tight deadlines or jobs like <b>healthcare workers</b>. There is no time to return to calm, so the effects pile up.</li> <li><b><em>Chronic stress</em></b>: seems <b>never-ending and inescapable</b>; the result of stressors that last a long time: an unhappy marriage, an extremely demanding job, childhood trauma, living in a high-crime neighbourhood. It’s hard to see a way to change.</li> <li><b><em>Eustress</em></b> (“good stress”): the stress we feel when we are <b>excited</b>: the pulse quickens and hormones surge <b>without threat or fear</b>. Linked to adrenaline: skiing, a <em>roller coaster</em>, competing for a promotion, a first date. It keeps us <b>feeling alive</b>.</li></ol> <p>Your stress level differs with <b>your personality</b> and how you respond.</p>","c2l5.steps.1.tip":"Eustress = good stress 🎢 | Chronic = never-ending ♾️","c2l5.steps.2.title":"Puzzle of the Four Clouds","c2l5.steps.2.intro":"Classify each situation by its type of stress.","c2l5.steps.3.body":"<p>Stressors differ from person to person (traffic makes one person angry while another turns up the music!). <b>Life stresses</b>: moving to a new home, a chronic illness or injury, emotional problems, caring for an elderly or sick family member.</p> <p>The most common causes:</p> <ol><li><b><em>Financial obligations</em></b>: unpaid bills, long unemployment, growing debt, losing a job (which also hits self-confidence) → may lead to <em>job search depression</em>.</li> <li><b><em>Death of a loved one</em></b>: grief + loneliness, disappointment and even anger.</li> <li><b><em>Traumatic events</em></b>: natural disasters, accidents, theft, violence; often <b>beyond our control</b>.</li> <li><b><em>Problems and demands at work</em></b>: too much work, <b>job insecurity</b>, dissatisfaction, conflicts with the boss or colleagues, and performance pressure from <b>near-instant communication</b> → <b><em>burnout</em></b>.</li> <li><b><em>Relationship issues</em></b>: <em>toxic</em> people; social media encourages <b>comparing yourself to others</b> and makes bullying easier. Divorce and unhappy marriages = severe stressors.</li> <li><b><em>Parenting</em></b>: busy schedules; high stress can make a parent <b>harsh and authoritarian</b>. Highest risk: parents of children with behavioural disorders and developmental delays; <b>parents of autistic children</b> report higher stress.</li></ol>","c2l5.steps.3.tip":"Money 💸 · loss 🕊️ · trauma ⚡ · work 💼 · relationships 💔 · parenting 👶","c2l5.steps.4.body":"<p><b>How is stress diagnosed?</b> Stress is <b><em>subjective</em> and can’t be measured by tests</b>. Only the person can tell whether it is present and how severe. A doctor may use <b>questionnaires</b>. For chronic stress, the doctor assesses the resulting symptoms, such as <b>high blood pressure</b>.</p> <p><b>What happens in the body?</b> The <b><em>autonomic nervous system</em></b> controls heart rate, breathing and vision changes (<b>involuntary responses</b>). Its built-in stress response is the <b><em>“fight-or-flight response”</em></b>.</p> <p>Stress can be <b>positive</b>: it keeps us alert and motivated (an important exam makes you work harder and stay up). But it becomes a problem when stressors continue <b>without relief</b>. Chronic stress causes <b><em>wear and tear</em></b> on the body.</p>","c2l5.steps.4.tip":"Stress is subjective, not measured by a lab test 🧪❌ | fight-or-flight 🥊🏃","c2l5.steps.5.title":"Symptoms of Each Type","c2l5.steps.5.body":"<p><b><em>Acute stress</em></b>: <b><em>pupil dilation</em></b> (to let in more light) · <b>faster heart rate</b> · <b><em>perspiration</em></b> · <b>rapid, heavy breathing</b> (more oxygen) · anxiety · mood swings · poor sleep · poor concentration.</p> <p><b><em>Episodic acute stress</em></b>: <b><em>muscle tension</em></b> · clearer loss of concentration and memory · feeling <em>overwhelmed</em> · <b>uncontrolled anger and irritability</b> · <b><em>migraines</em></b> · <b><em>hypertension</em></b> (only detected by measuring it).</p> <p><b><em>Chronic stress</em></b>: <b>weight gain</b> (emotional eating or hormonal imbalance) · <b>high adrenaline and cortisol</b> (harming memory and digestion and weakening immunity) · <b><em>insomnia</em></b> · <b><em>panic attacks</em></b> · <b>feelings of helplessness</b> · <b>chronic headaches</b> (more than 15 days a month) · <b>emotional exhaustion</b>.</p>","c2l5.steps.5.tip":"Acute = body on alert 👁️❤️💦 | Episodic = muscles & headaches 💪🤕 | Chronic = hormones & insomnia 😴❌","c2l5.steps.6.title":"Puzzle of the Three Symptom Sets","c2l5.steps.6.intro":"Place each symptom under the type of stress it was listed with in the lecture.","c2l5.steps.7.title":"Coping with and Preventing Stress","c2l5.steps.7.body":"<p><b>Stress-relief strategies</b>:</p> <ul><li>Exercise when symptoms start; even a short walk lifts your mood.</li> <li>At the end of each day, think about <b>what you accomplished</b>, not what you didn’t.</li> <li>Set goals for your day, week and month; <b>time management and work-life balance</b>.</li> <li>Talk to a therapist or healthcare provider.</li></ul> <p><b>Ways to prevent stress</b>:</p> <ul><li>Relaxation activities: <b>meditation, yoga, tai chi</b>, breathing exercises, muscle relaxation; and time in <b>nature</b>.</li> <li>Take care of your body: healthy food, exercise, enough sleep.</li> <li>Stay positive and practise <b>gratitude</b>.</li> <li><b>Accept that you can’t control everything</b>.</li> <li>Learn to say <b>“no”</b> to extra responsibilities.</li> <li>Stay connected with people who bring you calm and support.</li></ul>","c2l5.steps.7.tip":"Say “no” 🙅 · gratitude 🙏 · nature 🌳 · sleep 😴","c2l5.steps.7.qs.1.e":"One of the prevention methods.","c2l5.steps.8.title":"How Does Bad Stress Turn into Good Stress?","c2l5.steps.8.body":"<p>Not every bad stress can become good, but you can change your <b><em>perception</em></b> of some stressors.</p> <p>The body reacts strongly to <b>perceived threats</b>. If you don’t perceive something as a threat, there is no threat-based stress response. And if you see it as a <b>challenge</b> instead of a threat, fear turns into <b>excitement and anticipation</b>, or at least determination.</p> <p>How to change your perception?</p> <ul><li>Focus on the <b>resources</b> available to meet the challenge.</li> <li>Look at the <b>potential benefits</b> of the situation.</li> <li>Remind yourself of <b>your strengths</b>.</li> <li>Adopt a <b>positive mindset</b> (think like an optimist).</li></ul> <p>With practice this becomes <b>automatic</b>: more good stress, less bad stress.</p>","c2l5.steps.8.tip":"Threat ⚠️ → challenge 🏆 = bad stress → good stress","c2l5.steps.8.qs.1.e":"The ways: resources, benefits, strengths, positive mindset.","c1l1.steps.0.title":"What is a Skill?","c1l1.steps.1.title":"WHO 2003","c1l1.steps.2.title":"WHO & UNICEF","c1l1.steps.4.title":"UNESCO & CALSCA","c1l1.steps.6.title":"Importance","c1l2.steps.1.title":"Opportunity Recognition","c1l2.steps.8.title":"Drawbacks","c1l3.steps.0.title":"Two-way Street","c1l3.steps.2.title":"Wilfred M (2014)","c1l3.steps.5.title":"Resourcefulness","c1l3.steps.6.title":"Life-skilled Entrepreneurs","c2l2.steps.0.title":"Problem Framing","c2l2.steps.1.title":"Problem Statement","c2l2.steps.8.title":"Six-Step Model","c2l3.steps.0.title":"Emotional Intelligence","c2l5.steps.0.title":"Definitions","c2l5.steps.3.title":"Stressors","c2l5.steps.4.title":"Responding"};

  const G = { ok: false, t: 0, parts: [], emitters: [], tweens: [], boxes: [], circles: [], lamps: [], inter: [], anims: [], zone: 'house', shake: 0, npcs: {} };
  let T, V3;
  function initGL() {
    try {
      if (!window.THREE) throw new Error('three missing');
      T = window.THREE; V3 = T.Vector3; G.T = T;
      const q = Q();
      const r = new T.WebGLRenderer({ canvas: $('#stage'), antialias: q.aa, powerPreference: 'high-performance' });
      r.outputEncoding = T.sRGBEncoding; r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
      r.physicallyCorrectLights = false;
      const scene = new T.Scene(); scene.background = new T.Color(0x05040a); scene.fog = new T.Fog(0x05040a, 18, 60);
      const cam = new T.PerspectiveCamera(save.set.fov, 1, 0.05, 400); scene.add(cam);
      Object.assign(G, { ok: true, r, scene, cam, clock: new T.Clock(), uTime: { value: 0 }, world: new T.Group(), dungeon: null });
      scene.add(G.world);
      G.hemi = new T.HemisphereLight(0xffe2c0, 0x2a2030, 0.55); scene.add(G.hemi);
      G.amb = new T.AmbientLight(0x404058, 0.25); scene.add(G.amb);
      G.pool = []; for (let i = 0; i < 6; i++) { const l = new T.PointLight(0xffc488, 0, 9, 1.4); scene.add(l); G.pool.push(l); }
      G.fx = new T.PointLight(0xffd27a, 0, 12, 1.5); scene.add(G.fx);
      G.flash = new T.SpotLight(0xfff2d0, 0, 22, 0.42, 0.45, 1.2); cam.add(G.flash); G.flash.position.set(0.15, -0.1, 0); G.flash.target.position.set(0, 0, -5); cam.add(G.flash.target);
      makeTextures();
      resize(); addEventListener('resize', resize);
      return true;
    } catch (e) { console.error(e); G.ok = false; return false; }
  }
  function resize() {
    if (!G.ok) return;
    G.r.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q().pr)); G.r.setSize(innerWidth, innerHeight, false);
    G.cam.aspect = innerWidth / innerHeight; G.cam.fov = save.set.fov + (G.cam.aspect < 0.8 ? 10 : 0); G.cam.updateProjectionMatrix();
  }
  function applyQuality() { resize(); }

  /* ---------- canvas textures ---------- */
  function canvasTex(w, h, draw, rep) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = Q().aniso;
    if (rep) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
    return t;
  }
  function speckle(x, w, h, n, a) { for (let i = 0; i < n; i++) { x.fillStyle = `rgba(${rnd(2) ? 255 : 0},${rnd(2) ? 255 : 0},${rnd(2) ? 255 : 0},${a})`; x.fillRect(rnd(w), rnd(h), 1 + rnd(2), 1 + rnd(2)); } }
  function makeTextures() {
    const X = G.tex = {};
    X.planks = canvasTex(512, 512, (x, w, h) => {
      const rows = 8, rh = h / rows;
      for (let r = 0; r < rows; r++) { let off = (r % 2) * 170 + rnd(60); for (let k = -1; k < 3; k++) {
        const x0 = off + k * 256, hue = 26 + rnd(8), l = 30 + rnd(12); const g = x.createLinearGradient(0, r * rh, 0, r * rh + rh); g.addColorStop(0, `hsl(${hue},45%,${l + 4}%)`); g.addColorStop(1, `hsl(${hue},48%,${l - 3}%)`); x.fillStyle = g; x.fillRect(x0, r * rh, 256, rh);
        x.strokeStyle = `rgba(60,30,10,.25)`; x.lineWidth = 1; for (let i = 0; i < 7; i++) { x.beginPath(); const yy = r * rh + 4 + rnd(rh - 8); x.moveTo(x0, yy); x.bezierCurveTo(x0 + 80, yy + rnd(6) - 3, x0 + 170, yy + rnd(6) - 3, x0 + 256, yy); x.stroke(); }
        x.fillStyle = 'rgba(20,10,5,.55)'; x.fillRect(x0, r * rh, 2, rh); }
        x.fillStyle = 'rgba(20,10,5,.6)'; x.fillRect(0, r * rh, w, 2); }
      speckle(x, w, h, 1500, .04);
    }, [3, 3]);
    X.tiles = canvasTex(256, 256, (x, w, h) => { x.fillStyle = '#9aa3a8'; x.fillRect(0, 0, w, h); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { const l = 86 + rnd(6); x.fillStyle = `hsl(200,8%,${l}%)`; x.fillRect(i * 64 + 2, j * 64 + 2, 60, 60); const g = x.createLinearGradient(i * 64, j * 64, i * 64 + 64, j * 64 + 64); g.addColorStop(0, 'rgba(255,255,255,.25)'); g.addColorStop(1, 'rgba(0,0,0,.05)'); x.fillStyle = g; x.fillRect(i * 64 + 2, j * 64 + 2, 60, 60); } }, [4, 4]);
    X.blueTiles = canvasTex(256, 256, (x, w, h) => { x.fillStyle = '#5d7b86'; x.fillRect(0, 0, w, h); for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { x.fillStyle = `hsl(190,${35 + rnd(10)}%,${55 + rnd(8)}%)`; x.fillRect(i * 32 + 1, j * 32 + 1, 30, 30); } }, [3, 3]);
    X.checker = canvasTex(256, 256, (x, w, h) => { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.fillStyle = (i + j) % 2 ? '#2b2b30' : '#e8e4da'; x.fillRect(i * 64, j * 64, 64, 64); } speckle(x, w, h, 800, .05); }, [4, 4]);
    X.carpet = canvasTex(256, 256, (x, w, h) => { x.fillStyle = '#5a6f5a'; x.fillRect(0, 0, w, h); speckle(x, w, h, 9000, .06); }, [4, 4]);
    X.fabric = canvasTex(128, 128, (x, w, h) => { x.fillStyle = '#888'; x.fillRect(0, 0, w, h); for (let i = 0; i < w; i += 2) { x.fillStyle = `rgba(0,0,0,${Math.random() * .08})`; x.fillRect(i, 0, 1, h); x.fillRect(0, i, w, 1); } speckle(x, w, h, 2000, .05); }, [2, 2]);
    X.ceiling = canvasTex(256, 256, (x, w, h) => { x.fillStyle = '#e9e5dc'; x.fillRect(0, 0, w, h); speckle(x, w, h, 4000, .03); }, [4, 4]);
    const wp = (base, draw) => canvasTex(256, 256, (x, w, h) => { x.fillStyle = base; x.fillRect(0, 0, w, h); draw(x, w, h); speckle(x, w, h, 2500, .025); }, [1, 1]);
    X.wall_mine = wp('#7f9fc0', (x) => { x.fillStyle = 'rgba(255,255,255,.18)'; for (let i = 0; i < 18; i++) { const cx = rnd(256), cy = rnd(256), r = 3 + rnd(4); x.beginPath(); for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2, rr = k % 2 ? r : r * 2.2; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.fill(); } });
    X.wall_hall = wp('#cdbb9c', (x) => { for (let i = 0; i < 256; i += 32) { x.fillStyle = 'rgba(120,90,50,.1)'; x.fillRect(i, 0, 12, 256); } });
    X.wall_living = wp('#d8c7a8', (x) => { x.strokeStyle = 'rgba(150,110,60,.18)'; x.lineWidth = 2; for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.beginPath(); x.ellipse(i * 64 + 32, j * 64 + 32, 14, 22, 0, 0, 7); x.stroke(); x.beginPath(); x.moveTo(i * 64 + 32, j * 64 + 4); x.lineTo(i * 64 + 32, j * 64 + 60); x.stroke(); } });

  function plant(x, z, s = 1) { const g = grp(x, z); g.scale.setScalar(s); g.add(at(cyl(0.18, 0.13, 0.32, M.pot, 16), 0, 0.16, 0)); g.add(at(cyl(0.16, 0.16, 0.02, std(0x3a2a1a)), 0, 0.31, 0)); for (let i = 0; i < 9; i++) { const lf = new T.Mesh(new T.SphereGeometry(0.12, 10, 6), M.plant); lf.scale.set(0.5, 1.6, 0.25); const a = i / 9 * 6.28; lf.position.set(Math.cos(a) * 0.12, 0.55 + Math.random() * 0.25, Math.sin(a) * 0.12); lf.rotation.set(Math.sin(a) * 0.5, a, Math.cos(a) * 0.5); g.add(lf); } addBox(x - 0.2 * s, x + 0.2 * s, z - 0.2 * s, z + 0.2 * s, 0, 0.8); return g; }
  function picture(axis, k, c, y, w, h, inward, art) { const t = canvasTex(256, Math.round(256 * h / w), art); const g = new T.Group(); G.build.add(g); if (axis === 'x') { g.position.set(c, y, k + inward * 0.09); g.rotation.y = inward > 0 ? 0 : Math.PI; } else { g.position.set(k + inward * 0.09, y, c); g.rotation.y = inward > 0 ? Math.PI / 2 : -Math.PI / 2; } g.add(at(rbox(w + 0.08, h + 0.08, 0.03, M.darkWood, 0.01), 0, 0, 0)); g.add(at(new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshStandardMaterial({ map: t, roughness: .6 })), 0, 0, 0.017)); return g; }
  const artLandscape = (x, w, h) => { const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#f2b880'); g.addColorStop(1, '#6a8ab0'); x.fillStyle = g; x.fillRect(0, 0, w, h); x.fillStyle = '#4a6a3a'; x.beginPath(); x.moveTo(0, h); x.lineTo(w * .3, h * .5); x.lineTo(w * .55, h * .75); x.lineTo(w * .8, h * .4); x.lineTo(w, h); x.fill(); x.fillStyle = '#fff3c0'; x.beginPath(); x.arc(w * .7, h * .25, 16, 0, 7); x.fill(); };
  const artFamily = (x, w, h) => { x.fillStyle = '#e8dcc8'; x.fillRect(0, 0, w, h); const cols = ['#8a4a2a', '#4a2a1a', '#2a2a3a', '#6a3a5a']; for (let i = 0; i < 4; i++) { const cx = w * (0.2 + i * 0.2), s = i < 2 ? 1 : 0.8; x.fillStyle = '#d8a880'; x.beginPath(); x.arc(cx, h * 0.38 + (1 - s) * 30, 16 * s, 0, 7); x.fill(); x.fillStyle = cols[i]; x.fillRect(cx - 18 * s, h * 0.5 + (1 - s) * 30, 36 * s, h * 0.5); } };
  const artPoster = (title, c1, c2) => (x, w, h) => { const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, c1); g.addColorStop(1, c2); x.fillStyle = g; x.fillRect(0, 0, w, h); x.fillStyle = '#fff'; x.font = 'bold 34px Cinzel, serif'; x.textAlign = 'center'; x.fillText(title, w / 2, h * 0.55); for (let i = 0; i < 30; i++) { x.fillStyle = 'rgba(255,255,255,.6)'; x.fillRect(rnd(w), rnd(h), 2, 2); } };


  /* =========================================================
     FIRST-PERSON PLAYER
     ========================================================= */
  const K = {}; const input = { mx: 0, my: 0, look: { dx: 0, dy: 0 }, run: false, crouch: false };
  function initPlayer() { G.P = { pos: new V3(G.spawn.x, 0, G.spawn.z), yaw: G.spawn.yaw, pitch: -0.05, eye: 1.6, speed: 0, bob: 0, stepT: 0, held: null, heldMesh: null, frozen: false, crouch: false }; }
  const controlsActive = () => G.mode === 'play' && !modalOpen() && !G.P.frozen;
  function lookDir() { const p = G.P, c = Math.cos(p.pitch); return new V3(-Math.sin(p.yaw) * c, Math.sin(p.pitch), -Math.cos(p.yaw) * c); }
  function updatePlayer(dt) {
    const P = G.P;
    P.yaw -= input.look.dx; P.pitch = clamp(P.pitch - input.look.dy, -1.35, 1.35); input.look.dx = input.look.dy = 0;
    let ix = 0, iy = 0;
    if (controlsActive()) { if (K['w'] || K['arrowup']) ix += 1; if (K['s'] || K['arrowdown']) ix -= 1; if (K['d'] || K['arrowright']) iy += 1; if (K['a'] || K['arrowleft']) iy -= 1; ix += input.my; iy += input.mx; }
    const len = Math.hypot(ix, iy); if (len > 1) { ix /= len; iy /= len; }
    P.crouch = (K['c'] || K['control'] || input.crouch) && controlsActive();
    const running = (K['shift'] || input.run) && !P.crouch;
    const target = (P.crouch ? 1.6 : running ? 5.2 : 3.0) * Math.min(1, Math.hypot(ix, iy));
    P.speed = lerp(P.speed, target, Math.min(1, dt * 10)); P.running = running && P.speed > 3.5;
    const fw = new V3(-Math.sin(P.yaw), 0, -Math.cos(P.yaw)), rt = new V3(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
    const dir = fw.multiplyScalar(ix).add(rt.multiplyScalar(iy)); if (dir.lengthSq() > 1e-4) { dir.normalize(); P.dir = dir; }
    if (P.dir) P.pos.addScaledVector(P.dir, P.speed * dt);
    collide(P.pos, 0.28, 0, P.crouch ? 1.1 : 1.75);
    if (G.dungeon && G.dungeon.clampPlayer) G.dungeon.clampPlayer(P.pos);
    P.eye = lerp(P.eye, P.crouch ? 1.05 : 1.6, Math.min(1, dt * 8));
    const moving = P.speed > 0.3;
    if (moving) { P.bob += dt * P.speed * 2.6; P.stepT += dt * P.speed; if (P.stepT > (P.crouch ? 1.4 : 1.9)) { P.stepT = 0; sfx.step(P.crouch ? 0.35 : P.running ? 1.4 : 0.8, 'wood'); } }
    else P.bob *= 0.9;
  }
  function updateCamera(dt) {
    const P = G.P, cam = G.cam;
    if (G.mode === 'title') { const a = G.t * 0.12; cam.position.set(-11 + Math.sin(a) * 1.5, 2.3, Math.cos(a) * 1.2); cam.rotation.order = 'XYZ'; cam.lookAt(6, 1.8, Math.sin(a * 0.7) * 2); return; }
    if (G.camOverride) { G.camOverride(dt); return; }
    const bob = Math.sin(P.bob) * 0.035 * Math.min(1, P.speed / 3), side = Math.cos(P.bob * 0.5) * 0.02 * Math.min(1, P.speed / 3);
    cam.position.set(P.pos.x + side * Math.cos(P.yaw), P.eye + bob, P.pos.z - side * Math.sin(P.yaw));
    cam.rotation.set(0, 0, 0); cam.rotation.order = 'YXZ'; cam.rotation.y = P.yaw; cam.rotation.x = P.pitch;
    if (G.shake > 0) { cam.position.x += (Math.random() - .5) * G.shake; cam.position.y += (Math.random() - .5) * G.shake; G.shake = Math.max(0, G.shake - dt * 1.6); }
    if (G.lanternMesh) { G.lanternMesh.position.set(0.32 + Math.sin(P.bob * 0.5) * 0.012, -0.34 + Math.abs(Math.sin(P.bob)) * 0.015, -0.62); G.lanternMesh.rotation.z = Math.sin(P.bob * 0.5) * 0.06; G.lanternMesh.visible = G.mode === 'play'; } if (G.lanternLight) G.lanternLight.intensity = G.lanternOn && G.mode === 'play' ? 0.9 + Math.sin(G.t * 9) * 0.06 : 0;
  }
  /* ---------- held item (first-person) ---------- */
  function holdItem(id) {
    const P = G.P; if (P.heldMesh) { G.cam.remove(P.heldMesh); P.heldMesh = null; }
    P.held = id || null; if (!id) return;
    const m = null; if (!m) return;
    m.scale.multiplyScalar(0.8); m.rotation.y = -0.5; m.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.depthTest = true; } });
    G.cam.add(m); P.heldMesh = m;
  }

  /* ---------- interaction (look-at + proximity) ---------- */
  let curInter = null;
  function updateInteract() {
    if (G.mode !== 'play' || modalOpen()) { ui.prompt.hidden = true; curInter = null; return; }
    const p = G.P.pos, ld = lookDir(); ld.y = 0; ld.normalize();
    const list = G.dungeon ? G.dungeon.inter : [];
    let best = null, bs = -1;
    for (const it of list) {
      if (it.enabled && !it.enabled()) continue;
      const dx = it.pos.x - p.x, dz = it.pos.z - p.z, d = Math.hypot(dx, dz); if (d > it.r) continue;
      const facing = d < 0.35 ? 1 : (dx * ld.x + dz * ld.z) / d; if (facing < 0.35) continue;
      const score = facing * 2 - d / it.r; if (score > bs) { bs = score; best = it; }
    }
    if (best !== curInter || (best && G.t - (best._lt || 0) > 0.5)) {
      curInter = best; if (best) best._lt = G.t;
      if (best) { ui.prompt.innerHTML = `<kbd>${TOUCH ? '✋' : 'E'}</kbd>${typeof best.label === 'function' ? best.label() : best.label}`; ui.prompt.hidden = false; }
      else ui.prompt.hidden = true;
    }
  }
  function doInteract() { if (curInter && controlsActive()) { const it = curInter; curInter = null; ui.prompt.hidden = true; sfx.click(); it.act(); } }

  /* ---------- input ---------- */
  function bindInput() {
    const c = $('#stage');
    addEventListener('keydown', e => {
      const k = e.key.toLowerCase(); K[k] = true; if (k === ' ' || k.startsWith('arrow') || k === 'tab') e.preventDefault();
      ac();
      if (k === 'escape') { if (G.mode === 'play' && !modalOpen()) openPause(); return; }
      if (G.mode !== 'play' || modalOpen()) return;
      if (k === 'e' || k === 'enter') doInteract();
      if (k === 'f') toggleFlash();
      if (k === 'q') usePotion();
      if (G.zone === 'dungeon' && run && run.boss && run.boss.answered === null && ['1', '2', '3', '4'].includes(k)) bossAnswer(+k - 1);
      if (exam && /^[1-8]$/.test(k)) { if (exam.answered === null) examAnswer(+k - 1); }
      if (exam && exam.answered !== null && (k === 'n' || k === ' ')) examNext();
    });
    addEventListener('keyup', e => { K[e.key.toLowerCase()] = false; });
    addEventListener('blur', () => { for (const k in K) K[k] = false; });
    c.addEventListener('click', () => { ac(); if (TOUCH || G.mode !== 'play' || modalOpen()) return; if (document.pointerLockElement !== c) { try { c.requestPointerLock(); } catch (e) { } } else doInteract(); });
    let drag = null;
    c.addEventListener('mousedown', e => { if (!document.pointerLockElement) drag = { x: e.clientX, y: e.clientY }; });
    addEventListener('mouseup', () => drag = null);
    addEventListener('mousemove', e => {
      const s = 0.0022 * save.set.sens, inv = save.set.invert ? -1 : 1;
      if (document.pointerLockElement === c) { input.look.dx += e.movementX * s; input.look.dy += e.movementY * s * inv; }
      else if (drag && G.mode === 'play' && !TOUCH) { input.look.dx += (e.clientX - drag.x) * s; input.look.dy += (e.clientY - drag.y) * s * inv; drag = { x: e.clientX, y: e.clientY }; }
    });
    ui.prompt.addEventListener('click', doInteract);
    if (TOUCH) bindTouch();
  }
  function bindTouch() {
    ui.touch.hidden = false;
    ui.touch.innerHTML = `<div class="look" id="tlook"></div><div class="stick" id="tstick"><div class="knob" id="tknob"></div></div>
      <div class="btns"><button id="tb-menu" aria-label="القائمة">☰</button><button id="tb-flash" aria-label="فانوس" class="on">🏮</button><button id="tb-pot" aria-label="جرعة">🧪</button>
      <button id="tb-crouch" aria-label="انحناء">🧎</button><button id="tb-run" aria-label="ركض">🏃</button><button id="tb-act" class="big" aria-label="تفاعل">✋</button></div>`;
    const st = $('#tstick'), kn = $('#tknob'); let sid = null, sc = null;
    st.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sid = t.identifier; const r = st.getBoundingClientRect(); sc = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; e.preventDefault(); ac(); }, { passive: false });
    const moveStick = e => { for (const t of e.changedTouches) if (t.identifier === sid) { let dx = t.clientX - sc.x, dy = t.clientY - sc.y; const l = Math.hypot(dx, dy), m = 46; if (l > m) { dx *= m / l; dy *= m / l; } kn.style.transform = `translate(${dx}px,${dy}px)`; input.mx = dx / m; input.my = -dy / m; } e.preventDefault(); };
    const endStick = e => { for (const t of e.changedTouches) if (t.identifier === sid) { sid = null; kn.style.transform = ''; input.mx = input.my = 0; } };
    st.addEventListener('touchmove', moveStick, { passive: false }); st.addEventListener('touchend', endStick); st.addEventListener('touchcancel', endStick);
    const lk = $('#tlook'); const lt = {};
    lk.addEventListener('touchstart', e => { for (const t of e.changedTouches) lt[t.identifier] = { x: t.clientX, y: t.clientY }; e.preventDefault(); }, { passive: false });
    lk.addEventListener('touchmove', e => { const s = 0.0048 * save.set.sens, inv = save.set.invert ? -1 : 1; for (const t of e.changedTouches) { const o = lt[t.identifier]; if (!o) continue; input.look.dx += (t.clientX - o.x) * s; input.look.dy += (t.clientY - o.y) * s * inv; lt[t.identifier] = { x: t.clientX, y: t.clientY }; } e.preventDefault(); }, { passive: false });
    lk.addEventListener('touchend', e => { for (const t of e.changedTouches) delete lt[t.identifier]; });
    const tap = (id, fn) => $(id).addEventListener('touchstart', e => { e.preventDefault(); ac(); fn(); }, { passive: false });
    tap('#tb-act', doInteract); tap('#tb-pot', usePotion); tap('#tb-flash', toggleFlash);
    tap('#tb-run', () => { input.run = !input.run; if (input.run) { input.crouch = false; $('#tb-crouch').classList.remove('on'); } $('#tb-run').classList.toggle('on', input.run); });
    tap('#tb-crouch', () => { input.crouch = !input.crouch; if (input.crouch) { input.run = false; $('#tb-run').classList.remove('on'); } $('#tb-crouch').classList.toggle('on', input.crouch); });
    tap('#tb-menu', () => { if (G.mode === 'play' && !modalOpen()) openPause(); });
  }
  function toggleFlash() { G.lanternOn = !G.lanternOn; sfx.click(); const b = $('#tb-flash'); if (b) b.classList.toggle('on', G.lanternOn); }
