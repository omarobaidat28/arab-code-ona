</head><body><title>قاعة الأبواب</title>

<style>
/* Layout: full-screen WebGL dungeon underneath; thin RPG HUD on top, narration banner below it, action dock at the bottom, modal sheets for scrolls/puzzles/menus.
   Single committed world: torch-lit stone at night, so one dark palette on purpose. */
:root{
  color-scheme: dark;
  --stone-0:#0b0a12; --stone-1:#17152a; --stone-2:#232039; --stone-3:#332e4c; --line:#4a4366;
  --ink:#efe8d8; --muted:#aaa3bf; --torch:#f2a73b; --torch-hi:#ffd27a; --arcane:#67d8c9; --blood:#e2493f; --leaf:#5fcf7a; --violet:#c062ff;
  --parch:#f0e2bf; --parch-2:#e3cf9f; --parch-ink:#3a2a17; --parch-accent:#8a3b12;
  --glass:rgba(15,13,26,.82);
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-scroll:'Aref Ruqaa','Reem Kufi',serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-latin:'Cinzel','Times New Roman',serif;
  --r:14px;
}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--stone-0);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--torch-hi);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.en{direction:ltr;unicode-bidi:isolate}
.latin{font-family:var(--f-latin);letter-spacing:.05em}
.muted{color:var(--muted)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
body.no3d #stage{display:none}
body.no3d{background:radial-gradient(900px 500px at 50% 0%,rgba(242,167,59,.15),transparent),var(--stone-0)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;border-radius:999px;padding:11px 20px;font-weight:700;font-family:var(--f-display);font-size:16px;
  background:linear-gradient(180deg,var(--torch-hi),var(--torch));color:#2b1606;box-shadow:0 5px 0 #9a5a12,0 10px 24px rgba(242,167,59,.25);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a5a12}
.btn.ghost{background:var(--stone-2);color:var(--ink);box-shadow:0 4px 0 #07060c;border:1px solid var(--line)}
.btn.arcane{background:linear-gradient(180deg,#9af0e4,var(--arcane));color:#0b2a27;box-shadow:0 5px 0 #2b8c80}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center;text-align:center}
.mt{margin-top:14px}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(8,7,14,.92),rgba(8,7,14,.55) 70%,transparent);pointer-events:none}
.hud-in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:auto}
.portrait{flex:0 0 auto;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 40% 30%,#3e3660,#16142a);border:2px solid var(--torch);position:relative}
.portrait .lv{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--torch);color:#2b1606;font:700 11px var(--f-latin);padding:1px 6px;border-radius:99px;white-space:nowrap}
.bars{flex:1 1 200px;min-width:0;display:grid;gap:5px}
.bars .lec{font-family:var(--f-display);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:12px;border-radius:99px;background:#07060c;border:1px solid var(--line);overflow:hidden}
.bar>i{position:absolute;top:0;bottom:0;right:0;width:100%;background:linear-gradient(270deg,#b4231b,var(--blood));transition:width .45s;border-radius:99px}
.bar.xp{height:7px}.bar.xp>i{background:linear-gradient(270deg,#2b8c80,var(--arcane))}
.bar.boss>i{background:linear-gradient(270deg,#6b2bb0,var(--violet))}
.bar>b{position:absolute;inset:0;font:600 10px/12px var(--f-body);text-align:center;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--stone-2);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
button.chip{cursor:pointer}
.steps{display:flex;gap:3px;width:100%}
.steps i{flex:1 1 8px;height:4px;border-radius:9px;background:var(--stone-3)}
.steps i.done{background:var(--torch)}.steps i.cur{background:var(--torch-hi);box-shadow:0 0 8px var(--torch-hi)}
.steps i.boss{background:#5a2a7a}.steps i.boss.cur{background:var(--violet);box-shadow:0 0 8px var(--violet)}

/* ---------- Banner (narration + question) ---------- */
.banner{position:fixed;z-index:15;left:0;right:0;top:calc(max(var(--hudh,0px), env(safe-area-inset-top,0px)) + 6px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.banner-in{max-width:780px;margin:0 auto;display:grid;gap:8px;pointer-events:auto}
.gm{display:flex;gap:10px;align-items:flex-start}
.gm .face{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:radial-gradient(circle at 40% 35%,#3e3660,#1c1a2b);border:2px solid var(--torch)}
.gm .say{background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 12px;min-width:0;flex:1;font-size:15px}
.gm .say b.who{display:block;font-family:var(--f-display);color:var(--torch-hi);font-size:12px}
.qcard{direction:ltr;text-align:left;background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--torch);border-radius:var(--r);padding:12px 16px;font-size:17px;font-weight:600;position:relative;box-shadow:0 0 24px rgba(242,167,59,.15)}
.qcard .rune{position:absolute;top:-11px;right:14px;font-size:12px;background:var(--torch);color:#2b1606;padding:1px 10px;border-radius:99px;font-family:var(--f-display);direction:rtl}
.legend{display:none;gap:6px;grid-template-columns:1fr}
.legend button{direction:ltr;text-align:left;display:flex;gap:8px;align-items:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;line-height:1.35;cursor:pointer}
.legend button b{font-family:var(--f-latin);color:var(--torch-hi);flex:0 0 26px}
.legend button.burned{opacity:.4;text-decoration:line-through;cursor:not-allowed}
@media (max-width:760px){.legend{display:grid}}
body.no3d .legend{display:grid}
.peek{direction:ltr;text-align:center;font-size:14px;color:var(--torch-hi);min-height:0}

/* ---------- Dock (bottom actions / boss) ---------- */
.dock{position:fixed;z-index:16;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.dock-in{max-width:860px;margin:0 auto;pointer-events:auto;max-height:58vh;overflow:auto;border-radius:16px}
.panel{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel.good{border-color:rgba(95,207,122,.7);box-shadow:0 0 30px rgba(95,207,122,.15)}
.panel.bad{border-color:rgba(226,73,63,.7);box-shadow:0 0 30px rgba(226,73,63,.15)}
.panel.boss{border-color:#6b3d93}
.panel h3{font-size:18px;margin-bottom:4px}
.ans{direction:ltr;text-align:left;font-weight:600;color:var(--leaf)}
.hint{font-size:13px;color:var(--muted)}
.diff{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;font-family:var(--f-display)}
.diff.d1{background:#1f4a2b;color:#9ef0b0}.diff.d2{background:#4a3a14;color:#ffd77a}.diff.d3{background:#4a1616;color:#ff9a8f}
.vs{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:13px;margin-bottom:10px}
.bq{direction:ltr;text-align:left;font-size:16px;font-weight:600;margin:6px 0 10px}
.opts{direction:ltr;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{direction:ltr;text-align:left;border:1px solid #5b3a80;background:linear-gradient(180deg,#2a1d40,#1d142d);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.opt:hover:not([disabled]){background:#33244f}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;display:grid;place-items:center;background:#120c1d;color:#e3b8ff;font-family:var(--f-latin);font-weight:800;font-size:13px}
.opt.ok{border-color:var(--leaf);background:rgba(95,207,122,.2)}
.opt.no{border-color:var(--blood);background:rgba(226,73,63,.22)}
.opt[disabled]{cursor:default}
@media (max-width:560px){.opts{grid-template-columns:1fr}}

/* ---------- Modal sheet ---------- */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));background:rgba(5,4,10,.55);animation:fadein .25s}
.modal.clear{background:linear-gradient(180deg,rgba(5,4,10,.15),rgba(5,4,10,.55))}
@keyframes fadein{from{opacity:0}}
.sheet{width:min(900px,100%);max-height:100%;overflow:auto;border-radius:18px;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.modal.clear .sheet.title{align-self:flex-end;background:rgba(15,13,26,.78)}
.sheet.menu{background:rgba(15,13,26,.86);backdrop-filter:blur(8px);border:1px solid var(--line);padding:22px clamp(14px,3vw,30px)}

/* scroll (parchment) */
.scroll{position:relative;color:var(--parch-ink);background:radial-gradient(120% 80% at 50% 0%,var(--parch),var(--parch-2));border-radius:6px;padding:26px clamp(16px,4vw,40px) 22px;margin:10px 8px;box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 60px rgba(120,80,20,.25)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-8px;right:-8px;height:16px;border-radius:12px;background:linear-gradient(180deg,#8a5a2e,#5b3a1c 60%,#3e2412);box-shadow:0 4px 8px rgba(0,0,0,.4)}
.scroll::before{top:-8px}.scroll::after{bottom:-8px}
.scroll .kicker{font-size:12px;letter-spacing:.12em;color:var(--parch-accent);font-weight:700}
.scroll h2{font-family:var(--f-scroll);font-size:clamp(23px,4vw,31px);color:#4a1f08;margin:4px 0 10px}
.scroll h2 bdi{font-family:var(--f-body);font-weight:600;font-size:.7em;color:var(--parch-accent)}
.scroll p,.scroll li{max-width:72ch}
.scroll ul,.scroll ol{padding-inline-start:22px;margin:6px 0}
.scroll li{margin:4px 0}
.scroll b{color:#5a1e04}
.scroll em{font-style:normal;font-weight:600;color:#7a3a10;direction:ltr;unicode-bidi:isolate}
.scroll blockquote{margin:10px 0;padding:10px 16px;border-inline-start:4px solid var(--parch-accent);background:rgba(138,59,18,.08);font-family:Georgia,serif;text-align:left}
.scroll .tip{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(58,42,23,.1);border:1px dashed rgba(138,59,18,.5);font-weight:600}
.scroll .tbl{overflow-x:auto}
.scroll table.cmp{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.scroll table.cmp th,.scroll table.cmp td{border:1px solid rgba(90,50,20,.3);padding:6px 8px;vertical-align:top}
.scroll table.cmp th{background:rgba(138,59,18,.12)}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:14px}
.swot>div{padding:8px 10px;border-radius:8px;background:rgba(138,59,18,.1)}
.swot b{font-family:var(--f-latin);font-size:20px;display:block}
@media (max-width:520px){.swot{grid-template-columns:1fr}}
.sheet-actions{position:sticky;bottom:0;padding:12px 0 4px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,transparent,rgba(5,4,10,.85) 40%)}

/* puzzles */
.puzzle{background:linear-gradient(180deg,#1d2a33,#111a21);border:1px solid #2f5157;border-radius:18px;padding:18px;box-shadow:inset 0 0 50px rgba(103,216,201,.06)}
.puzzle h2{color:var(--arcane);font-size:23px}
.puzzle .lock{font-size:34px;float:left;margin:0 0 0 10px;filter:drop-shadow(0 0 10px rgba(103,216,201,.5))}
.rune-btn{direction:ltr;border:1px solid #3c6b70;background:#162229;border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left;font-size:15px;line-height:1.4;width:100%}
.rune-btn:hover:not([disabled]){background:#1d3038}
.rune-btn.sel{background:#245058;border-color:var(--arcane);box-shadow:0 0 0 2px var(--arcane)}
.rune-btn.ok{background:rgba(95,207,122,.18);border-color:var(--leaf);cursor:default}
.rune-btn.no{background:rgba(226,73,63,.2);border-color:var(--blood)}
.rune-btn .tag{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;margin-right:6px;font-size:12px;font-weight:700;background:#0b1418}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;margin-top:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match .col h4{margin:0;font-size:13px;color:var(--muted);font-family:var(--f-display)}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.slots{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.slot{display:flex;gap:10px;align-items:center;min-height:44px;border:1px dashed #3c6b70;border-radius:12px;padding:5px 10px}
.slot .n{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#0b1418;color:var(--arcane);font-weight:700;font-family:var(--f-latin)}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.sortcur{text-align:center;margin:12px 0}
.sortcur .card{display:inline-block;direction:ltr;max-width:100%;padding:12px 20px;border-radius:14px;background:linear-gradient(180deg,#2a4a50,#183238);border:2px solid var(--arcane);font-size:18px;font-weight:700;box-shadow:0 0 24px rgba(103,216,201,.25)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin{border:1px solid #3c6b70;background:#132028;border-radius:14px;padding:12px;cursor:pointer;text-align:center;min-height:80px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center}
.bin:hover{background:#1a2c34}
.bin b{direction:ltr;font-size:15px}
.bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bin .got i{width:9px;height:9px;border-radius:50%;background:var(--leaf)}
.bin.no{border-color:var(--blood);background:rgba(226,73,63,.2)}
.pmeta{color:var(--muted);font-size:13px;margin-top:8px}
.reward{margin-top:14px;padding:14px;border-radius:14px;border:1px solid rgba(95,207,122,.6);background:rgba(95,207,122,.1)}

/* title & map */
.title-card{text-align:center}
.title-card h1{font-size:clamp(42px,9vw,78px);font-family:var(--f-scroll);color:var(--torch-hi);text-shadow:0 0 30px rgba(242,167,59,.4),0 4px 0 #5a2e08;margin:2px 0}
.title-card .tsub{color:var(--muted);max-width:58ch;margin:0 auto 18px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:20px 0 4px;text-align:start}
.rules>div{background:rgba(23,21,42,.85);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:14px}
.rules b{font-family:var(--f-display);color:var(--torch-hi);display:block;margin-bottom:2px}
.controls{font-size:13px;color:var(--muted);margin-top:10px}
.controls kbd{font-family:var(--f-latin);background:var(--stone-3);border-radius:5px;padding:0 6px;border:1px solid var(--line)}
.realm{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.realm h2{font-family:var(--f-scroll);font-size:26px;color:var(--torch-hi)}
.realm small{color:var(--muted)}
.path{display:grid;gap:10px}
.node{display:flex;gap:12px;align-items:center;text-align:start;width:100%;border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:rgba(23,21,42,.9);cursor:pointer}
.node .ico{flex:0 0 50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--stone-2);border:2px solid var(--line)}
.node .txt{flex:1;min-width:0}
.node .txt b{display:block;font-family:var(--f-display);font-size:17px}
.node .txt .latin{font-size:12px;color:var(--muted)}
.node .stars{font-size:17px;letter-spacing:2px;white-space:nowrap}
.node.cur{border-color:var(--torch);box-shadow:0 0 0 1px var(--torch),0 0 26px rgba(242,167,59,.25)}
.node.cur .ico{border-color:var(--torch)}
.node.done .ico{border-color:var(--leaf)}
.node.locked{opacity:.5;cursor:not-allowed}
.big{font-size:70px;line-height:1.1}
.overlay h1{font-family:var(--f-scroll);font-size:clamp(36px,8vw,58px);color:var(--torch-hi)}

/* misc */
.fade{position:fixed;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none;transition:opacity .42s}
.fade.on{opacity:1}
.float{position:fixed;z-index:50;font-family:var(--f-display);font-weight:700;font-size:24px;pointer-events:none;animation:floatup 1.2s ease-out forwards;text-shadow:0 2px 6px #000;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes floatup{to{margin-top:-70px;opacity:0}}
.toast{position:fixed;z-index:55;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-scroll);font-size:clamp(34px,7vw,60px);color:var(--torch-hi);text-shadow:0 0 30px rgba(242,167,59,.7),0 4px 0 #5a2e08;pointer-events:none;animation:toast 2s ease-out forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(226,73,63,.55);opacity:0}
.flash.on{animation:fl .5s}
@keyframes fl{30%{opacity:1}100%{opacity:0}}
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:70;background:var(--stone-0);font-family:var(--f-display);color:var(--torch-hi);font-size:20px}

/* ---------- open-world additions ---------- */
#stage{cursor:default}

  S('roar', t => { const C = AU.ctx, o = C.createOscillator(), o2 = C.createOscillator(), f = C.createBiquadFilter(), g = C.createGain(); o.type = o2.type = 'sawtooth'; o.frequency.setValueAtTime(90, t); o.frequency.linearRampToValueAtTime(55, t + 0.9); o2.frequency.setValueAtTime(93, t); o2.frequency.linearRampToValueAtTime(52, t + 0.9); f.type = 'lowpass'; f.frequency.setValueAtTime(1200, t); f.frequency.linearRampToValueAtTime(300, t + 0.9); env(g, t, 0.08, 0.12, 0.9); o.connect(f); o2.connect(f); f.connect(g).connect(AU.sfx); g.connect(AU.verb); o.start(t); o2.start(t); o.stop(t + 1.1); o2.stop(t + 1.1); noiseHit(t, 0.9, 0.06, 'bandpass', 500, 0.7); });
  S('level', t => { [392, 523, 659, 784, 1046, 1318].forEach((f, i) => { osc('triangle', f, t + i * 0.08, 0.35, 0.07); osc('sine', f / 2, t + i * 0.08, 0.35, 0.03); }); });
  S('scare', t => { osc('sawtooth', 70, t, 0.6, 0.12, null, 40); osc('square', 1400, t, 0.4, 0.05, null, 300); noiseHit(t, 0.6, 0.15, 'bandpass', 1500, 0.5); });
  S('caught', t => { osc('square', 660, t, 0.12, 0.06); osc('square', 440, t + 0.14, 0.25, 0.06); });
  S('alert', t => { osc('triangle', 1200, t, 0.08, 0.05); osc('triangle', 1600, t + 0.09, 0.12, 0.05); });
  S('tick', t => noiseHit(t, 0.02, 0.025, 'highpass', 4000));
  S('drip', t => { osc('sine', 1800 + Math.random() * 600, t, 0.12, 0.03, null, 600); });
  S('talk', (t, pitch = 1) => { for (let i = 0; i < 4; i++) osc('triangle', (220 + Math.random() * 160) * pitch, t + i * 0.06, 0.05, 0.025); });
  S('zap', t => { noiseHit(t, 0.18, 0.1, 'highpass', 2000); osc('square', 900, t, 0.15, 0.04, null, 200); });
  // ambience: 'house' (warm pad + crickets), 'dungeon' (drone + drips), 'boss' (drums), null
  let ambTimer = 0;
  function setAmbience(kind) {
    if (!ac() || AU.curAmb === kind) return; AU.curAmb = kind;
    if (AU.ambNodes) { const old = AU.ambNodes; old.g.gain.setTargetAtTime(0.0001, AU.ctx.currentTime, 0.4); setTimeout(() => old.stop.forEach(s => { try { s.stop(); } catch (e) { } }), 1500); AU.ambNodes = null; }
    if (!kind) return;
    const C = AU.ctx, t = C.currentTime, g = C.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 1.5); g.connect(AU.music); const stop = [];
    const pad = (freqs, vol, type = 'sine', cutoff = 900) => { const f = C.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; f.connect(g); freqs.forEach((fr, i) => { const o = C.createOscillator(), og = C.createGain(); o.type = type; o.frequency.value = fr; o.detune.value = (i % 2 ? 6 : -6); og.gain.value = vol; const lfo = C.createOscillator(), lg = C.createGain(); lfo.frequency.value = 0.07 + i * 0.03; lg.gain.value = vol * 0.6; lfo.connect(lg).connect(og.gain); o.connect(og).connect(f); o.start(); lfo.start(); stop.push(o, lfo); }); };
    if (kind === 'house') pad([130.8, 196, 246.9, 329.6], 0.05, 'triangle', 700);
    if (kind === 'dungeon') { pad([55, 82.4, 110.5], 0.07, 'sawtooth', 260); }
    if (kind === 'boss') { pad([55, 58.3], 0.08, 'sawtooth', 400); }
    AU.ambNodes = { g, stop, kind };
  }
  function ambienceTick(dt) {
    if (!AU.ctx || !save.sound) return; ambTimer -= dt; if (ambTimer > 0) return;
    const k = AU.curAmb;
    if (k === 'house') { ambTimer = 0.18 + Math.random() * 0.25; if (Math.random() < 0.5) { const t = AU.ctx.currentTime; osc('sine', 4200 + Math.random() * 300, t, 0.03, 0.006); osc('sine', 4300, t + 0.05, 0.03, 0.006); } }
    else if (k === 'dungeon') { ambTimer = 1.5 + Math.random() * 3; sfx.drip(); }
    else if (k === 'boss') { ambTimer = 0.5; const t = AU.ctx.currentTime; osc('sine', 70, t, 0.3, 0.14, AU.music, 35); noiseHit(t + 0.25, 0.08, 0.05, 'highpass', 5000, 1, AU.music); }
    else ambTimer = 1;
  }

  /* ---------------- UI layers ---------------- */
  const ui = { hud: $('#hud'), boss: $('#bossbar'), sub: $('#sub'), toast: $('#qtoast'), qcard: $('#qcard'), dock: $('#dock'), modal: $('#modal'), sheet: $('#sheet'), fade: $('#fade'), flash: $('#flash'), prompt: $('#prompt'), obj: $('#objective'), cross: $('#cross'), touch: $('#touch'), eye: $('#eye') };
  let subTimer = 0;
  function say(who, text, face = '🧙', ms) {
    clearTimeout(subTimer); if (!text) { ui.sub.hidden = true; return; }
    ui.sub.innerHTML = `<span class="face">${face}</span><div><b class="who">${esc(who)}</b><span>${text}</span></div>`; ui.sub.hidden = false;
    const dur = ms || clamp(text.replace(/<[^>]+>/g, '').length * 70, 2600, 9000); subTimer = setTimeout(() => ui.sub.hidden = true, dur);
  }
  let toastTimer = 0;
  function qToast(html, kind = 'good', ms = 3200) { clearTimeout(toastTimer); ui.toast.className = 'qtoast ' + kind; ui.toast.innerHTML = html; ui.toast.hidden = false; toastTimer = setTimeout(() => ui.toast.hidden = true, ms); }
  function setQCard(html) { ui.qcard.innerHTML = html || ''; ui.qcard.hidden = !html; }
  function setDock(html) { ui.dock.innerHTML = html ? `<div class="dock-in">${html}</div>` : ''; ui.dock.hidden = !html; }
  function openModal(html, cls = '', clear = false) {
    ui.sheet.className = 'sheet ' + cls; ui.sheet.innerHTML = html; ui.modal.hidden = false; ui.modal.classList.toggle('clear', clear); ui.sheet.scrollTop = 0;
    if (document.pointerLockElement) document.exitPointerLock();
  }
  function closeModal() { ui.modal.hidden = true; ui.sheet.innerHTML = ''; }
  const modalOpen = () => !ui.modal.hidden;
  function fadeTo(cb, hold = 0) { ui.fade.classList.add('on'); setTimeout(() => { cb(); setTimeout(() => ui.fade.classList.remove('on'), 160 + hold); }, 460); }
  function flashRed() { ui.flash.classList.remove('on'); void ui.flash.offsetWidth; ui.flash.classList.add('on'); }
  function toast(txt) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = txt; document.body.appendChild(d); setTimeout(() => d.remove(), 2100); }
  function floatScreen(txt, color, x, y) { const d = document.createElement('div'); d.className = 'float'; d.textContent = txt; d.style.color = color; d.style.left = (x ?? innerWidth / 2) + 'px'; d.style.top = (y ?? innerHeight * 0.42) + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 1300); }
/* English overlay for lecture content (applied when the player picks English) */
const LECT_EN = {"c1l1.ar":"Life Skills","c1l1.realm":"Hall of Beginnings","c1l1.boss.name":"Warden of Forgotten Skills","c1l1.boss.lore":"A giant stone statue just woken from its long slumber. It guards the gate of Chapter One and lets no one pass unless they have mastered what a skill is, its types, the definitions of life skills, their importance and the traits of life-skilled people.","c1l1.steps.0.body":"<p>A <em>Skill</em> is the <b>learned</b> (through practice, training and experience) or <b>innate</b> ability to perform a specific task or activity <b>well</b>.</p> <p>Skills fall into two main types:</p> <ul><li><em>Hard Skills</em>: <b>technical</b>, job-specific abilities such as <em>coding</em>, <em>carpentry</em> and <em>operating machinery</em>.</li> <li><em>Soft Skills</em> (also called <em>life</em> or <em>people skills</em>): <b>interpersonal, general</b> traits such as <em>communication</em>, <em>leadership</em> and <em>problem-solving</em>.</li></ul>","c1l1.steps.0.tip":"Memory hook: Hard = hands & machines 🔧 | Soft = mind & people 🤝","c1l1.steps.0.qs.0.e":"A skill is either learned (through practice, training and experience) or innate.","c1l1.steps.0.qs.1.e":"Hard skills are technical and job-specific: coding, carpentry, operating machinery.","c1l1.steps.0.qs.2.e":"Soft skills are interpersonal and general: communication, leadership, problem-solving.","c1l1.steps.1.body":"<p>According to <em>WHO (2003)</em>, life skills are</p> <blockquote>“abilities for <b>adaptive and positive</b> behavior that enable individuals to deal effectively with the <b>demands and challenges of everyday life</b>.”</blockquote> <p>More specifically, they are <em>psychosocial competencies</em> and <em>interpersonal skills</em> that help people make informed decisions, solve problems, think critically and creatively, communicate effectively, build healthy relationships, empathize with others, and manage their lives in a healthy and productive manner.</p>","c1l1.steps.1.tip":"The two key words in the WHO definition: adaptive + positive ✨","c1l1.steps.1.qs.0.e":"WHO definition: abilities for adaptive and positive behavior.","c1l1.steps.1.qs.2.e":"This is the World Health Organization (WHO) definition from 2003.","c1l1.steps.2.body":"<p>According to <em>WHO</em> and <em>UNICEF</em> guidelines, core life skills fall into <b>3 categories</b>:</p> <ol><li><b><em>Cognitive & Thinking Skills</em></b> (mental processes for analysing situations): <ul><li><em>Critical Thinking</em>: evaluating arguments and data objectively before judging. Example: questioning the credibility of a headline about a new medical treatment and researching it.</li> <li><em>Decision-Making & Problem-Solving</em>: identifying the problem, generating alternatives and taking decisive action. Example: changing your budget or picking up an extra shift when unexpected household repairs arise.</li></ul></li> <li><b><em>Personal & Emotional Skills</em></b> (self-awareness and regulating emotions): <ul><li><em>Coping with Stress & Emotions</em>. Example: deep breathing or going for a walk when a deadline overwhelms you.</li> <li><em>Self-Awareness</em>: understanding your personality, strengths, weaknesses and values. Example: realising you are taking on too many responsibilities and knowing how to decline respectfully to avoid <em>burnout</em>.</li></ul></li> <li><b><em>Interpersonal & Social Skills</em></b> (interacting with others): <ul><li><em>Effective Communication</em>. Example: using <em>“I” statements</em> during a conflict.</li> <li><em>Empathy</em>: understanding and sharing others’ feelings. Example: supporting a struggling coworker even if they haven’t asked.</li></ul></li></ol>","c1l1.steps.2.tip":"Thinking 🧠 → Feelings ❤️ → People 🤝","c1l1.steps.2.qs.0.e":"Self-awareness and coping with stress = Personal & Emotional.","c1l1.steps.2.qs.1.e":"This is the lecture’s example of Effective Communication.","c1l1.steps.2.qs.2.e":"Objective evaluation before judging = Critical Thinking.","c1l1.steps.2.qs.3.e":"Understanding and sharing others’ feelings = Empathy.","c1l1.steps.2.qs.4.e":"The lecture’s example of Coping with Stress & Emotions.","c1l1.steps.3.title":"Puzzle of the Three Chests","c1l1.steps.3.intro":"Sort each rune into its correct category (WHO & UNICEF) to open the passage.","c1l1.steps.4.body":"<ul><li><b><em>UNESCO 2004</em></b>: life skills are <b>a mix of knowledge, behaviour, attitudes and values</b>, including critical thinking, creativity, organisation, social and communication skills, adaptability, problem-solving and democratic cooperation — needed for <b>shaping a peaceful future</b>.</li> <li><b><em>UNESCO UIS 2013</em></b>: the term is used in four ways: <ol><li><b>Generic</b> skills such as problem-solving, teamwork, networking, communication and negotiation (as important for life as literacy and numeracy).</li> <li>Skills tied to a specific context, called <b><em>contextual skills</em></b>: <em>livelihood</em>, health, gender and family, and environment.</li> <li>In the school context: <b>any subject other than language or mathematics</b>.</li> <li><em>Miscellaneous</em> skills such as cooking, making friends and crossing the street.</li></ol></li> <li><b><em>CALSCA 2010</em></b> (<em>Canadian Alliance of Life Skills Coaches and Associations</em>): <em>“problem solving behaviours appropriately and responsibly used in the management of personal affairs.”</em></li></ul>","c1l1.steps.4.tip":"UNESCO 2004 = a mix 🧪 | UIS 2013 = four uses 4️⃣ | CALSCA = managing personal affairs 🇨🇦","c1l1.steps.4.qs.1.e":"Skills tied to a specific context = contextual skills.","c1l1.steps.4.qs.3.e":"This is the CALSCA 2010 definition.","c1l1.steps.5.title":"Puzzle of the Definition Mirrors","c1l1.steps.5.intro":"Match each source with its correct definition.","c1l1.steps.6.body":"<p>Examples of <b>poor</b> soft skills: someone promises to email you and never does or apologises, a passenger talks loudly and steps on your toes, a friend who doesn’t listen, a colleague who is always pessimistic. Soft skills are also called <em>Life / People / Relationship skills</em>.</p> <p>🇮🇳 India’s employability crisis: <b>65%</b> of the population is 35 or younger and about <b>50%</b> of 1.25 billion are under 25, yet only <b>~7%</b> of graduates are <em>employable</em>. Who will succeed? Those with superb soft skills.</p> <p>Life skills matter in 4 areas:</p> <ul><li><em>Personal Development</em>: self-awareness, emotional regulation, resilience; managing time and stress and making informed decisions → mental well-being and confidence.</li> <li><em>Professional Growth</em>: communication, teamwork, adaptability, leadership — especially valued in <em>healthcare, education, customer service</em>.</li> <li><em>Social & Relationship Benefits</em>: empathy, active listening, conflict resolution; parents as role models for their children.</li> <li><em>Financial & Practical Applications</em>: budgeting, goal-setting, independence and independent living.</li></ul> <p>⭐ Bottom line: life-skills competencies are key for strengthening <b><em>employability and entrepreneurial capabilities</em></b>.</p>","c1l1.steps.6.tip":"Exam number: only 7% employable 🎯","c1l1.steps.6.qs.0.e":"Only about 7% of Indian graduates are employable.","c1l1.steps.6.qs.1.e":"Budgeting and financial goals = Financial & Practical.","c1l1.steps.6.qs.3.e":"The lecture mentioned healthcare, education and customer service.","c1l1.steps.7.title":"Puzzle of the Four Gates","c1l1.steps.7.intro":"Place each benefit in its correct area of importance.","c1l1.steps.8.title":"Traits of Life-Skilled People","c1l1.steps.8.body":"<p><b>Life-skilled people</b> have abilities that let them face life: they are characterised by <em>resilience, self-awareness, emotional intelligence and strong communication</em>, and they are adept at problem-solving, budgeting and goal-setting.</p> <ul><li><em>Resilience</em>: bouncing back from setbacks and keeping going when things get tough.</li> <li><em>Integrity</em>: doing the right thing <b>even when nobody is watching</b> → builds trust.</li> <li><em>Empathy</em>: understanding and sharing others’ feelings.</li> <li><em>Decisiveness</em>: making clear, confident decisions <b>without wavering</b>.</li> <li><em>Self-awareness</em> · <em>Effective communication</em> · <em>Adaptability</em> (adjusting to new situations) · <em>Problem-solving</em> · <em>Teamwork</em>.</li> <li><em>Self-discipline</em>: staying focused <b>and managing impulses</b>.</li> <li><em>Time management</em> · <em>Financial literacy</em> · <em>Self-esteem</em> (a positive view of oneself) · <em>Organisation</em> (keeping things in order physically and mentally).</li> <li>Practical skills: <em>Basic first aid, Home maintenance, Basic plumbing, DIY skills</em>.</li></ul>","c1l1.steps.8.tip":"Integrity = doing right in secret 👀","c1l1.steps.8.qs.0.e":"Integrity = doing the right thing even when nobody is watching.","c1l1.steps.8.qs.1.e":"Resilience = bouncing back from setbacks.","c1l1.steps.8.qs.2.e":"Decisiveness = clear decisions without wavering.","c1l1.steps.8.qs.3.e":"Self-discipline = staying focused and managing impulses.","c1l1.steps.9.title":"Puzzle of the Trait Seals","c1l1.steps.9.intro":"Match each trait with its meaning to break the seal.","c1l2.ar":"Entrepreneurship","c1l2.realm":"Market of Adventurers","c1l2.boss.name":"Dragon of Risk","c1l2.boss.lore":"A golden dragon sleeping on a hoard of lost opportunities. It knows every definition of entrepreneurship and every one of its disadvantages, and burns anyone who thinks an entrepreneur is just a gambler who loves money.","c1l2.steps.0.title":"The General Definition + Innovation and Change","c1l2.steps.0.body":"<p><em>Entrepreneurship</em> is the process of <b><em>identifying, creating, and exploiting opportunities</em></b> to build new ventures, commercialise innovations or generate value, while navigating <em>financial risk</em> and <em>market uncertainty</em>.</p> <p>Scholars group the definitions into 4 categories. Category one: <b><em>Innovation and Change</em></b></p> <ul><li><b><em>Joseph Schumpeter (1934)</em></b>: entrepreneurship is a force of <b><em>“creative destruction”</em></b>. Entrepreneurs are innovators who disrupt established ways by introducing new products, technologies or combinations of resources.</li> <li><b><em>Peter Drucker (1985)</em></b>: the <b>systematic</b> search for change, responding to it and exploiting it as an opportunity. He said: <em>“innovation is the specific tool of the entrepreneur.”</em></li></ul>","c1l2.steps.0.tip":"Schumpeter = creative destruction 💥 | Drucker = innovation is the tool 🛠️","c1l2.steps.0.qs.2.e":"General definition: identifying, creating, exploiting opportunities.","c1l2.steps.1.body":"<ul><li><b><em>Shane and Venkataraman (2000)</em></b> focused on opportunity: <em>“how, by whom, and with what effects opportunities to create future goods and services are discovered, evaluated and exploited.”</em><br>It is a 3-step cycle: <ol><li><em>Discovery</em>: finding the idea.</li><li><em>Evaluation</em>: deciding whether the idea will make a profit.</li><li><em>Exploitation</em>: building a venture around it.</li></ol></li> <li><b><em>Howard Stevenson (1983)</em></b>: <em>“the pursuit of opportunity <b>beyond the resources you currently control</b>”</em>, highlighting the ambitious nature of overcoming resource limits.</li></ul>","c1l2.steps.1.tip":"D → E → E : Discover, Evaluate, Exploit 🔍💰🏗️","c1l2.steps.1.qs.0.e":"Discovery, then Evaluation (will it profit?), then Exploitation.","c1l2.steps.1.qs.2.e":"They focused on opportunity = Opportunity Recognition.","c1l2.steps.2.title":"Puzzle of the Opportunity Cycle","c1l2.steps.2.intro":"Put Shane & Venkataraman’s three steps in the correct order to open the lock.","c1l2.steps.3.title":"Risk + Process and Organization","c1l2.steps.3.body":"<p>Category three: <b><em>Risk and Uncertainty</em></b></p> <ul><li><b><em>Frank Knight (1921)</em></b>: the ability to <b>bear uncertainty and risk</b> in an environment where outcomes cannot be predicted.</li> <li><b><em>Richard Cantillon (c. 1730)</em></b>: an early economic thinker; entrepreneurship is the risk of <b>buying at certain prices and selling at uncertain prices</b>. The entrepreneur is the one who bears risk and uncertainty for potential profit.</li></ul> <p>Category four: <b><em>Process and Organization</em></b></p> <ul><li><b><em>Robert Hisrich (1990)</em></b>: the process of <b>starting</b> a venture, <b>organising</b> social and economic resources, and assuming the risks and rewards.</li> <li><b><em>Howard Timmons (1994)</em></b>: building value <b><em>from practically nothing</em></b>, seizing opportunities regardless of the resources available.</li></ul>","c1l2.steps.3.tip":"Cantillon = buy certain, sell uncertain ⚖️ | Timmons = from nothing 🌱","c1l2.steps.3.qs.0.e":"Cantillon, around 1730.","c1l2.steps.4.title":"Puzzle of the Four Categories","c1l2.steps.4.intro":"Place each scholar in the category of his definition.","c1l2.steps.5.title":"Other Famous Definitions","c1l2.steps.5.body":"<ul><li><b><em>Jean-Baptiste Say</em></b> (French economist): the entrepreneur shifts resources <b>from lower to higher productivity</b>, highlighting the role of <em>organizer and planner</em>: <em>Resource Shifting</em> → <em>Higher Yield</em> → economic progress.</li> <li><b><em>SBA</em></b> (U.S. Small Business Administration): <em>“the process of creating and managing a business to achieve desired objectives.”</em> (the practical side: planning and management).</li> <li><b><em>Eric Ries</em></b> (<em>Lean Startup</em>): <em>“a human institution designed to create a new product or service under conditions of <b>extreme uncertainty</b>.”</em> (trial and error).</li> <li><b><em>Steve Blank</em></b> (customer-focused): <em>“the search for a <b>repeatable and scalable</b> business model.”</em></li> <li><b><em>Bill Gates</em></b>: <em>“taking an idea and bringing it to life in a way that changes people’s lives for the better.”</em></li> <li><b><em>Investopedia</em></b>: <em>“the process of setting up a business, taking on financial risks in the hope of profit.”</em></li></ul>","c1l2.steps.5.tip":"Ries = extreme uncertainty 🧪 | Blank = repeatable & scalable 🔁","c1l2.steps.5.qs.3.e":"The U.S. Small Business Administration definition.","c1l2.steps.6.title":"Puzzle of the Sages’ Voices","c1l2.steps.6.intro":"Match each author with their words.","c1l2.steps.7.title":"Importance of Entrepreneurship — 5 Points","c1l2.steps.7.body":"<p>New businesses create jobs, contribute to <em>GDP</em> and offer innovative products (e.g. Henry Ford, Thomas Edison, Bill Gates, Steve Jobs, Larry Page and Sergey Brin).</p> <ol><li><b><em>Economic growth and job creation</em></b>: direct and indirect jobs (suppliers, service providers). Small and medium enterprises (<em>SMEs</em>) are major contributors.</li> <li><b><em>Innovation and technological advancement</em></b>: smartphones and e-commerce began as entrepreneurial ventures; it drives competition.</li> <li><b><em>Improved standard of living</em></b>: easier, cheaper products such as <em>Uber</em>; better infrastructure, education and health.</li> <li><b><em>Economic diversification and resilience</em></b>: diverse industries (renewable energy, biotech, digital) → an economy less dependent on one industry and stronger against shocks.</li> <li><b><em>Empowerment and social change</em></b>: empowering marginalised groups, women-led businesses, social entrepreneurs and <em>microfinance</em>.</li></ol>","c1l2.steps.7.tip":"Growth, innovation, living standard, diversity, empowerment 🖐️","c1l2.steps.7.qs.0.e":"A diversified economy = less affected by shocks.","c1l2.steps.7.qs.1.e":"Empowering individuals and marginalised groups.","c1l2.steps.7.qs.2.e":"Uber = improved standard of living.","c1l2.steps.8.body":"<p><b>59%</b> of small-business owners say running a business is harder now than 5 years ago. Entrepreneurship is not for the faint-hearted.</p> <ol><li><em>Uncertainty of Income</em>: no guaranteed income; the owner is <b>the last to be paid</b>.</li> <li><em>Risk of Losing Your Entire Investment</em>: per the BLS, <b>34%</b> fail within 2 years, <b>51%</b> within 5 years and <b>66%</b> within 10 years.</li> <li><em>Long Hours and Hard Work</em>: an average of <b>51</b> hours a week vs <b>40.2</b> for employees; sometimes 60–80 hours. Only 49% planned a summer vacation (reason: “Too busy”).</li> <li><em>Lower Quality of Life Until the Business Gets Established</em>: <b>67%</b> make sacrifices (family and friends). Meg Hirshberg: family members are <b>the most important investors</b>. More than ¾ start between ages 20 and 44.</li> <li><em>High Levels of Stress</em>: sometimes because they don’t <em>delegate</em>.</li> <li><em>Complete Responsibility</em>: decisions on matters they don’t know well, and difficulty finding advisers.</li> <li><em>Discouragement</em>: obstacles that seem impossible; the cure is hard work and optimism.</li></ol> <p>Still, <b>83%</b> would choose entrepreneurship again and <b>63%</b> don’t plan to fully retire.</p>","c1l2.steps.8.tip":"Failure ladder: 34 → 51 → 66 📉","c1l2.steps.8.qs.0.e":"34% within 2 years, 51% within 5, 66% within 10.","c1l2.steps.8.qs.1.e":"51 hours vs 40.2.","c1l2.steps.8.qs.2.e":"The family sacrifices more than anyone.","c1l2.steps.8.qs.3.e":"The owner is the last to be paid.","c1l2.steps.9.title":"Characteristics of Entrepreneurs (1)","c1l2.steps.9.body":"<p>An entrepreneur is someone who creates a new business despite risk and uncertainty, aiming for profit and growth, by spotting opportunities and assembling resources.</p> <ol><li><em>Desire for responsibility</em>: a deep sense of personal responsibility; they like to control their resources.</li> <li><em>Preference for moderate risk</em>: not gamblers but <b><em>calculated risk takers</em></b>, even <em>risk eliminators</em>. Best tool: a <em>business plan</em>.</li> <li><em>Self-reliance</em>: they play many roles themselves because resources are limited.</li> <li><em>Confidence in their ability to succeed</em>: high optimism, which is why some succeed after repeated failure.</li> <li><em>Determination</em> (<b><em>“grit”</em></b>): intense focus on one long-term goal.</li> <li><em>Desire for immediate feedback</em>: they want to know how they are doing all the time.</li> <li><em>High level of energy</em>.</li> <li><em>Future orientation</em>: they look to tomorrow, not yesterday.</li> <li><em>Skill at organizing</em>: like assembling a giant puzzle. Eric Paley: <em>“Great entrepreneurship is in the execution.”</em></li> <li><em>Value of achievement over money</em>: money is just a way of <em>“keeping score”</em>. Schumpeter: <em>“the will to conquer…”</em></li></ol>","c1l2.steps.9.tip":"An entrepreneur doesn’t gamble… they calculate risk and eliminate it 🎯","c1l2.steps.9.qs.3.e":"Bringing together the right people for the task = Skill at organizing.","c1l2.steps.10.title":"Types of Entrepreneurs + More Characteristics","c1l2.steps.10.body":"<ul><li><b><em>Opportunity entrepreneurs</em></b>: start because they spotted a market opportunity (<b>59%</b> in the US). <b><em>Necessity entrepreneurs</em></b>: start because they couldn’t find other work.</li> <li><b><em>Serial entrepreneurs</em></b>: start ventures repeatedly. Most are <b><em>leapfroggers</em></b>: they start a company, run it until bored, sell it and start another. A few are <b><em>jugglers</em></b> (or <em>parallel entrepreneurs</em>): they run several companies <b>at the same time</b>.</li></ul> <p>More characteristics: <em>High degree of commitment</em> · <em>Tolerance for ambiguity</em> · <em>Creativity</em> · <em>Flexibility</em> (masters of improvisation) · <em>Resourceful</em> (e.g. <b><em>bootstrapping</em></b>: saving money, cutting costs and pouring every dollar into the business) · <em>Tenacity</em>.</p> <p><b><em>Cultural Diversity</em></b>: entrepreneurs <b>don’t come from one mould</b>; diversity is a central trait and they are <em>nonconformists</em>. Anyone, regardless of age, race or gender, can become an entrepreneur. <b>Entrepreneurship is not a genetic trait but a skill that can be learned</b> — a <em>practical discipline</em>.</p>","c1l2.steps.10.tip":"Leapfrogger = one after another 🐸 | Juggler = several at once 🤹","c1l2.steps.10.qs.0.e":"Jugglers = several companies at the same time.","c1l2.steps.10.qs.1.e":"Necessity = driven by need.","c1l2.steps.10.qs.2.e":"Not inherited — a skill that can be learned.","c1l2.steps.10.qs.3.e":"Bootstrapping belongs to the Resourceful trait.","c1l2.steps.11.title":"Puzzle of the Founders’ Masks","c1l2.steps.11.intro":"Match each entrepreneurial characteristic with its description.","c1l2.steps.12.title":"Case Studies — Famous Entrepreneurs","c1l2.steps.12.body":"<ul><li><b><em>Elon Musk</em></b>: Tesla (electric cars) and SpaceX (reusable rockets, the dream of Mars). His motto: <em>“Failure is an option here. If things are not failing, you are not innovating enough.”</em></li> <li><b><em>Jeff Bezos</em></b>: launched Amazon in <b>1994</b> to sell books online, then AWS and Alexa. Quote: <em>“We’re not competitor-obsessed, we’re customer-obsessed.”</em></li> <li><b><em>Bill Gates</em></b>: didn’t invent the personal computer but brought it into every home through Microsoft and Windows (<em>democratized technology</em>). A philanthropist through the <em>Gates Foundation</em>.</li> <li><b><em>Mark Zuckerberg</em></b>: founded Facebook from his Harvard dorm room, acquired WhatsApp and Instagram, now Meta. Philosophy: <em>“Move fast and break things.”</em></li></ul> <p>Behind every success: a brilliant idea, sleepless nights and repeated failure. The goal: <b>inspiration, not envy</b>.</p>","c1l2.steps.12.tip":"Musk = failure allowed 🚀 | Bezos = customer first 📦 | Zuck = move fast ⚡","c1l2.steps.12.qs.0.e":"Zuckerberg’s philosophy.","c1l2.steps.12.qs.2.e":"Amazon was launched in 1994.","c1l2.steps.13.title":"Puzzle of the Legends’ Sayings","c1l2.steps.13.intro":"Match each entrepreneur with their quote or achievement.","c1l3.ar":"Entrepreneurship & Life Skills","c1l3.realm":"Bridge of Two Ways","c1l3.boss.name":"The Two-Faced Alchemist","c1l3.boss.lore":"An alchemist who brews life and business in a single cauldron. He asks about the relationship between entrepreneurship and life skills, and about those who turned hardship into empires.","c1l3.steps.0.body":"<p>The relationship between entrepreneurship and life skills is <b>deeply intertwined</b> and works as a <b><em>two-way street</em></b>:</p> <p>➡️ <b>The entrepreneurial mindset builds life skills</b> (<em>The Entrepreneurial Mindset as a Life Skill</em>): entrepreneurship is more than launching a venture; it is <b>managing ambiguity</b> and proactively taking control of your destiny:</p> <ul><li><em>Adaptability & Resilience</em>: learning to <em>pivot</em> when the market changes trains you to bounce back from personal failures.</li> <li><em>Financial Literacy</em>: managing business accounts → managing household budgets and wealth.</li> <li><em>Opportunity Recognition</em>: seeing life’s problems as challenges to solve, not obstacles to fear.</li></ul> <p>⬅️ <b>Life skills are the foundation of entrepreneurship</b> (<em>Core Life Skills Essential for Entrepreneurship</em>):</p> <ul><li><em>Emotional Intelligence (EQ)</em>: empathy and social awareness to manage teams, negotiate and understand customers.</li> <li><em>Communication & Negotiation</em>: delivering a <em>pitch</em> and persuading.</li> <li><em>Time Management & Organization</em>: priorities, boundaries and balance to prevent <em>burnout</em>.</li></ul>","c1l3.steps.0.tip":"Entrepreneurship ⇄ Life: each feeds the other 🔄","c1l3.steps.0.qs.0.e":"A two-way street: each builds the other.","c1l3.steps.1.title":"Puzzle of the Bridge’s Two Directions","c1l3.steps.1.intro":"Is this a skill that entrepreneurship builds, or a core life skill essential for entrepreneurship? (as divided in the lecture)","c1l3.steps.2.body":"<p><b><em>Fostering the synergy</em></b>: institutions use <em>project-based learning</em> and <em>experiential training</em> to develop both together, e.g. the <em>Network for Teaching Entrepreneurship</em> and the <em>British Council</em>.</p> <p><b><em>“Entrepreneurship is a life skill”</em> — Wilfred M (2014)</b>:</p> <ul><li><em>Media hype</em> doesn’t show the time, effort and emotional cost of success. The writer himself dreamed of overnight success.</li> <li>We must separate <b>“being an entrepreneur”</b> (founding a company and raising capital) from <b>“having an entrepreneurial mindset”</b> (thinking like an entrepreneur in any context).</li> <li>The book <b><em>“The Startup of You”</em></b> by <b>Reid Hoffman</b> (LinkedIn founder) and <b>Ben Casnocha</b>.</li> <li>Entrepreneurship is basically <b>solving problems with limited resources while maximising productivity and profitability</b>. So is life! <em>“Life in reality is an entrepreneurial pursuit.”</em></li> <li>Conclusion: entrepreneurial thinking is <b>not a professional skill but a life skill</b>.</li></ul>","c1l3.steps.2.tip":"Mindset ≠ founding a company 🧠 | The Startup of You 📘","c1l3.steps.2.qs.1.e":"The essence of entrepreneurship according to the writer.","c1l3.steps.3.title":"Must an Entrepreneur Be Perfect?","c1l3.steps.3.body":"<p><b>No!</b> Entrepreneurs don’t need to be born masters of life skills. <b>Entrepreneurship itself is a practical school</b> where skills are built, tested and refined through experience.</p> <p>Essential skills in 3 groups:</p> <ul><li><b><em>Personal Mindset and Daily Habits</em></b>: <em>Resilience</em> (bouncing back quickly), <em>Adaptability</em>, <em>Self-Awareness</em> (know your weaknesses and ask for help), <em>Time Management</em>.</li> <li><b><em>Working With People</em></b>: <em>Communication</em>, <em>Emotional Intelligence</em> (staying calm under pressure), <em>Negotiation</em> (fair deals with suppliers, landlords and partners), <em>Active Listening</em>.</li> <li><b><em>Running the Business</em></b>: <em>Problem-Solving</em> (breaking big obstacles into small steps), <em>Financial Literacy</em> (tracking money and cash flow), <em>Decision-Making</em> (even with incomplete data).</li></ul> <p><b>Why isn’t perfection required?</b> <em>Growth mindset</em> (skills grow with practice) · <em>Building teams</em> (hiring experts or partners to fill gaps) · <em>Learning by doing</em> (mistakes are the first teacher).</p>","c1l3.steps.3.tip":"Mindset 🧠 · People 🤝 · Running the business 📊","c1l3.steps.3.qs.0.e":"Entrepreneurship is a practical school.","c1l3.steps.3.qs.2.e":"The reasons: growth mindset, building teams, learning by doing.","c1l3.steps.3.qs.3.e":"Problem-Solving belongs to Running the Business.","c1l3.steps.4.title":"Puzzle of the Three Towers","c1l3.steps.4.intro":"Place each skill in its group.","c1l3.steps.5.body":"<p><b><em>Resourcefulness</em></b>: the ability to find <b>quick, clever and independent</b> ways to overcome difficult situations or solve problems using what is available. According to the <em>Cambridge Dictionary</em>: the quality of <b>making decisions and acting on your own</b> when facing challenges.</p> <p>Core qualities:</p> <ul><li><em>Creativity</em>: thinking outside the box and using ordinary things in new ways.</li> <li><em>Adaptability</em>: adjusting quickly when plans fail.</li> <li><em>Independence</em>: acting without constant help or lots of money.</li></ul> <p>Everyday examples: fixing a latch with wire and tape 🔧 · cooking a tasty meal from leftovers 🍳 · learning to fix a tap from a free video when no plumber is available 🚰.</p>","c1l3.steps.5.tip":"Resourcefulness = creativity + adaptability + independence 🧰","c1l3.steps.5.qs.0.e":"The Cambridge definition.","c1l3.steps.5.qs.1.e":"The qualities: Creativity, Adaptability, Independence.","c1l3.steps.5.qs.2.e":"An everyday example of resourcefulness.","c1l3.steps.6.body":"<ul><li><b><em>Jan Koum (WhatsApp)</em></b>: emigrated from <b>Ukraine</b> to the US and lived on <b>food stamps</b>. He taught himself computer networking and built a messaging app focused on <b>simplicity</b> that sold for billions.</li> <li><b><em>Sophia Amoruso (Nasty Gal)</em></b>: lived out of a suitcase, hitchhiking and dumpster-diving. She sold <b>vintage</b> clothes on <b>eBay</b> and used early social media to build a multimillion-dollar fashion retailer from her bedroom.</li> <li><b><em>Sara Blakely (Spanx)</em></b>: started with <b>$5,000</b> of savings and no fashion background while selling <b>fax machines</b> door to door. She patented <em>footless pantyhose</em> herself. Her skill: resourcefulness and resilience in the face of rejection.</li> <li><b><em>Oprah Winfrey (Harpo Productions)</em></b>: overcame a poor, turbulent childhood through <b>emotional intelligence and communication skills</b>, and negotiated ownership of her show’s <em>syndication</em> rights to build a media empire.</li></ul>","c1l3.steps.6.tip":"Koum 📱 Ukraine · Amoruso 👗 eBay · Blakely 🩱 $5,000 · Oprah 📺 EQ","c1l3.steps.6.qs.3.e":"A small eBay store.","c1l3.steps.7.title":"Puzzle of the Heroes’ Stories","c1l3.steps.7.intro":"Match each entrepreneur with their story.","c2l1.ar":"Critical Thinking","c2l1.realm":"Tower of Scales","c2l1.boss.name":"The Illusionist","c2l1.boss.lore":"A sorcerer who feeds on bias and wishful thinking. He casts illusions that seem logical, and his spell only breaks with the eight standards of critical thinking and knowledge of its barriers.","c2l1.steps.0.title":"What Is Critical Thinking?","c2l1.steps.0.body":"<p><b><em>Norris and Ennis (1989)</em></b>: <em>“Critical thinking is <b>reasonable, reflective thinking</b> that is focused on <b>deciding what to believe or do</b>.”</em></p> <p>The word <em>critical</em> also means <em>“involving or exercising skilled judgment or observation”</em> — thinking clearly and intelligently.</p> <p>More precisely, it is the general term for a range of <b>cognitive skills and intellectual dispositions</b> needed to:</p> <ul><li>effectively identify, analyse and evaluate <b>arguments and truth claims</b>;</li> <li>discover and overcome <b>personal prejudices and biases</b>;</li> <li>formulate and present <b>convincing reasons</b> in support of conclusions;</li> <li>make reasonable, intelligent decisions about <b>what to believe and what to do</b>.</li></ul>","c2l1.steps.1.title":"Standards 1–4: Clarity, Precision, Accuracy, Relevance","c2l1.steps.1.body":"<p>Critical thinking is <b>disciplined thinking governed by intellectual standards</b>; the eight most important begin with:</p> <ol><li><b><em>Clarity</em></b>: we must clearly understand what someone is saying before we can evaluate it. Unclarity comes from laziness, carelessness or lack of skill, or from trying to sound clever and profound. We aim for clarity of <b>language</b> and clarity of <b>thought</b> (clear goals and priorities).</li> <li><b><em>Precision</em></b>: vital in medicine, mathematics and engineering, and in daily life: <b>precise answers to precise questions</b> — what exactly is the problem? what exactly are the alternatives?</li> <li><b><em>Accuracy</em></b>: <em>“Garbage in, garbage out”</em>: decisions based on false information = bad decisions. Critical thinkers are passionate about <b>accurate, up-to-date</b> information.</li> <li><b><em>Relevance</em></b>: staying focused on relevant ideas. A favourite debater’s trick: <b>distracting the audience with an irrelevant issue</b>.</li></ol>","c2l1.steps.1.qs.0.e":"False information → bad decisions = Accuracy.","c2l1.steps.2.title":"Standards 5–8: Consistency, Logical Correctness, Completeness, Fairness","c2l1.steps.2.body":"<ol start=\"5\"><li><b><em>Consistency</em></b>: if someone holds contradictory beliefs, at least one is false. Two kinds of inconsistency: <ul><li><b><em>Logical inconsistency</em></b>: saying or believing contradictory things that cannot all be true.</li> <li><b><em>Practical inconsistency</em></b>: <b>saying one thing and doing another</b>.</li></ul></li> <li><b><em>Logical Correctness</em></b>: reasoning logically = <b>drawing well-founded conclusions</b> from what we believe.</li> <li><b><em>Completeness</em></b>: <b>deep and thorough</b> thinking is better than shallow thinking.</li> <li><b><em>Fairness</em></b>: <b>open-minded, impartial and free of bias</b>. Hard because people resist unfamiliar ideas, prejudge and stereotype outsiders.</li></ol>","c2l1.steps.2.tip":"Practical inconsistency = saying but not doing 🗣️≠🏃","c2l1.steps.3.title":"Puzzle of the Eight Scales","c2l1.steps.3.intro":"Match each standard with its description to balance the scale.","c2l1.steps.4.title":"Barriers: Egocentrism and Sociocentrism","c2l1.steps.4.body":"<p>There are many barriers (prejudice, superstition, peer pressure, denial…), and the lecture details <b>eight</b>. The first:</p> <p><b>1) <em>Egocentrism</em></b>: the tendency to see reality as <b>centred on oneself</b>. Two forms:</p> <ul><li><b><em>Self-interested thinking</em></b>: accepting and defending beliefs that <b>fit your own interests</b>. Example: most doctors support laws that make it harder to sue them, most lawyers don’t. “It benefits me, so it’s good” is a trap.</li> <li><b><em>Self-serving bias</em></b>: the tendency to <b>overrate oneself</b>. Confidence based on real achievement is healthy; <b>overconfidence</b> is a barrier to growth.</li></ul> <p><b>2) <em>Sociocentrism</em></b>: <b>group-centred</b> thinking. Two forms:</p> <ul><li><b><em>Group bias</em></b>: seeing your group (nation, tribe, sect, peers) as <b>inherently better</b> than others; usually absorbed from childhood.</li> <li><b><em>Conformism</em></b>: <b>following the herd</b> and conforming to authority or group norms, out of the desire to belong.</li></ul>","c2l1.steps.4.tip":"Ego = me 🙋 (interest + overrating) | Socio = my group 👥 (bias + herd)","c2l1.steps.4.qs.1.e":"Accepting what fits your interest = Self-interested thinking.","c2l1.steps.4.qs.2.e":"Conformism is part of Sociocentrism.","c2l1.steps.5.title":"Barriers: Assumptions, Relativism, Wishful Thinking","c2l1.steps.5.body":"<p><b>3) <em>Unwarranted assumptions</em></b>: an assumption is something we take for granted <b>without conclusive proof</b> (almost all our thinking rests on assumptions). An <b>unwarranted assumption</b> is one we take as true <b>without good reason</b>. Example: liking someone makes you assume they like you back, so you misread their actions.</p> <p><b>4) <em>Relativistic thinking</em></b>: relativism = <b>truth is a matter of opinion</b>. Two forms:</p> <ul><li><b><em>Subjectivism</em></b>: truth is a matter of <b>individual opinion</b>; whatever a person believes is true for them, and there is no absolute objective truth.</li> <li><b><em>Cultural relativism</em></b>: truth is a matter of <b>social or cultural opinion</b>; what is right is whatever the majority of a society believes.</li></ul> <p><b>5) <em>Wishful thinking</em></b>: believing something <b>because you wish it were true</b>, not because of evidence. Throughout history, reason has often lost to it!</p>","c2l1.steps.5.tip":"Subjectivism = my opinion 👤 | Cultural relativism = my culture’s opinion 🌍","c2l1.steps.5.qs.0.e":"Subjectivism = individual opinion.","c2l1.steps.5.qs.3.e":"The lecture’s example of an unwarranted assumption.","c2l1.steps.6.title":"Barriers: Lack of Information, Poor Reading, Fear of Change","c2l1.steps.6.body":"<p><b>6) <em>Lack of relevant background information</em></b>: without enough information you don’t have the whole story. Example: you fought with your brother, he told your parents his version, and they judged and punished you <b>without hearing your side</b>. Remedy: don’t rely on the first thing you hear; research and ask.</p> <p><b>7) <em>Poor reading skills</em></b>: the lecture calls this <b><em>the most significant barrier</em></b>, because knowledge requires reading a lot of information, and poor reading hinders understanding and generating ideas.</p> <p><b>8) <em>Fear of change</em></b>: our beliefs give us comfort and direction, so anything that questions them feels threatening. Fear stops you from asking questions or facing evidence, <b>at the individual or institutional level</b>.</p>","c2l1.steps.6.tip":"The biggest barrier according to the lecture = Poor reading skills 📚","c2l1.steps.6.qs.1.e":"They only heard one side.","c2l1.steps.7.title":"Puzzle of the Barrier Masks","c2l1.steps.7.intro":"Match each barrier with its definition or example to reveal the mask.","c2l1.steps.8.title":"Critical vs Uncritical Thinkers","c2l1.steps.8.body":"<table class=\"cmp\"><tr><th>✅ Critical Thinkers</th><th>❌ Uncritical Thinkers</th></tr> <tr><td>Passion for clarity, precision and accuracy</td><td>Vague, imprecise thinking</td></tr> <tr><td>Alert to egocentrism and sociocentrism</td><td>Fall prey to them and to wishful thinking</td></tr> <tr><td>Analyse and fairly evaluate arguments</td><td>Misunderstand or unfairly judge arguments</td></tr> <tr><td>Draw logical conclusions from evidence</td><td>Unsupported conclusions</td></tr> <tr><td>Intellectually honest: admit what they don’t know</td><td>Pretend to know more than they do</td></tr> <tr><td>Listen openly and welcome criticism</td><td>Closed-minded and resist criticism</td></tr> <tr><td>Beliefs based on facts and evidence</td><td>Based on personal preference and self-interest</td></tr> <tr><td>Think independently; not afraid to disagree with the group</td><td><em>“Groupthink”</em>: follow the herd</td></tr> <tr><td>Get to the heart of the problem</td><td>Easily distracted</td></tr> <tr><td>Intellectual courage facing challenging ideas</td><td>Fear ideas that challenge their beliefs</td></tr> <tr><td>Seek the truth and are curious</td><td>Indifferent to truth and lack curiosity</td></tr></table> <p><b><em>Glaser (1941)</em></b> — thinking skills: recognising problems, finding workable means to solve them, gathering relevant information, <b>recognising unstated assumptions and values</b>, using language accurately and clearly, interpreting data, appraising evidence, recognising logical relationships, drawing and testing warranted conclusions, and reconstructing beliefs based on wider experience.</p>","c2l1.steps.8.tip":"Groupthink = the mark of an uncritical thinker 🐑","c2l1.steps.8.qs.0.e":"This is a trait of a critical thinker.","c2l1.steps.8.qs.1.e":"This is a trait of an uncritical thinker.","c2l1.steps.9.title":"Puzzle of the Two Mirrors","c2l1.steps.9.intro":"Is this a trait of a critical or an uncritical thinker?","c2l2.ar":"Problem Solving","c2l2.realm":"Maze of Obstacles","c2l2.boss.name":"Hydra of Problems","c2l2.boss.lore":"Cut off one head and two grow back… unless you first define the real problem and follow the six-step model in order. The hydra tests your patience and your method.","c2l2.steps.0.body":"<p>Before designers produce solutions they must first <b>frame</b> the problem (and often reframe it) instead of jumping straight to solutions. <b>How you diagnose and frame a problem determines how you will address it</b>.</p> <p><b><em>Problem framing</em></b>: <em>taking ownership of and iteratively define what the problem really is, decide what should be included and excluded, and decide how to proceed in solving it.</em></p> <p>That is: own the problem, define it <b>iteratively</b>, set its boundaries (what is in and what is out), and decide how to proceed (<em>Dorst & Cross, 2001; Schön, 1983</em>).</p> <p>⚠️ Framing is not just a first step; it is <b>an ongoing process until the design is complete</b>. Before solving anything, make sure you are working on <b>the right problem</b>.</p>","c2l2.steps.0.tip":"Don’t jump to the solution! Define → bound → decide 🖼️","c2l2.steps.0.qs.1.e":"An ongoing process until the design is complete.","c2l2.steps.1.body":"<p><b><em>Problem statements</em></b> are concise and clarify the problem frame. They are written in three parts:</p> <ol><li><b>The vision</b> (1–2 sentences): what is possible if the problem is solved? <em>a vision of what is possible</em></li> <li><b>The specific issues</b> (1–2 sentences): including <em>who, what, when, where, why</em>.</li> <li><b>Symptoms and evidence</b> (1–2 sentences): <em>the primary symptoms of and evidence for the problem</em>.</li></ol> <p>🚫 <b>Never put a solution in a problem statement!</b> And expect to rewrite it <b>several times</b> as your understanding changes.</p>","c2l2.steps.1.tip":"Vision → issues (5W) → symptoms… and no solution 🚫","c2l2.steps.1.qs.1.e":"It begins with the vision.","c2l2.steps.2.title":"Puzzle of the Statement Scroll","c2l2.steps.2.intro":"Put the parts of the problem statement in the correct order.","c2l2.steps.3.title":"What Is a Problem? And What Is Its Solution?","c2l2.steps.3.body":"<p><b>Oxford Dictionary</b>: a problem is <em>“a situation in which we are <b>reluctant</b> (unwilling) to find ourselves and perceive it as <b>harmful</b>, in need of resolution or overcoming.”</em></p> <p>All problems share two things: <b><em>goals</em> and <em>obstacles</em></b>. Without obstacles there would be no problem.</p> <p>A problem = <b>a set of information + a question</b> to answer. What matters is having a <b>strategy</b> that leads to the solution (methodical or trial and error). <b>Developing strategies is the heart of problem-solving</b>.</p> <p><b><em>Problem-solving</em></b>: overcoming the obstacles that stand in the way of our success. Some definitions:</p> <ul><li>the process of reasoning towards solutions using <b>more than just applying previously learned procedures</b>;</li> <li>a person’s capacity to engage in cognitive processing to understand and resolve problems <b>whose method of solution is not immediately obvious</b>.</li></ul>","c2l2.steps.3.tip":"Every problem = a goal 🎯 + an obstacle 🧱","c2l2.steps.4.title":"The Five Problem-Solving Tools","c2l2.steps.4.body":"<p>The core skills of the best problem-solvers:</p> <ol><li><b><em>Creativity</em></b>: producing elegant, original, high-quality solutions to <b>complex, novel and ill-defined</b> problems; brainstorming and thinking outside the box.</li> <li><b><em>Teamwork</em></b>: working collaboratively to address a group or social problem.</li> <li><b><em>Logical thinking skills</em></b>: analytical skills and a <b>methodical</b> process to diagnose the cause of a problem.</li> <li><b><em>High emotional intelligence</em></b>: essential in <b>interpersonal conflicts</b> or changes that affect people emotionally.</li> <li><b><em>Decision making</em></b>: problem-solving and decision-making go hand in hand; you need confidence to make a decision and follow through.</li></ol>","c2l2.steps.4.tip":"Creativity · Team · Logic · EQ · Decision 🖐️","c2l2.steps.4.qs.0.e":"EQ for interpersonal conflicts.","c2l2.steps.5.title":"Puzzle of the Five Tools","c2l2.steps.5.intro":"Match each tool with its description.","c2l2.steps.6.title":"Problem-Solving vs Decision-Making","c2l2.steps.6.body":"<p>You can’t solve a problem without making a decision, but the key difference: <b>the first is a <em>process</em> and the second is an <em>action</em></b>.</p> <table class=\"cmp\"><tr><th><em>Problem-solving</em></th><th><em>Decision-making</em></th></tr> <tr><td>An <b>analytical</b> way to identify possible solutions</td><td>The process of <b>choosing</b> a solution based on judgement, the situation, facts and knowledge</td></tr> <tr><td>Goal: find <b>the best solution</b></td><td>Goal: <b>avoid potential difficulties</b></td></tr> <tr><td>Defining the issue, finding causes, asking questions, brainstorming</td><td><b>Identifying opportunities</b> is an important part of it</td></tr> <tr><td>A complex process containing decisions</td><td>Often a part of problem-solving</td></tr></table> <p>🧠 <b>Critical thinking enhances problem-solving</b>: it concerns how you think, make decisions and use judgement, and helps you ask the right questions and evaluate information to make informed decisions.</p> <p>Problem-solving models: <em>Analytical Problem-Solving Approach (FEMA)</em>, <em>Creative Problem-Solving Model (Mindtools)</em>, <em>Fred Nickols’ Four-Step Model</em>, <em>Six-Step Model</em>… they all share roughly the same steps.</p>","c2l2.steps.6.tip":"Problem-solving = process 🔄 | Decision-making = action ✅","c2l2.steps.7.title":"Puzzle of the Two Paths","c2l2.steps.7.intro":"Does the statement describe problem-solving or decision-making?","c2l2.steps.8.body":"<ol><li><b><em>Problem Definition</em></b>: make sure what the problem <b>really</b> is; don’t get busy solving an easier problem! Define it precisely: what factors? who is involved? when? where? (via brainstorming, interviews, surveys).</li> <li><b><em>Problem Analysis</em></b>: look at it from <b>different angles</b>: how does it affect things? whom? who else suffers from it? how do others deal with it?</li> <li><b><em>Establish Goals</em></b>: what do we want to achieve? <em>“What is the immediate goal?”</em> (e.g. better time management, handing in assignments on time, raising grades).</li> <li><b><em>Generate Possible Solutions</em></b>: as many solutions as possible; ask what was done before, consult friends, teachers, books and the internet, <b>and write down every possibility</b>.</li> <li><b><em>Analyze the Solution</em></b>: pros and cons of each alternative: is it relevant? realistic? manageable? its consequences? its likelihood of reaching the goal?</li> <li><b><em>Implementation</em></b>: carry out the chosen solution with <b>continuous monitoring</b> of its effectiveness.</li></ol> <p>🔄 Problem-solving is a <b><em>cycle</em></b>: if the problem isn’t solved, start again. Each step is completed before the next, and you can go back to an earlier step.</p>","c2l2.steps.8.tip":"Define → analyse → goals → generate → evaluate → implement 🔁","c2l2.steps.8.qs.0.e":"Step 3: Establish Goals.","c2l2.steps.8.qs.1.e":"Step 5.","c2l2.steps.8.qs.2.e":"Step 6: Implementation + monitoring.","c2l2.steps.8.qs.3.e":"Step 2: Problem Analysis.","c2l2.steps.9.title":"Puzzle of the Six-Step Ladder","c2l2.steps.9.intro":"Put the model’s six steps in order to climb the ladder.","c2l2.steps.10.title":"Advantages of the Model + Tips to Improve","c2l2.steps.10.body":"<p><b>Advantages of the Six-Step Model</b>: a focused procedure for the group · <b>consistency</b> (everyone understands the method) · using data <b>eliminates bias</b> and increases objectivity · removes divisions and encourages collaboration · stops groups from <b>branching off into other problems</b> · helps reach <b>consensus</b> · removes confusion caused by different techniques · eases decision-making · provides <b>a justified solution</b>.</p> <p><b>Tips to improve your problem-solving skills</b>:</p> <ul><li><em>Clearly define the problem</em>: you can’t solve a <em>nebulous</em> problem.</li> <li><em>Focus on the solution</em>: don’t over-focus on the causes of the problem.</li> <li><em>Agree on a process</em>: agree on ground rules to prevent conflict later.</li> <li><em>Acquire more technical knowledge</em> · <em>Seek out opportunities to solve problems</em> (volunteer for new projects) · <em>Do practices</em> (training and role-play) · <em>Observe how others solve problems</em>.</li> <li><em>Be sure to use active listening</em>: <b>the best problem-solvers are great listeners</b>.</li></ul>","c2l2.steps.10.tip":"Best solver = best listener 👂","c2l2.steps.10.qs.0.e":"One of the model’s listed advantages.","c2l3.ar":"Self-Awareness","c2l3.realm":"Cave of Mirrors","c2l3.boss.name":"The Mirror Phantom","c2l3.boss.lore":"A phantom that takes your own shape! It knows your weaknesses before you do. You’ll only defeat it if you know yourself inside and out and master emotional intelligence and a personal SWOT analysis.","c2l3.steps.0.body":"<p><b><em>Emotional Intelligence (EI)</em></b>: a type of <b>social intelligence</b>; a person’s ability to <b>control their emotions</b> and use that to recognise and guide others’ emotions and actions. Simply put: <b>using emotions intelligently to your advantage</b>.</p> <p><b>Why it matters</b>: technical skills alone are not enough to succeed. High EI is <b>a strong predictor of high performance</b> and is directly related to <b>earning ability</b>.</p> <p>Popularised by <b><em>Dr. Daniel Goleman</em></b> in <em>“Emotional Intelligence: Why it can matter more than IQ”</em>. He found that EI (not cognitive ability) accounts for <b>90%</b> of the difference between star performers and average employees, and proposed <b>5 components</b>:</p> <ol><li><em>Self-Awareness</em>: honestly recognising your emotions <b>as they happen</b>.</li> <li><em>Self-Regulation</em>: controlling your emotions and thoughts.</li> <li><em>Personal Motivation</em>: the drive to achieve <b>for the sake of achievement</b>.</li> <li><em>Empathy</em>: sensitivity to others’ feelings when making decisions.</li> <li><em>Social Skills</em>: managing relationships to move people in the desired direction.</li></ol> <p>They form two clusters: <b><em>Personal Transformation</em></b> (Self-Awareness, Self-Regulation/Self-Management, Personal Motivation) and <b><em>Social Relationship Management</em></b> (Empathy, Relationship Skills).</p>","c2l3.steps.0.tip":"Goleman: 90% of the star-vs-average difference = EI ⭐","c2l3.steps.1.title":"Puzzle of the Two Clusters","c2l3.steps.1.intro":"Place each of Goleman’s components in its cluster.","c2l3.steps.2.title":"Puzzle of the Five Components","c2l3.steps.2.intro":"Match each component with its meaning.","c2l3.steps.3.title":"What Does Self-Awareness Mean?","c2l3.steps.3.body":"<p><b><em>Self-awareness</em></b> is <b>the first component</b> of emotional intelligence: the ability to be <b>honest with yourself</b> and to identify, understand and evaluate your own emotions — a deep understanding of your <b>emotions, strengths and weaknesses, needs and drives</b>.</p> <p>It is about knowing your mental state, abilities, preferences, resources and perceptions.</p> <p>Highly self-aware people are <b>neither overly pessimistic nor overly optimistic</b>; they are <b><em>candid</em></b> with themselves and others, at work and at home.</p> <p>🔗 Self-awareness is directly linked to <b><em>Self-Confidence</em></b>.</p>","c2l3.steps.3.tip":"Not pessimistic, not overly optimistic… candid 🪞","c2l3.steps.4.title":"The Two Types of Self-Awareness","c2l3.steps.4.body":"<ul><li><b><em>Internal self-awareness</em></b>: how clearly we see <b>our values, passions and aspirations</b>, our fit with our environment, our reactions (thoughts, feelings, behaviours, strengths, weaknesses) and our impact on others. It is linked to <b>higher job and relationship satisfaction</b> and happiness, and <b>negatively</b> linked to anxiety, stress and depression.</li> <li><b><em>External self-awareness</em></b>: understanding <b>how others see us</b>. People who know this are better at <b>empathy</b> and taking others’ perspectives. Leaders who see themselves as their employees do have better relationships, more satisfaction and higher effectiveness.</li></ul> <p><b>Examples</b>: a highly self-aware person knows tight deadlines bring out the worst in them, <b>so they plan early</b>. They understand how a demanding client affects their mood and channel their anger into something constructive. They firmly turn down <b>a financially tempting job offer</b> that doesn’t fit their principles and goals. Someone lacking self-awareness says: “The money was good so I signed… but I’m always bored.”</p>","c2l3.steps.4.tip":"Internal = how I see myself 👁️ | External = how people see me 👥","c2l3.steps.4.qs.1.e":"Internal: more happiness, less anxiety.","c2l3.steps.4.qs.2.e":"Their decisions match their values.","c2l3.steps.5.title":"Puzzle of the Two Mirrors","c2l3.steps.5.intro":"Does the statement describe internal or external self-awareness?","c2l3.steps.6.title":"Traits of Strongly Self-Aware People + Developing It","c2l3.steps.6.body":"<p><b>Traits of people with strong self-awareness</b>:</p> <ol><li>Direct, authentic and accurate self-assessment.</li><li>Confident: they voice their opinions <b>even when unpopular</b> and welcome feedback.</li><li>They perceive situations accurately and appreciate changes in their environment.</li><li>Willing to take risks for what they believe is right.</li><li>They believe they are the best fit for the job and present themselves that way.</li><li>Their decisions align with their values and beliefs.</li><li>A <b><em>self-deprecating</em></b> sense of humour: they laugh at themselves.</li></ol> <p><b>How to develop your self-awareness?</b> (a) a timeline of your major life events · (b) identify your role models and what you learned from them · (c) describe your strengths and weaknesses · (d) describe your usual way of solving problems · (e) identify at least <b>3 core values</b> and how they shape your decisions · (f) describe how you persuade and are persuaded.</p> <p><b>Benefits</b>: more <b><em>proactive</em></b> (vs the <em>procrastinator</em>) and accepting (<em>Sutton, 2016</em>) · seeing others’ perspectives, self-control, creativity and self-esteem (<em>Silvia & O’Brien, 2004</em>) · <b>better decisions</b> (<em>Ridley et al., 1992</em>) · better job performance, communication and confidence (<em>Sutton, Williams & Allinson, 2015</em>).</p>","c2l3.steps.6.tip":"Identify at least 3 core values 💎","c2l3.steps.6.qs.0.e":"Self-deprecating = laughs at oneself.","c2l3.steps.7.title":"Personal SWOT Analysis","c2l3.steps.7.body":"<p><b><em>SWOT</em></b> = <b>S</b>trengths, <b>W</b>eaknesses, <b>O</b>pportunities, <b>T</b>hreats.</p> <p>A SWOT analysis of yourself = <b>an objective, sharp look inward</b>. When you honestly list your strengths, we
